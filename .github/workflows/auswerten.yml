# =====================================================================
# Auswerten
# =====================================================================
# Feste Abfragen auf den Bestand, um Fragen zu beantworten, die sich
# nicht schätzen lassen: Wie viele Objekte tragen keine Wohnung? Welche
# Gebäudearten kommen vor? Wie viele hätte eine neue Regel getroffen?
#
# Bewusst ohne freie Eingabe: was hier läuft, steht im Repository und
# ist nachlesbar. Gelesen wird nur.
# =====================================================================

name: Auswerten

on:
  workflow_dispatch:
    inputs:
      frage:
        description: 'Was ausgewertet werden soll'
        required: true
        default: 'oeffentlich'
        type: choice
        options:
          - oeffentlich  # Schulen, Kirchen, öffentliche Bauten finden
          - arten        # Welche Gebäudearten und Kategorien vorkommen
          - objekt       # Ein einzelnes Objekt anhand seiner EGRID
          - projektiert  # Wie viele Bauten noch gar nicht stehen
          - kantone      # Was die Webseite je Kanton zu sehen bekommt
          - potenzial    # Wo ueberall ein Potenzial gerechnet wurde
          - zonen-tg     # Zonen im Thurgau, nur eindeutig zugeordnete Parzellen
          - kette        # Wo die abgefragten Objekte gerade stehen
          - eigentuemer  # Jede eingetragene Auskunft, zum Nachpruefen
          - instanzen    # Zeigen Seite und Datenbank auf dasselbe Projekt?
          - kartendienst # Was der WMS des Bundes an Bildgroesse liefert
          - nachbarn     # Ob die Nachbarsuche beim Bund mit echten Umrissen geht
          - kloten       # Parzellen in Kloten fuer das Test-Portfolio, und ob der Bund ihre Umrisse liefert
          - regeln       # Wer darf was -- die Zugriffsregeln der Tabellen
          - plattform    # Was im neuen Modell steht (Zahlen, keine Namen)
          - konten       # Welche Anmeldekonten bestehen, und seit wann
          - suche        # Wie schnell die Eigentuemersuche ist, und ob ein Index fehlt
          - ortsdienst   # Welcher Dienst aus einer IP-Adresse den Ort liefert (Felder, CORS)
          - import       # Ob der Portfolio-Import Adressen der richtigen Parzelle zuordnet
          - arrondierung # Wie viele Nachbarn der Test-Portfolios der Bund liefert und wie viele im Bestand sind
          - baugesuche   # Wo der Zuercher Baugesuch-Datensatz liegt, und wie er aufgebaut ist
          - baugesuch-probe # Ob ein Gesuch beim Nachbarn einer Portfolio-Parzelle eine Gelegenheit erzeugt (wird zurueckgerollt)
          - teams-probe  # Ob ein Konto ausserhalb eines Teams dessen Kunden wirklich nicht sieht (wird zurueckgerollt)
          - potenzial-bund # Was der Bund an einem Punkt zu Bauzone und Parzelle liefert (fuer den Potenzialcheck)
          - anfrage-probe # Ob der oeffentliche Schluessel Anfragen einfuegen, aber nicht lesen kann (wird zurueckgerollt)
          - nachbar-baut # Wie viele Gelegenheiten 'Nachbar baut' je Schwelle entstünden (zählt nur)
          - demo         # Ob die Demo-Szenarien der Zentrale vollständig in der Datenbank stehen
          - ohne-egrid   # Wie die Zürcher Zeilen ohne EGRID aussehen (Gemeindenamen, Nummernformat, Herkunft)
          - indizes      # Welche Indizes auf properties wie gross sind und ob sie je benutzt werden
          - parzellen-zh # Ob jede Zürcher Parzelle im Bestand ist und welche Felder leer sind
          - amtsblatt-jahr # Ob die Baugesuche des Jahres (Amtsblatt-Export) in Quelle und Datenbank stehen
          - luftbild     # Ob der Bund Luftbilder (SWISSIMAGE) als ein Bild je Ausschnitt liefert
          - tempo        # Wie schnell die Seite und die Abfragen der Hauptbereiche sind
          - vorhaben-probe # Ob die Potenzialanalyse eines Vorhabens mit 1000 Adressen stimmt und wie schnell sie ist (wird zurueckgerollt)
          - amtsblatt    # Welche Adresse im Amtsblattportal ein Baugesuch zeigt
          - dicht        # Ob der öffentliche Schlüssel noch etwas lesen kann und die Funktionen Fremde abweisen (nur Codes)
          - gelegenheiten-tempo # Wie lange die Liste der Gelegenheiten als angemeldetes Konto braucht (nur Zahlen)
      egrid:
        description: 'Nur für "objekt": die EGRID, z.B. CH707709971116'
        required: false
        default: ''

jobs:
  auswerten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge
        run: sudo apt-get install -y -qq postgresql-client

      - name: Abfrage
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          # Die Eingaben als Variablen, nicht als ${{ }} im Skript: GitHub
          # behandelt einen Block mit Ausdruecken als einen einzigen
          # Ausdruck, und der darf hoechstens 21000 Zeichen lang sein.
          # Dieser Block ist laenger -- der Ablauf startete gar nicht mehr.
          FRAGE: ${{ inputs.frage }}
          EGRID: ${{ inputs.egrid }}
        run: |
          set -euo pipefail
          [ -n "${DB:-}" ] || { echo "Kein Datenbankzugang."; exit 1; }

          frage() {
            echo "### $1" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            psql "$DB" -v ON_ERROR_STOP=1 -X -q -c "$2" \
              >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$FRAGE" = "objekt" ]; then
            # Nur EGRID-Form zugelassen -- damit steht fest, dass hier
            # keine fremde Abfrage in die Datenbank gelangt.
            kennung=$(printf '%s' "$EGRID" \
                      | tr -cd 'A-Za-z0-9')
            case "$kennung" in
              CH*) ;;
              *) echo "Keine gültige EGRID."; exit 1 ;;
            esac
            frage "Objekt $kennung" "
              select address, gemeinde, plz, parzelle, egrid,
                     area, bebaubar_m2, gebaeudeflaeche, baujahr,
                     geschosse, vollgeschosse, wohnungen,
                     coalesce(geb_status,'(leer)')  as gebaeudestatus,
                     coalesce(gebaeudeart,'(leer)') as gebaeudeart,
                     coalesce(kategorie,'(leer)')   as kategorie,
                     zone, round(marge_chf/1e6,1) as marge_mio,
                     ausgeschlossen, ausschluss_grund,
                     bfs_nr, gwr_egid, hnf_bestand, hnf_delta, hnf_neu,
                     gf_bestand, gf_zulaessig, ausnuetzung,
                     vollgeschosse_zulaessig,
                     coalesce(housing_stat_url,'(leer)') as housing_stat_url,
                     -- Zwei Felder tragen den Eigentuemer: das eine
                     -- kommt aus der Abfrage, das andere aus der
                     -- Handeingabe. Wer nur eines liest, sieht "leer",
                     -- wo etwas steht.
                     -- Nur ob etwas da ist, nicht was: das Protokoll
                     -- eines öffentlichen Repositorys ist öffentlich.
                     case when coalesce(eigentuemer_name,'') = '' then '(leer)' else 'vorhanden' end as aus_abfrage,
                     case when coalesce(owner_name,'') = '' then '(leer)' else 'vorhanden' end       as eingetragen,
                     case when coalesce(owner_phone,'') = '' then '(leer)' else 'vorhanden' end      as telefon,
                     is_queried, status,
                     coalesce(pipedrive_deal_id,'(leer)') as deal
              from properties where egrid = '$kennung';"

          elif [ "$FRAGE" = "projektiert" ]; then
            # Das Gebäuderegister führt den Status: projektiert,
            # bewilligt, im Bau, bestehend. Ein Haus, das noch nicht
            # steht, ist kein Anruf wert -- dort wird gerade gebaut.
            frage "Gebäudestatus im Bestand" "
              select coalesce(geb_status,'(leer)') as status, count(*),
                     count(*) filter (where marge_chf > 1000000) as in_der_liste
              from properties where ausgeschlossen = false
              group by 1 order by 2 desc limit 20;"
            frage "Neubauten der letzten Jahre" "
              select baujahr, count(*),
                     count(*) filter (where marge_chf > 1000000) as in_der_liste
              from properties
              where ausgeschlossen = false and baujahr >= 2020
              group by 1 order by 1 desc;"

          elif [ "$FRAGE" = "kette" ]; then
            # Wo bleiben die Objekte? Jede Rubrik der Webseite hat eine
            # Bedingung; hier steht, wie viele sie jeweils erfuellen --
            # und woran die uebrigen scheitern.
            frage "Die Kette in Zahlen" "
              select
                count(*) filter (where coalesce(owner_name,'') <> '')
                                                        as mit_eigentuemer,
                count(*) filter (where coalesce(owner_name,'') <> ''
                                   and coalesce(owner_phone,'') = '')
                                                        as ohne_nummer,
                count(*) filter (where coalesce(owner_name,'') <> ''
                                   and coalesce(owner_phone,'') = ''
                                   and is_queried = false)
                                                        as in_nummern,
                count(*) filter (where coalesce(owner_name,'') <> ''
                                   and coalesce(owner_phone,'') <> ''
                                   and pipedrive_deal_id is null)
                                                        as bereit_pipedrive,
                count(*) filter (where pipedrive_deal_id is not null)
                                                        as mit_deal
              from properties;"
            # Der Bereich "Post" zeigt nur, was status='Post' traegt.
            # Steht hier 0, ist der Bereich leer -- und damit unsichtbar.
            frage "Wie die Objekte auf status verteilt sind" "
              select coalesce(status,'(leer)') as status, count(*)
              from properties
              where coalesce(owner_name,'') <> ''
              group by 1 order by 2 desc;"
            frage "Die zuletzt bearbeiteten Objekte" "
              select left(address, 28) as adresse,
                     coalesce(kanton,'')                as kt,
                     case when coalesce(owner_name,'') = '' then '(leer)' else left(owner_name, 1) || '***' end as eigentuemer,
                     case when coalesce(owner_phone,'') = '' then '(leer)' else 'vorhanden' end as telefon,
                     is_queried,
                     coalesce(ausgeschlossen::text,'')  as ausg,
                     coalesce(preselection_status,'')   as vorauswahl,
                     coalesce(status,'')                as status,
                     coalesce(pipedrive_deal_id,'(leer)') as deal
              from properties
              where coalesce(owner_name,'') <> ''
              order by coalesce(eigentuemer_fetched_at, updated_at) desc nulls last
              limit 12;"

          elif [ "$FRAGE" = "instanzen" ]; then
            # Es gibt mehr als ein Supabase-Projekt. Die Frage ist
            # nicht, wie sie heissen, sondern ob Seite und Datenbank
            # auf dasselbe zeigen. Ausgegeben wird deshalb nur ja oder
            # nein -- die Verbindungsangabe selbst nie.
            SEITE=$(grep -o 'https://[a-z0-9]*\.supabase\.co' .env | head -1 \
                    | sed 's|https://||; s|\.supabase\.co||')
            echo "### Wohin zeigt was" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "Seite (.env):        $SEITE" >> "$GITHUB_STEP_SUMMARY"
            case "$DB" in
              *"$SEITE"*) echo "Datenbank-Secret:    dasselbe Projekt" >> "$GITHUB_STEP_SUMMARY" ;;
              *)          echo "Datenbank-Secret:    EIN ANDERES Projekt" >> "$GITHUB_STEP_SUMMARY" ;;
            esac
            case "$DB" in
              *yafinyvlnjldxvwgtofw*) echo "yafinyvlnjldxvwgtofw: das ist das Datenbank-Secret" >> "$GITHUB_STEP_SUMMARY" ;;
              *)                      echo "yafinyvlnjldxvwgtofw: nicht das Datenbank-Secret" >> "$GITHUB_STEP_SUMMARY" ;;
            esac
            for REF in yafinyvlnjldxvwgtofw ohabximzclorjaanpbxq "$SEITE"; do
              ST=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                   "https://$REF.supabase.co/rest/v1/" || echo 000)
              echo "erreichbar $REF:  HTTP $ST" >> "$GITHUB_STEP_SUMMARY"
            done
            # Was die ausgelieferte Seite benutzt, steht nicht in .env,
            # sondern im Buendel, das im Browser laeuft. Nur das
            # entscheidet, welche Instanz wirklich gebraucht wird.
            HTML=$(curl -sL --max-time 30 https://wohntraums.life/ || true)
            JS=$(printf '%s' "$HTML" | grep -o '/assets/[^"]*\.js' | head -1)
            if [ -n "$JS" ]; then
              GEFUNDEN=$(curl -sL --max-time 60 "https://wohntraums.life$JS" \
                         | grep -o '[a-z0-9]\{20\}\.supabase\.co' | sort -u | tr '\n' ' ')
              echo "im Buendel der Seite:  ${GEFUNDEN:-nichts gefunden}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "im Buendel der Seite:  Buendel nicht gefunden" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$GITHUB_STEP_SUMMARY"
            exit 0

          elif [ "$FRAGE" = "kloten" ]; then
            # Fuer das Test-Portfolio "Test AG": wie viele Parzellen in
            # Kloten mit EGRID im Bestand sind, und ob der Bund zu einer
            # EGRID den Umriss liefert -- Zuercher Parzellen haben keinen
            # eigenen. Nur Nummern und EGRID, keine Adressen, keine Namen.
            frage "Kloten im Bestand" "
              select count(*) as parzellen,
                     count(*) filter (where egrid is not null) as mit_egrid,
                     count(*) filter (where coalesce(address,'') <> '') as mit_adresse,
                     count(*) filter (where geometrie is not null) as mit_umriss
              from properties where gemeinde ilike 'Kloten%';"
            E=$(psql "$DB" -X -t -A -c "select egrid from properties where gemeinde ilike 'Kloten%' and egrid is not null and coalesce(address,'') <> '' order by area desc nulls last limit 1;")
            {
              echo "### Umriss beim Bund per EGRID"; echo '```'
              curl -s -G 'https://api3.geo.admin.ch/rest/services/all/MapServer/find' \
                --data-urlencode 'layer=ch.kantone.cadastralwebmap-farbe' --data-urlencode 'searchField=egris_egrid' \
                --data-urlencode "searchText=$E" --data-urlencode 'contains=false' --data-urlencode 'returnGeometry=true' \
                --data-urlencode 'geometryFormat=geojson' --data-urlencode 'sr=4326' \
                | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('results',[]); print('Treffer', len(r)); [print(' ', x.get('geometry',{}).get('type'), 'Eckpunkte', len(json.dumps(x.get('geometry',{}).get('coordinates',[])).split('],['))) for x in r[:2]]; print(' Felder', sorted((r[0].get('properties') or r[0].get('attributes') or {}).keys()) if r else '-')"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

          elif [ "$FRAGE" = "nachbarn" ]; then
            # Die Karte fragt beim Bund nach den Nachbarn einer Parzelle,
            # mit ihrem Umriss. Aus der Entwicklungsumgebung ist der Dienst
            # nicht erreichbar; hier wird die Anfrage mit echten Umrissen
            # nachgestellt. Siehe tools/nachbarn_pruefen.mjs.
            { echo "### Nachbarsuche beim Bund"; echo '```'; node tools/nachbarn_pruefen.mjs; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            ROH=1 node tools/nachbarn_pruefen.mjs | grep '^ROH_' || true
            cat "$GITHUB_STEP_SUMMARY"
            exit 0

          elif [ "$FRAGE" = "kartendienst" ]; then
            # Die Karte holt Grenzen und Bauzonen als ein Bild je
            # Ausschnitt. Wie gross es sein darf, steht in den
            # Capabilities des Dienstes -- und ob er es liefert, sagt
            # nur eine Anfrage. Beides hier, damit der Deckel in
            # src/lib/karte-ebenen.ts gemessen ist und nicht geraten.
            # Aus der Entwicklungsumgebung ist der Dienst nicht
            # erreichbar; von hier schon.
            echo "### Kartendienst wms.geo.admin.ch" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            CAP=$(curl -sL --max-time 90 \
              'https://wms.geo.admin.ch/?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetCapabilities' || true)
            echo "Capabilities:  $(printf '%s' "$CAP" | wc -c) Zeichen" >> "$GITHUB_STEP_SUMMARY"
            echo "MaxWidth:      $(printf '%s' "$CAP" | grep -o '<MaxWidth>[0-9]*' | head -1 | tr -dc 0-9)" >> "$GITHUB_STEP_SUMMARY"
            echo "MaxHeight:     $(printf '%s' "$CAP" | grep -o '<MaxHeight>[0-9]*' | head -1 | tr -dc 0-9)" >> "$GITHUB_STEP_SUMMARY"
            # Ein Ausschnitt in Zuerich (Web-Mercator), zwei Kilometer breit.
            BBOX=950000,5990000,952000,5991000
            for S in 1024 2048 4096 8192; do
              ST=$(curl -s -o /tmp/bild.png -w '%{http_code} %{content_type} %{size_download}B' --max-time 180 \
                "https://wms.geo.admin.ch/?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=ch.kantone.cadastralwebmap-farbe&STYLES=&SRS=EPSG:3857&BBOX=$BBOX&WIDTH=$S&HEIGHT=$S&FORMAT=image/png&TRANSPARENT=TRUE" \
                || echo "000")
              echo "GetMap ${S}x${S}:  $ST" >> "$GITHUB_STEP_SUMMARY"
            done
            # Ab welchem Zoom zeigt der Kataster Linien statt gruener
            # Flaeche? Derselbe Punkt in Zuerich (Stadelhofen), Bildgroesse
            # wie ein Bildschirm, Ausschnitt so gross wie bei Zoom z.
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Kataster, Anteil Flaeche je Zoom (Zuerich Stadelhofen, 1000x600):" >> "$GITHUB_STEP_SUMMARY"
            for Z in 13 14 15 16 17 18; do
              M=$(python3 -c "print(40075016.69/256/2**$Z)")
              B=$(python3 -c "x,y=950980,6003550; m=$M; print(f'{x-500*m},{y-300*m},{x+500*m},{y+300*m}')")
              curl -s -o /tmp/z.png --max-time 120 \
                "https://wms.geo.admin.ch/?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=ch.kantone.cadastralwebmap-farbe&STYLES=&SRS=EPSG:3857&BBOX=$B&WIDTH=1000&HEIGHT=600&FORMAT=image/png&TRANSPARENT=TRUE" || true
              echo "  Zoom $Z:  $(python3 tools/gruen_zaehlen.py /tmp/z.png 2>&1 | tail -1)" >> "$GITHUB_STEP_SUMMARY"
            done
            # Und: findet identify die Parzellen, die ein Polygon beruehrt?
            # Davon haengt ab, ob Nachbarn auch ohne eigenen Umriss gehen.
            POLY='{"rings":[[[2683800,1246700],[2683900,1246700],[2683900,1246800],[2683800,1246800],[2683800,1246700]]]}'
            ST=$(curl -s -o /tmp/ident.json -w '%{http_code}' --max-time 90 -G \
              'https://api3.geo.admin.ch/rest/services/all/MapServer/identify' \
              --data-urlencode "geometry=$POLY" --data-urlencode 'geometryType=esriGeometryPolygon' \
              --data-urlencode 'sr=2056' --data-urlencode 'tolerance=0' --data-urlencode 'returnGeometry=false' \
              --data-urlencode 'layers=all:ch.kantone.cadastralwebmap-farbe' \
              --data-urlencode 'mapExtent=2683500,1246400,2684200,1247100' --data-urlencode 'imageDisplay=700,700,96' \
              --data-urlencode 'lang=de' || echo "000")
            TREFFER=$(python3 -c "import json;print(len(json.load(open('/tmp/ident.json')).get('results',[])))" 2>/dev/null || echo '?')
            echo "identify Polygon:  HTTP $ST, $TREFFER Parzellen" >> "$GITHUB_STEP_SUMMARY"
            echo "Attribute des ersten Treffers: $(python3 -c "import json;r=json.load(open('/tmp/ident.json')).get('results',[]);print(sorted((r[0].get('attributes') or {}).keys()) if r else '-')" 2>/dev/null)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$GITHUB_STEP_SUMMARY"
            exit 0

          elif [ "$FRAGE" = "eigentuemer" ]; then
            # Das Lesezeichen hat eine Zeitlang die erste Nummer der
            # Seite genommen statt die des Auszugs. Dann steht ein
            # Eigentuemer beim falschen Grundstueck. Hier steht alles
            # nebeneinander, was zum Nachpruefen noetig ist.
            frage "Jede eingetragene Auskunft" "
              select left(address, 26)                        as objekt,
                     coalesce(parzelle,'')                    as parz,
                     coalesce(egrid,'')                       as egrid,
                     -- Maskiert: das Protokoll ist öffentlich. Zum
                     -- Nachprüfen reicht, ob Parzelle und Auskunft
                     -- zusammenpassen; die Namen stehen in der App.
                     left(coalesce(owner_name,''), 1) || '***'  as eigentuemer,
                     case when coalesce(eigentuemer_adresse,'') = '' then '' else 'vorhanden' end as eig_adresse,
                     left(coalesce(eigentuemer_plz_ort,''), 4) as eig_plz,
                     to_char(eigentuemer_fetched_at, 'DD.MM HH24:MI') as wann
              from properties
              where coalesce(owner_name,'') <> ''
              order by eigentuemer_fetched_at desc nulls last;"

          elif [ "$FRAGE" = "plattform" ]; then
            # Nur Zahlen. Eigentuemernamen sind Personendaten und
            # haben in einem Ablaufprotokoll nichts verloren -- wer
            # sie sehen will, sieht sie in der Anwendung.
            frage "Das neue Modell" "
              select 'Akteure'                as was, count(*) from public.akteur
              union all select 'davon Personen',           count(*) from public.akteur where art='person'
              union all select 'davon Firmen',             count(*) from public.akteur where art='firma'
              union all select 'davon Institutionen',      count(*) from public.akteur where art='institution'
              union all select 'davon Erbengemeinschaften', count(*) from public.akteur where art='gemeinschaft'
              union all select 'Eigentumsbeziehungen',     count(*) from public.eigentum
              union all select 'Parzellen mit Geometrie',  count(*) from public.properties where geometrie is not null
              union all select 'Nachbarschaftspaare',      count(*) from public.nachbarschaft;"

            frage "Portfolios" "
              select pf.name as portfolio, a.name as eigner,
                     count(pp.id) as positionen,
                     count(pp.parzelle_id) as mit_parzelle,
                     count(distinct v.akteur_id) as manager
                from public.portfolio pf
                join public.mandant m on m.id = pf.mandant_id
                join public.akteur a on a.id = m.akteur_id
                left join public.portfolio_position pp on pp.portfolio_id = pf.id
                left join public.verwaltung v on v.parzelle_id = pp.parzelle_id
               group by 1, 2 order by 1;"

            frage "Hat das Zusammenfuehren gewirkt?" "
              with je as (
                select akteur_id, count(*) as parzellen
                from public.eigentum group by 1
              )
              select parzellen as parzellen_je_akteur,
                     count(*)  as so_viele_akteure
              from je group by 1 order by 1;"

            frage "Was ein Mensch nachsehen muss" "
              select grund, count(*) as faelle
              from public.eigentuemer_zu_pruefen
              group by 1 order by 2 desc;"

          elif [ "$FRAGE" = "regeln" ]; then
            # Am 31. Oktober stellte sich heraus: zugang_beschraenken
            # war eingespielt, und trotzdem las der oeffentliche
            # Schluessel alle 259'057 Objekte. Die alten anon-Regeln
            # von 20260414152532 hatte nie jemand entfernt -- die
            # Anmeldung davor war eine Tuer ohne Wand.
            #
            # Wer das wissen will, muss die Datenbank fragen, nicht die
            # Migrationen lesen. Hier steht, was wirklich gilt.
            frage "Was anon darf" "
              select c.relname                       as tabelle,
                     p.polcmd                        as befehl,
                     p.polname                       as regel
              from pg_policy p
              join pg_class c on c.oid = p.polrelid
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public'
                and 'anon' = any (
                      select r.rolname from pg_roles r
                      where r.oid = any (p.polroles))
              order by 1, 2;"

            frage "Tabellen ohne eingeschalteten Zeilenschutz" "
              select c.relname as tabelle
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public' and c.relkind = 'r'
                and not c.relrowsecurity
              order by 1;"

          elif [ "$FRAGE" = "zonen-tg" ]; then
            # Eine Parzelle kann zur Hälfte Wohnzone und zur Hälfte Wald
            # sein. Solche Fälle sagen über die Zone nichts Klares aus,
            # also zählen hier nur Parzellen mit genau einer Zone.
            frage "Wie eindeutig die Zuordnung ist" "
              with je as (
                select egrid, count(*) as zonen from public.verschnitt_tg
                group by 1
              )
              select
                count(*) filter (where zonen = 1) as eine_zone,
                count(*) filter (where zonen > 1) as mehrere_zonen,
                count(*)                          as parzellen
              from je;"
            # Der Klartext steht nicht im Verschnitt, sondern im
            # Bestand: dorthin wurden die Zonennamen geschrieben. Der
            # Verschnitt sagt nur, welche Parzelle eindeutig ist.
            frage "Zonen im Thurgau (nur Parzellen mit genau einer Zone)" "
              with eindeutig as (
                select egrid from public.verschnitt_tg
                group by egrid having count(*) = 1
              )
              select coalesce(nullif(trim(p.zone),''), '(ohne Zone)') as zone,
                     count(*)                  as parzellen,
                     round(avg(p.area))        as flaeche_schnitt_m2
              from public.properties p
              join eindeutig e on e.egrid = p.egrid
              where p.kanton = 'TG'
              group by 1 order by 2 desc limit 60;"

          elif [ "$FRAGE" = "suche" ]; then
            # Nur Zahlen und Plaene, keine Namen. Gemessen wird genau die
            # Abfrage, die die Karte stellt -- als "authenticated", mit
            # dessen Zeitgrenze, denn die gilt fuer die Seite.
            frage "Eigentuemer im Bestand" "
              select count(*) as objekte,
                     count(owner_name) as mit_eigentuemer,
                     count(distinct owner_name) as verschiedene_namen
              from properties;"
            frage "Zeitgrenzen der Rollen" "
              select rolname, rolconfig from pg_roles
              where rolname in ('anon','authenticated','authenticator');"
            frage "Trigramm-Erweiterung" "
              select name, installed_version, default_version
              from pg_available_extensions where name = 'pg_trgm';"
            frage "Indizes auf owner_name" "
              select indexname, indexdef from pg_indexes
              where tablename = 'properties' and indexdef ilike '%owner_name%';"
            frage "Dauer: Teilsuche wie die Karte (Swisscanto)" "
              explain (analyze, costs off, timing on)
              select owner_name from properties
              where owner_name ilike '%swisscanto%' limit 60;"
            frage "Dauer: Teilsuche ohne Treffer (seltenes Wort)" "
              explain (analyze, costs off, timing on)
              select owner_name from properties
              where owner_name ilike '%xqzyw%' limit 60;"
            frage "Dauer: Kennzahl Eigentuemer bekannt (wie die Seite)" "
              explain (analyze, costs off, timing on)
              select count(*) from properties where owner_name is not null;"
            frage "Dauer: passende Objekte zu einem Suchprofil (wie die Seite)" "
              explain (analyze, costs off, timing on)
              select id, address, gemeinde, kategorie, area, marge_chf from properties
              where ausgeschlossen = false and gemeinde in ('Zürich','Kloten')
                and kategorie in ('Mehrfamilienhaus')
              order by marge_chf desc nulls last limit 20;"
            frage "Treffer fuer Swisscanto, Helvetica, SFP (nur Anzahl)" "
              select w as wort, count(*) as objekte
              from (values ('swisscanto'),('helvetica'),('sfp')) v(w)
              join properties p on p.owner_name ilike '%'||w||'%'
              group by 1 order by 1;"

          elif [ "$FRAGE" = "import" ]; then
            # Die Parzellen der beiden Test-Portfolios, als Adresse so,
            # wie ein Kunde sie liefert -- einmal wie im Bestand, einmal
            # mit "str." und PLZ. Erwartet wird die EGRID aus dem Bestand.
            psql "$DB" -X -q -A -t -F $'\t' -v ON_ERROR_STOP=1 -c "
              select p.egrid, p.address || ', ' || p.gemeinde
              from portfolio_position pp join properties p on p.id = pp.parzelle_id
              where p.egrid is not null and p.address is not null
              union all
              select p.egrid, regexp_replace(p.address, 'strasse', 'str.') || ', ' || coalesce(p.plz::text, '') || ' ' || p.gemeinde
              from portfolio_position pp join properties p on p.id = pp.parzelle_id
              where p.egrid is not null and p.address ilike '%strasse%'
              union all
              select p.egrid, p.address
              from portfolio_position pp join properties p on p.id = pp.parzelle_id
              where p.egrid is not null and p.address is not null
              limit 70;" > /tmp/liste.tsv
            { echo "### Portfolio-Import gegen den Bund"; echo '```'; npx -y tsx@4.19.2 tools/import_pruefen.ts < /tmp/liste.tsv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

          elif [ "$FRAGE" = "arrondierung" ]; then
            psql "$DB" -X -q -A -t -c "
              select p.egrid from portfolio_position pp join properties p on p.id = pp.parzelle_id
              where p.egrid is not null;" > /tmp/egrids.txt
            node tools/arrondierung_pruefen.mjs < /tmp/egrids.txt > /tmp/nachbarn.txt
            { echo "### Nachbarn je Portfolio-Parzelle (Bund)"; echo '```'; grep -v '^LISTE ' /tmp/nachbarn.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            liste=$(grep '^LISTE ' /tmp/nachbarn.txt | sed 's/^LISTE //')
            # Die EGRIDs sind gepruefte Form (CH + 12 Zeichen), also sicher im Text.
            frage "Davon im Bestand (nur Zahlen)" "
              select count(*) as im_bestand,
                     count(owner_name) filter (where owner_name <> '') as mit_eigentuemer,
                     count(*) filter (where marge_chf > 0) as mit_marge
              from properties where egrid = any (string_to_array('$liste', ','));"
            frage "Nachbarn insgesamt" "select array_length(string_to_array('$liste', ','), 1) as nachbarn_vom_bund;"

          elif [ "$FRAGE" = "baugesuche" ]; then
            { echo "### Baugesuche auf opendata.swiss"; echo '```'; python3 tools/baugesuche_quelle.py 2>&1 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

          elif [ "$FRAGE" = "baugesuch-probe" ]; then
            # Ein erfundenes Gesuch auf einer Parzelle, deren Nachbar im
            # Test-Portfolio liegt, und eines direkt auf einer Portfolio-
            # Parzelle. Dann der Abgleich, dann das Ergebnis -- und alles
            # wird zurueckgerollt. Es bleibt nichts liegen.
            psql "$DB" -v ON_ERROR_STOP=1 -X -q >> "$GITHUB_STEP_SUMMARY" <<'SQL'
          \echo '### Probe: Baugesuch beim Nachbarn und im Portfolio'
          \echo '```'
          begin;
          set local statement_timeout = '5min';
          with pf as (
            select p.egrid from portfolio_position pp join properties p on p.id = pp.parzelle_id
            where p.egrid is not null order by p.egrid limit 2
          )
          insert into baugesuch (quelle, fremd_id, publiziert_am, kanton, adresse, beschreibung, egrid, nachbar_egrids)
          select 'probe', 'nachbar', current_date, 'ZH', 'Probeweg 1', 'Probe: Neubau beim Nachbarn',
                 'CH000000000000', array[(select egrid from pf limit 1)]
          union all
          select 'probe', 'eigen', current_date, 'ZH', 'Probeweg 2', 'Probe: Umbau im Portfolio',
                 (select egrid from pf offset 1 limit 1), null;
          select * from baugesuche_abgleichen(30);
          select g.titel, g.prioritaet, string_agg(gp.rolle, ', ' order by gp.rolle) as rollen
          from gelegenheit g join baugesuch b on b.id = g.baugesuch_id
          left join gelegenheit_parzelle gp on gp.gelegenheit_id = g.id
          where b.quelle = 'probe' group by 1, 2 order by 1;
          \echo 'Zweiter Abgleich -- darf nichts doppelt anlegen:'
          select * from baugesuche_abgleichen(30);
          rollback;
          \echo '```'
          SQL

          elif [ "$FRAGE" = "teams-probe" ]; then
            # Als Konto "aui" (keine Admin-Rolle), so wie die Seite fragt:
            # Rolle authenticated, die Kennung im JWT. Ein Kunde in einem
            # fremden Team muss unsichtbar sein, nach dem Beitritt sichtbar.
            # Alles in einer Transaktion, die zurueckgerollt wird.
            psql "$DB" -v ON_ERROR_STOP=1 -X -q >> "$GITHUB_STEP_SUMMARY" <<'SQL'
          \echo '### Probe: Teams und Rechte'
          \echo '```'
          begin;
          create temp table probe_ids as
            select (select id from auth.users where email like 'aui@%') as aui;
          insert into team (name) values ('Probe-Team');
          insert into akteur (name, art) values ('Probe Kunde', 'firma');
          insert into mandant (akteur_id, team_id)
            select a.id, t.id from akteur a, team t where a.name = 'Probe Kunde' and t.name = 'Probe-Team';
          insert into portfolio (mandant_id, name)
            select m.id, 'Probe-Portfolio' from mandant m join team t on t.id = m.team_id where t.name = 'Probe-Team';
          grant select on probe_ids to authenticated;
          select set_config('request.jwt.claims', json_build_object('sub', (select aui from probe_ids), 'role', 'authenticated')::text, true);
          set local role authenticated;
          select 'aui, nicht im Team' as fall,
                 (select count(*) from portfolio where name = 'Probe-Portfolio') as fremdes_portfolio_sichtbar,
                 (select count(*) from portfolio where name <> 'Probe-Portfolio') as portfolios_ohne_team_sichtbar;
          reset role;
          insert into team_mitglied (team_id, user_id)
            select t.id, (select aui from probe_ids) from team t where t.name = 'Probe-Team';
          set local role authenticated;
          select 'aui, im Team' as fall,
                 (select count(*) from portfolio where name = 'Probe-Portfolio') as fremdes_portfolio_sichtbar;
          -- Anlegen ohne Team muss fuer aui gehen (Portfolio-Import).
          with a as (insert into akteur (name, art) values ('Probe Neu', 'firma') returning id)
          insert into mandant (akteur_id) select id from a;
          select 'aui legt Kunden ohne Team an' as fall, count(*) as angelegt
          from mandant m join akteur a on a.id = m.akteur_id where a.name = 'Probe Neu';
          rollback;
          \echo '```'
          SQL

          elif [ "$FRAGE" = "parzellen-zh" ]; then
            { echo "### Amtliche Vermessung: Liegenschaften ZH"; echo '```'; python3 tools/parzellen_zh.py 2>&1 | cut -c1-600 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            psql "$DB" -X -q >> "$GITHUB_STEP_SUMMARY" 2>&1 <<'SQL' || true
          \echo '### Bestand ZH: was ausgefüllt ist'
          \echo '```'
          set statement_timeout = '10min';
          select count(*) as parzellen,
                 count(distinct egrid) as verschiedene_egrid,
                 count(*) filter (where egrid is null) as ohne_egrid,
                 count(*) filter (where nullif(trim(address), '') is null) as ohne_adresse,
                 count(*) filter (where nullif(trim(parzelle), '') is null) as ohne_parzellennr,
                 count(*) filter (where bfs_nr is null) as ohne_bfs,
                 count(*) filter (where nullif(trim(gemeinde), '') is null) as ohne_gemeinde,
                 count(*) filter (where area is null or area = 0) as ohne_flaeche,
                 count(*) filter (where nullif(trim(zone), '') is null) as ohne_zone,
                 count(*) filter (where geometrie is null) as ohne_umriss
          from properties where kanton = 'ZH';
          select count(*) filter (where nullif(trim(kategorie), '') is null) as ohne_objektart,
                 count(*) filter (where baujahr is null) as ohne_baujahr,
                 count(*) filter (where gebaeudeflaeche is null) as ohne_gebaeudeflaeche,
                 count(*) filter (where wohnungen is null) as ohne_wohnungen,
                 count(*) filter (where geschosse is null) as ohne_geschosse,
                 count(*) filter (where hnf_delta is null) as ohne_potenzial,
                 count(*) filter (where marge_chf is null) as ohne_marge,
                 count(*) filter (where nullif(trim(owner_name), '') is null and nullif(trim(eigentuemer_name), '') is null) as ohne_eigentuemer,
                 count(*) filter (where ausgeschlossen) as ausgeschlossen
          from properties where kanton = 'ZH';
          select count(distinct bfs_nr) as gemeinden_mit_bfs, count(distinct gemeinde) as gemeinden_mit_namen
          from properties where kanton = 'ZH';
          -- Doppelte EGRID: dieselbe Parzelle zweimal im Bestand.
          select count(*) as egrid_mehrfach from (select egrid from properties where kanton = 'ZH' and egrid is not null group by egrid having count(*) > 1) d;
          \echo '```'
          SQL

          elif [ "$FRAGE" = "nachbar-baut" ]; then
            # Nur zaehlen (p_schreiben = false): je Mindestreserve und
            # Zeitraum, mit und ohne Filter auf Bauvorhaben.
            frage "Nachbar baut: Kandidaten je Schwelle" "
              set local statement_timeout = '10min';
              select t.tage, r.reserve, b.nur_bauvorhaben, x.gesuche, x.parzellen
              from (values (30), (90), (365)) t(tage)
              cross join (values (200), (500), (1000), (2000)) r(reserve)
              cross join (values (true), (false)) b(nur_bauvorhaben)
              cross join lateral public.gelegenheiten_nachbar_baut(t.tage, r.reserve, b.nur_bauvorhaben, false) x
              order by 1, 3 desc, 2;"

          elif [ "$FRAGE" = "demo" ]; then
            # Nur erfundene Firmen (Demo) -- Namen duerfen hier stehen.
            frage "Demo-Szenarien je Phase" "
              select zustand, count(*) as vorhaben, sum(adressen) as adressen
              from vorhaben_liste where kunde like '%(Demo)' group by 1 order by 1;"
            frage "Demo-Szenarien einzeln" "
              select left(kunde, 40) as kunde, art, zustand, adressen,
                     (select count(*) from portfolio_position pp where pp.portfolio_id = l.portfolio_id and pp.zuordnung = 'zugeordnet') as zugeordnet,
                     (select count(*) from vorhaben_eintrag e where e.vorhaben_id = l.id) as verlauf
              from vorhaben_liste l where kunde like '%(Demo)' order by adressen desc;"

          elif [ "$FRAGE" = "ohne-egrid" ]; then
            # 73'847 Zuercher Zeilen ohne EGRID; nur 156 trafen ueber
            # Gemeindename und Parzellennummer eine amtliche Liegenschaft.
            # Bevor 206'594 Parzellen neu entstehen, muss klar sein, wie
            # diese Zeilen aussehen -- sonst gibt es Doppel. Nur
            # Gemeindenamen, Nummernformate und Zaehlungen, keine Personen.
            frage "Herkunft" "
              set local statement_timeout = '10min';
              select coalesce(source_file, '(leer)') as quelle, count(*) as zeilen
              from properties where kanton = 'ZH' and egrid is null
              group by 1 order by 2 desc limit 15;"
            frage "Welche Felder gefuellt sind" "
              set local statement_timeout = '10min';
              select count(*) filter (where nullif(parzelle, '') is not null) as mit_parzelle,
                     count(*) filter (where nullif(plot_number, '') is not null) as mit_plot_number,
                     count(*) filter (where nullif(gemeinde, '') is not null) as mit_gemeinde,
                     count(*) filter (where nullif(gwr_egid, '') is not null) as mit_egid,
                     count(*) filter (where nullif(strassenname, '') is not null) as mit_strasse,
                     count(*) filter (where nullif(plz, '') is not null) as mit_plz,
                     count(*) filter (where nullif(gvz_nr, '') is not null) as mit_gvz,
                     count(*) filter (where pipedrive_deal_id is not null) as in_pipedrive,
                     count(*) filter (where status <> 'Neu') as bearbeitet
              from properties where kanton = 'ZH' and egrid is null;"
            frage "Gemeindenamen (haeufigste 40)" "
              set local statement_timeout = '10min';
              select gemeinde, count(*) as zeilen
              from properties where kanton = 'ZH' and egrid is null
              group by 1 order by 2 desc limit 40;"
            frage "Form der Parzellennummer" "
              set local statement_timeout = '10min';
              select regexp_replace(regexp_replace(coalesce(nullif(parzelle, ''), plot_number, '(leer)'), '[0-9]', '9', 'g'), '[A-Za-z]', 'A', 'g') as form,
                     count(*) as zeilen
              from properties where kanton = 'ZH' and egrid is null
              group by 1 order by 2 desc limit 20;"
            frage "Zum Vergleich: Form bei Zeilen mit EGRID" "
              set local statement_timeout = '10min';
              select regexp_replace(regexp_replace(coalesce(nullif(parzelle, ''), plot_number, '(leer)'), '[0-9]', '9', 'g'), '[A-Za-z]', 'A', 'g') as form,
                     count(*) as zeilen
              from properties where kanton = 'ZH' and egrid is not null
              group by 1 order by 2 desc limit 10;"

          elif [ "$FRAGE" = "indizes" ]; then
            # Die Datenbank steht bei 1093 MB, nur-lesen kam bei 1107 MB.
            # properties traegt 522 MB Indizes auf 395 MB Daten. Vor
            # jedem Loeschen: welche werden seit dem letzten Neustart
            # der Statistik nie gelesen?
            frage "Indizes auf properties" "
              select s.indexrelname as index,
                     pg_size_pretty(pg_relation_size(s.indexrelid)) as groesse,
                     s.idx_scan as gelesen,
                     i.indisunique as eindeutig
              from pg_stat_user_indexes s
              join pg_index i on i.indexrelid = s.indexrelid
              where s.relname = 'properties'
              order by pg_relation_size(s.indexrelid) desc;"
            frage "Seit wann die Statistik zaehlt" "
              select stats_reset from pg_stat_database where datname = current_database();"
            frage "Spalten mit dem meisten Platz (Stichprobe 5000 Zeilen)" "
              select a.attname as spalte,
                     round(avg(pg_column_size(t.*))) as zeile_gesamt
              from (select * from properties tablesample system (2) limit 5000) t,
                   pg_attribute a
              where a.attrelid = 'properties'::regclass and a.attnum = 1
              group by 1;"

          elif [ "$FRAGE" = "amtsblatt-jahr" ]; then
            { echo "### Baugesuche des Jahres"; echo '```'; python3 tools/amtsblatt_jahr.py 2>&1 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            psql "$DB" -X -q >> "$GITHUB_STEP_SUMMARY" 2>&1 <<'SQL' || true
          \echo '```'
          create temp table ab (id text);
          \copy ab from '/tmp/ab_ids.txt'
          select count(*) as amtsblatt,
                 count(*) filter (where exists (select 1 from baugesuch b where b.publikation_id = ab.id)) as in_datenbank,
                 (select count(distinct publikation_id) from baugesuch where quelle <> 'probe') as publikationen_in_datenbank,
                 (select min(publiziert_am) from baugesuch where quelle <> 'probe') as aelteste_in_datenbank
          from ab;
          \echo '```'
          SQL

          elif [ "$FRAGE" = "luftbild" ]; then
            # Das Cockpit zeigt Luftbilder wie die Vorlage. Geprueft wird
            # der WMS-Dienst des Bundes mit einem Ausschnitt in LV95 und
            # einem in WGS84 (Breite/Laenge, Reihenfolge nach WMS 1.3.0),
            # dazu die Kachel, die das Objektfenster schon benutzt.
            {
              echo "### Luftbild vom Bund"; echo '```'
              w='https://wms.geo.admin.ch/?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=ch.swisstopo.swissimage&STYLES=&FORMAT=image/jpeg'
              for u in \
                "$w&CRS=EPSG:2056&BBOX=2682300,1247700,2683100,1248150&WIDTH=1600&HEIGHT=900" \
                "$w&CRS=EPSG:4326&BBOX=47.3770,8.5300,47.3790,8.5340&WIDTH=640&HEIGHT=360" \
                "https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/18/137489/91762.jpeg"; do
                curl -s -o /tmp/l.bin -D /tmp/l.kopf -w "HTTP %{http_code}, %{size_download} Bytes, %{time_total}s" "$u"
                echo " | $(grep -i '^content-type' /tmp/l.kopf | tr -d '\r') | $(grep -i '^access-control-allow-origin' /tmp/l.kopf | tr -d '\r')"
                file /tmp/l.bin | cut -c1-120
              done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

          elif [ "$FRAGE" = "tempo" ]; then
            # Gemessen statt vermutet: wie lange die Seite braucht, ob sie
            # komprimiert und zwischengespeichert ausgeliefert wird, und
            # wie lange die Abfragen dauern, die beim Oeffnen der
            # Hauptbereiche laufen (als "authenticated" mit 8 s Grenze).
            {
              echo "### Seite"; echo '```'
              a=https://www.wohntraums.life
              for i in 1 2 3; do curl -s -o /dev/null -w "Startseite: %{http_code}, erstes Byte %{time_starttransfer}s, fertig %{time_total}s\n" "$a/"; done
              curl -s -D - -o /dev/null "$a/" | grep -iE '^(cache-control|content-encoding|x-vercel-cache|age):' | sed 's/^/  Startseite /'
              js=$(curl -s "$a/" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
              for i in 1 2; do curl -s -o /dev/null -H 'Accept-Encoding: br, gzip' -w "Buendel $js: %{size_download} Bytes uebertragen, fertig %{time_total}s\n" "$a$js"; done
              curl -s -D - -o /dev/null -H 'Accept-Encoding: br, gzip' "$a$js" | grep -iE '^(cache-control|content-encoding|x-vercel-cache|age):' | sed 's/^/  Buendel /'
              for pfad in /bewertung /potenzial /investor; do curl -s -o /dev/null -w "$pfad: %{http_code}\n" "$a$pfad"; done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            psql "$DB" -X -q >> "$GITHUB_STEP_SUMMARY" 2>&1 <<'SQL' || true
          \echo '### Abfragen (Ausfuehrungszeit in der Datenbank)'
          \echo '```'
          create temp table zeiten (bereich text, ms numeric);
          -- Die Zeit misst die Datenbank selbst (explain analyze). Eine
          -- Stoppuhr um "execute" in plpgsql zeigte 680 ms, wo die
          -- Abfrage 2 ms braucht -- die Uhr mass sich selbst.
          create or replace function pg_temp.mess(b text, q text) returns void language plpgsql as $f$
          declare j json; begin
            execute 'explain (analyze, format json) ' || q into j;
            insert into zeiten values (b, round((j->0->>'Execution Time')::numeric, 1));
          end $f$;
          select pg_temp.mess('Uebersicht ZH, Seite 1', $q$select id, address, gemeinde, hnf_delta, marge_chf, owner_name from properties where ausgeschlossen = false and kanton = 'ZH' and hnf_delta is not null order by hnf_delta desc nulls last limit 1000$q$);
          select pg_temp.mess('Uebersicht ZH, Seite 2', $q$select id from properties where ausgeschlossen = false and kanton = 'ZH' and hnf_delta is not null order by hnf_delta desc nulls last offset 1000 limit 1000$q$);
          select pg_temp.mess('Nummern / Pipedrive', $q$select id, address, owner_name, owner_phone from properties where pipedrive_deal_id is null and owner_name is not null and owner_name <> '' order by marge_chf desc nulls last limit 300$q$);
          select pg_temp.mess('Pipedrive uebertragen', $q$select id from properties where pipedrive_deal_id is not null order by last_export_at desc nulls last limit 30$q$);
          select pg_temp.mess('Cockpit Baugesuche 7 Tage', $q$select count(*) from baugesuch where quelle <> 'probe' and publiziert_am >= current_date - 7$q$);
          select pg_temp.mess('Baugesuche Liste', $q$select * from baugesuch where quelle <> 'probe' order by publiziert_am desc limit 500$q$);
          select pg_temp.mess('Cockpit Potenzial ZH', $q$select id, address, gemeinde, zone, area, hnf_delta, marge_chf, baujahr from properties where kanton = 'ZH' and ausgeschlossen = false and preselection_status <> 'Ausschliessen' and owner_name is null order by marge_chf desc nulls last limit 3$q$);
          select pg_temp.mess('Zentrale Liste', $q$select * from vorhaben_liste order by geaendert_am desc limit 300$q$);
          select pg_temp.mess('Gelegenheiten', $q$select g.*, (select count(*) from gelegenheit_parzelle gp where gp.gelegenheit_id = g.id) from gelegenheit g limit 500$q$);
          select bereich, ms from zeiten;
          \echo '```'
          \echo '### Plan der Uebersicht (zweimal: kalt, warm)'
          \echo '```'
          explain (analyze, buffers, costs off, timing on) select id, address, gemeinde, plz, parzelle, plot_number, egrid, owner_phone, bfs_nr, kanton, zone, ausnuetzung, area, gebaeudeflaeche, geschosse, baujahr, owner_name, eigentuemer_name, hnf_delta, marge_chf, preselection_status from properties where ausgeschlossen = false and kanton = 'ZH' and hnf_delta is not null order by hnf_delta desc nulls last limit 1000;
          explain (analyze, buffers, costs off, timing on) select id, address, gemeinde, plz, parzelle, plot_number, egrid, owner_phone, bfs_nr, kanton, zone, ausnuetzung, area, gebaeudeflaeche, geschosse, baujahr, owner_name, eigentuemer_name, hnf_delta, marge_chf, preselection_status from properties where ausgeschlossen = false and kanton = 'ZH' and hnf_delta is not null order by hnf_delta desc nulls last limit 1000;
          \echo '```'
          SQL

          elif [ "$FRAGE" = "gelegenheiten-tempo" ]; then
            # Julian (1. November): die Seite blieb bei "wird geladen" mit
            # lauter Nullen. Gemessen wird die Abfrage der Seite so, wie
            # PostgREST sie stellt -- als "authenticated" mit den Regeln,
            # einmal als Admin, einmal als aui. Nur Zahlen und Zeiten.
            psql "$DB" -X -q >> "$GITHUB_STEP_SUMMARY" 2>&1 <<'SQL' || true
          \echo '### Gelegenheiten: Umfang'
          \echo '```'
          select count(*) as gelegenheiten, (select count(*) from gelegenheit_parzelle) as verknuepfungen from gelegenheit;
          \echo '```'
          create temp table konto as
            select 'admin' as wer, (select ur.user_id from user_roles ur where ur.role = 'admin' limit 1) as id
            union all select 'aui', (select id from auth.users where email like 'aui@%' limit 1);
          grant select on konto to authenticated;
          create temp table zeiten (wer text, abfrage text, ms numeric, zeilen int);
          grant all on zeiten to authenticated;
          create or replace function pg_temp.mess(w text, b text, q text) returns void language plpgsql as $f$
          declare j json; begin
            execute 'explain (analyze, format json) ' || q into j;
            insert into zeiten values (w, b, round((j->0->>'Execution Time')::numeric, 1), (j->0->'Plan'->>'Actual Rows')::int);
          end $f$;
          \echo '### Zeiten als angemeldetes Konto (ms, Zeilen)'
          \echo '```'
          do $$
          declare k record;
            voll text := $q$select g.*, (select json_build_object('id', m.id, 'akteur', (select json_build_object('name', a.name) from akteur a where a.id = m.akteur_id)) from mandant m where m.id = g.mandant_id) as mandant,
              (select json_agg(json_build_object('rolle', gp.rolle, 'parzelle', (select json_build_object('id', p.id, 'address', p.address, 'owner_name', p.owner_name, 'area', p.area, 'gemeinde', p.gemeinde, 'egrid', p.egrid) from properties p where p.id = gp.parzelle_id))) from gelegenheit_parzelle gp where gp.gelegenheit_id = g.id) as gp
              from gelegenheit g order by g.prioritaet desc nulls last, g.erkannt_am desc limit $q$;
          begin
            for k in select * from konto where id is not null loop
              perform set_config('request.jwt.claims', json_build_object('sub', k.id, 'role', 'authenticated')::text, true);
              perform set_config('role', 'authenticated', true);
              perform pg_temp.mess(k.wer, 'nur gelegenheit', 'select * from gelegenheit order by prioritaet desc nulls last, erkannt_am desc limit 2000');
              perform pg_temp.mess(k.wer, 'mit Kunde und Parzellen, 2000', voll || '2000');
              perform pg_temp.mess(k.wer, 'mit Kunde und Parzellen, 500', voll || '500');
              perform pg_temp.mess(k.wer, 'gelegenheit_parzelle allein', 'select * from gelegenheit_parzelle');
              perform set_config('role', 'postgres', true);
            end loop;
          end $$;
          select * from zeiten;
          \echo '```'
          SQL

          elif [ "$FRAGE" = "vorhaben-probe" ]; then
            # Ein Vorhaben mit 1000 echten Parzellen, einer Arrondierung
            # mit einem Nachbarn, dessen Eigentuemer Investor ist (Netzwerk),
            # und ein zweites Vorhaben in einem fremden Team. Gelesen wird
            # als "aui" (keine Admin-Rolle) wie die Seite. Ausgegeben werden
            # nur Zahlen, keine Namen. Zurueckgerollt.
            psql "$DB" -v ON_ERROR_STOP=1 -X -q >> "$GITHUB_STEP_SUMMARY" 2>&1 <<'SQL' || true
          \echo '### Probe: Vorhaben und Potenzialanalyse'
          \echo '```'
          begin;
          create temp table probe_ids as
            select (select id from auth.users where email like 'aui@%') as aui;
          grant select on probe_ids to authenticated;
          insert into akteur (name, art) values ('Probe Pensionskasse', 'institution'), ('Probe Investor', 'firma'), ('Probe Fremd', 'firma');
          insert into investorprofil (akteur_id, lagen, objekttypen) select id, array['Zürich'], array['MFH'] from akteur where name = 'Probe Investor';
          insert into team (name) values ('Probe-Team-Fremd');
          insert into mandant (akteur_id) select id from akteur where name = 'Probe Pensionskasse';
          insert into mandant (akteur_id, team_id) select a.id, t.id from akteur a, team t where a.name = 'Probe Fremd' and t.name = 'Probe-Team-Fremd';
          insert into portfolio (mandant_id, name) select m.id, 'Probe-Vorhaben' from mandant m join akteur a on a.id = m.akteur_id where a.name = 'Probe Pensionskasse';
          insert into portfolio (mandant_id, name) select m.id, 'Probe-Fremd' from mandant m join akteur a on a.id = m.akteur_id where a.name = 'Probe Fremd';
          create temp table probe_parz as
            select id from properties where kanton = 'ZH' and egrid is not null and ausgeschlossen = false
            order by marge_chf desc nulls last limit 1002;
          insert into portfolio_position (portfolio_id, parzelle_id, roh_adresse, zuordnung)
            select (select id from portfolio where name = 'Probe-Vorhaben'), id, 'probe', 'zugeordnet' from (select id from probe_parz limit 1000) x;
          insert into portfolio_position (portfolio_id, roh_adresse, zuordnung)
            select (select id from portfolio where name = 'Probe-Vorhaben'), 'Probe offen ' || g, 'offen' from generate_series(1, 25) g;
          insert into vorhaben (mandant_id, art, titel, portfolio_id, zeitraum_bis)
            select p.mandant_id, 'entwickeln', 'Probe 1000 Adressen', p.id, current_date + 180 from portfolio p where p.name = 'Probe-Vorhaben';
          insert into vorhaben (mandant_id, art, titel, portfolio_id)
            select p.mandant_id, 'verkaufen', 'Probe fremdes Team', p.id from portfolio p where p.name = 'Probe-Fremd';
          -- Eine Arrondierung: Ausloeser ist die erste Parzelle, Nachbar
          -- die 1001., deren Eigentuemer der Probe-Investor ist.
          insert into gelegenheit (anlass, mandant_id, titel, fremde_nachbarn)
            select 'arrondierung', mandant_id, 'Probe Arrondierung', '[{"egrid":"CHX","nummer":"1"},{"egrid":"CHY","nummer":"2"}]'::jsonb
            from portfolio where name = 'Probe-Vorhaben';
          insert into gelegenheit_parzelle (gelegenheit_id, parzelle_id, rolle)
            select g.id, (select id from probe_parz limit 1), 'ausloeser' from gelegenheit g where g.titel = 'Probe Arrondierung'
            union all
            select g.id, (select id from probe_parz offset 1000 limit 1), 'nachbar' from gelegenheit g where g.titel = 'Probe Arrondierung';
          insert into eigentum (parzelle_id, akteur_id, quelle)
            select (select id from probe_parz offset 1000 limit 1), id, 'manuell' from akteur where name = 'Probe Investor';
          select set_config('request.jwt.claims', json_build_object('sub', (select aui from probe_ids), 'role', 'authenticated')::text, true);
          set local role authenticated;
          select count(*) filter (where titel = 'Probe 1000 Adressen') as eigenes_sichtbar,
                 count(*) filter (where titel = 'Probe fremdes Team') as fremdes_sichtbar,
                 max(adressen) filter (where titel = 'Probe 1000 Adressen') as adressen_in_liste
          from vorhaben_liste;
          \timing on
          create temp table probe_a as select vorhaben_analyse((select id from vorhaben where titel = 'Probe 1000 Adressen')) as a;
          \timing off
          select a->>'adressen' as adressen, a->>'zugeordnet' as zugeordnet, a->>'offen' as offen,
                 round((a->>'flaeche_m2')::numeric) as flaeche_m2, round((a->>'marge_chf')::numeric / 1e6) as marge_mio,
                 jsonb_array_length(a->'zonen') as zonen, jsonb_array_length(a->'lage_art') as lage_art,
                 a->>'arrondierungen' as arrondierungen, a->>'nachbarn' as nachbarn,
                 a->>'nachbarn_ausserhalb' as ausserhalb,
                 jsonb_array_length(a->'netzwerk') as netzwerk, a->'netzwerk'->0->'wieso' as netzwerk_wieso,
                 jsonb_array_length(a->'top') as top
          from probe_a;
          select (vorhaben_analyse((select id from vorhaben where titel = 'Probe fremdes Team')))->>'adressen' as fremdes_team_adressen;
          rollback;
          \echo '```'
          SQL

          elif [ "$FRAGE" = "potenzial-bund" ]; then
            # Eigener Name: "potenzial" gab es schon (unten), beide liefen.
            { echo "### Bauzone und Parzelle am Punkt"; echo '```'; node tools/potenzial_quelle.mjs 2>&1 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

          elif [ "$FRAGE" = "anfrage-probe" ]; then
            # Als "anon" -- die Rolle der oeffentlichen Seiten. Einfuegen
            # muss gehen, Lesen darf nichts zeigen, ohne Einwilligung darf
            # nichts gespeichert werden. Zurueckgerollt.
            psql "$DB" -X -q >> "$GITHUB_STEP_SUMMARY" 2>&1 <<'SQL' || true
          \echo '### Probe: oeffentliche Anfragen'
          \echo '```'
          begin;
          set local role anon;
          insert into anfrage (art, name, email, einwilligung) values ('bewertung', 'Probe Person', 'probe@example.ch', true);
          \echo 'Einfuegen als anon: ok'
          select count(*) as anon_sieht_anfragen from anfrage;
          savepoint s;
          insert into anfrage (art, name, email, einwilligung) values ('bewertung', 'Ohne Einwilligung', 'x@example.ch', false);
          rollback to savepoint s;
          savepoint t;
          update anfrage set bearbeitet = true;
          \echo 'Update als anon (muss 0 Zeilen treffen oder scheitern)'
          rollback to savepoint t;
          reset role;
          select count(*) as probe_zeilen_als_admin from anfrage where name = 'Probe Person';
          rollback;
          \echo '```'
          SQL

          elif [ "$FRAGE" = "amtsblatt" ]; then
            { echo "### Baugesuch im Amtsblattportal"; echo '```'; python3 tools/amtsblatt_pruefen.py 2>&1 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            ID=$(python3 tools/amtsblatt_pruefen.py 2>/dev/null | sed -n 's/^Publikation: \([^ ]*\) Kennung: \(.*\)$/\2 \1/p' | head -1)
            { echo "### Seite im Browser"; echo '```'
              (cd /tmp && npm init -y >/dev/null && npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx -y playwright@1.48.2 install --with-deps chromium >/dev/null 2>&1) || echo "Browser nicht installierbar"
              NODE_PATH=/tmp/node_modules node --input-type=module -e "$(sed "s#from 'playwright'#from '/tmp/node_modules/playwright/index.mjs'#" tools/amtsblatt_seite.mjs)" $ID 2>&1 || true
              echo '```'; } >> "$GITHUB_STEP_SUMMARY"

          elif [ "$FRAGE" = "ortsdienst" ]; then
            # Die Anmeldung soll den Ort zur Adresse zeigen. Der Browser
            # fragt dafuer einen Dienst; geprueft wird hier, ob er
            # antwortet, ob er Browser-Anfragen erlaubt (CORS) und welche
            # Felder er liefert. Die Adresse des Laufs selbst wird nicht
            # ausgegeben, nur Feldnamen und der Ort (ein Rechenzentrum).
            for url in https://get.geojs.io/v1/ip/geo.json https://ipapi.co/json/ https://ipwho.is/ https://freeipapi.com/api/json; do
              {
                echo "### $url"; echo '```'
                rm -f /tmp/k /tmp/b
                curl -s -m 15 -D /tmp/k -o /tmp/b -H 'Origin: https://example.org' "$url" \
                  -w 'HTTP %{http_code}\n' || echo "keine Antwort"
                grep -i '^access-control-allow-origin' /tmp/k 2>/dev/null || echo "kein CORS-Kopf"
                python3 -c "import json;d=json.load(open('/tmp/b'));print('Felder:',sorted(d.keys()));print('Ort:',{k:d.get(k) for k in ('city','region','country','country_name','regionName','cityName','countryName') if k in d})" 2>&1 | head -5 || true
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            done

          elif [ "$FRAGE" = "konten" ]; then
            # Wer kommt heute ueberhaupt herein? Die Anmeldung liegt in
            # auth.users, nicht im Bestand -- von dort ist sonst nichts
            # sichtbar.
            #
            # Die Adressen stehen hier bewusst nur angedeutet: dieses
            # Repository ist oeffentlich, und damit liest die
            # Zusammenfassung eines Ablaufs jeder mit. Zum Abzaehlen und
            # Wiedererkennen reicht der erste Buchstabe samt Domaene;
            # wer die ganze Adresse braucht, sieht in Supabase nach.
            frage "Angelegte Konten" "
              select regexp_replace(email, '^(.).*(@.*)$', '\\1***\\2')
                                                          as konto,
                     to_char(created_at, 'DD.MM.YYYY')     as angelegt,
                     to_char(last_sign_in_at, 'DD.MM.YYYY') as zuletzt_da,
                     case when email_confirmed_at is null
                          then 'nein' else 'ja' end        as bestaetigt
              from auth.users
              order by created_at;"
            frage "Wie viele es sind" "
              select count(*)                                  as konten,
                     count(*) filter (where last_sign_in_at
                                            > now() - interval '90 days')
                                                               as aktiv_90_tage,
                     count(*) filter (where last_sign_in_at is null)
                                                               as nie_angemeldet
              from auth.users;"
            # Eine Rolle entscheidet in der Datenbank, nicht im Browser.
            # Steht hier nichts, haengt auch nichts davon ab.
            frage "Vergebene Rollen" "
              select r.role                                    as rolle,
                     count(*)                                  as konten
              from public.user_roles r
              group by 1 order by 2 desc;"
            # Was beim Anmelden festgehalten wird. Adressen nur als
            # vorhanden/leer -- die Zusammenfassung ist oeffentlich.
            frage "Festgehaltene Anmeldungen (die letzten 15)" "
              select to_char(zeit at time zone 'Europe/Zurich', 'DD.MM. HH24:MI') as wann,
                     regexp_replace(coalesce(email,''), '^(.).*(@.*)$', '\\1***\\2') as konto,
                     case when ip is null then 'leer' else 'vorhanden' end as ip,
                     coalesce(geraet, '(leer)') as geraet,
                     length(user_agent) as ua_laenge
              from public.anmeldung order by zeit desc limit 15;"
            frage "Spalten der Tabelle anmeldung" "
              select column_name, data_type from information_schema.columns
              where table_schema='public' and table_name='anmeldung' order by ordinal_position;"

          elif [ "$FRAGE" = "arten" ]; then
            frage "Gebäudearten" "
              select coalesce(gebaeudeart,'(leer)') as art, count(*)
              from properties where ausgeschlossen = false
              group by 1 order by 2 desc limit 40;"
            frage "Kategorien" "
              select coalesce(kategorie,'(leer)') as kategorie, count(*)
              from properties where ausgeschlossen = false
              group by 1 order by 2 desc limit 40;"
            frage "Zonen der grössten Parzellen" "
              select coalesce(zone,'(leer)') as zone, count(*),
                     round(avg(area)) as flaeche_schnitt
              from properties
              where ausgeschlossen = false and area > 5000
              group by 1 order by 2 desc limit 25;"
          else
            # Ein Haus ohne eine einzige Wohnung ist kein Wohnhaus.
            # Zusammen mit einer grossen Parzelle ist das das Muster von
            # Schule, Spital, Kirche, Verwaltung -- Eigentümer, die nicht
            # verkaufen.
            frage "Objekte ohne jede Wohnung" "
              select
                count(*) filter (where coalesce(wohnungen,0) = 0) as ohne_wohnung,
                count(*) filter (where coalesce(wohnungen,0) = 0
                                   and area > 3000)               as ohne_wohnung_gross,
                count(*)                                          as alle
              from properties where ausgeschlossen = false;"
            frage "Davon in der Anrufliste (Marge über 1 Mio)" "
              select
                count(*) filter (where coalesce(wohnungen,0) = 0) as ohne_wohnung,
                count(*)                                          as alle
              from properties
              where ausgeschlossen = false and marge_chf > 1000000;"
            frage "Eigentümer, die nie verkaufen" "
              select count(*) as oeffentliche_hand
              from properties
              where ausgeschlossen = false
                and coalesce(owner_name, eigentuemer_name) ~*
                    '(stadt|gemeinde|kanton|bund|eidgenoss|kirch|schul|spital|universit|zweckverband|sbb|post|swisscom)';"
            frage "Die zwanzig grössten ohne Wohnung" "
              select address, gemeinde, area, wohnungen, baujahr,
                     left(coalesce(zone,''), 30) as zone,
                     round(marge_chf/1e6, 1) as marge_mio
              from properties
              where ausgeschlossen = false and coalesce(wohnungen,0) = 0
              order by marge_chf desc nulls last limit 20;"
          fi

          # Was in der Datenbank steht, ist eine Frage. Was die
          # Webseite davon zu sehen bekommt, eine andere: dazwischen
          # liegt die Zugriffsregel. Deshalb wird beides geprüft --
          # einmal als Datenbank, einmal mit dem öffentlichen
          # Schlüssel, den der Browser benutzt.
          if [ "$FRAGE" = "dicht" ]; then
            # Seit 1. November (Migration anon_dicht, _shared/zugang.ts)
            # darf der öffentliche Schlüssel nichts mehr lesen, und die
            # Funktionen weisen Aufrufe ohne Anmeldung ab. Gemessen statt
            # behauptet: nur HTTP-Code und Anzahl Zeilen, nie Inhalte.
            set -a
            . <(grep -E '^VITE_SUPABASE_(URL|PUBLISHABLE_KEY)=' .env \
                | sed 's/VITE_SUPABASE_URL=/U=/; s/VITE_SUPABASE_PUBLISHABLE_KEY=/K=/' \
                | tr -d '"')
            set +a
            {
              echo "### Öffentlicher Schlüssel: was er noch lesen kann (erwartet: 0 Zeilen oder 401/403)"
              echo '```'
              for t in properties phone_numbers akteur kontakt anruf anfrage app_settings aktivitaet audit_logs property_lists saved_filters gelegenheit portfolio eigentuemer_zu_pruefen nachbarn; do
                code=$(curl -sS -o /tmp/a.json -w '%{http_code}' "$U/rest/v1/$t?select=*&limit=3" \
                  -H "apikey: $K" -H "Authorization: Bearer $K" || echo 000)
                n=$(python3 -c "import json;d=json.load(open('/tmp/a.json'));print(len(d) if isinstance(d,list) else '-')" 2>/dev/null || echo '-')
                echo "$t: HTTP $code, Zeilen $n"
              done
              echo '```'
              echo "### Funktionen ohne Anmeldung (erwartet: 401)"
              echo '```'
              for f in tel-search pipedrive-push sms-confirmation update-zones daily-digest; do
                code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$U/functions/v1/$f" \
                  -H "apikey: $K" -H "Authorization: Bearer $K" -H 'Content-Type: application/json' --data '{}' || echo 000)
                echo "$f: HTTP $code"
              done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$FRAGE" = "kantone" ]; then
            # Zuerst der Test, auf den es ankommt: sieht der Browser die
            # Zeilen? Die Zaehlung darunter ist teuer und darf ihn nicht
            # verdraengen, wenn sie in die Zeitgrenze laeuft.
            set -a
            . <(grep -E '^VITE_SUPABASE_(URL|PUBLISHABLE_KEY)=' .env \
                | sed 's/VITE_SUPABASE_URL=/U=/; s/VITE_SUPABASE_PUBLISHABLE_KEY=/K=/' \
                | tr -d '"')
            set +a
            {
              echo "### Was der Browser mit dem oeffentlichen Schluessel sieht"
              echo '```'
              for kt in ZH TG; do
                code=$(curl -sS -o /tmp/antwort.json -w '%{http_code}' \
                  "$U/rest/v1/properties?kanton=eq.$kt&select=egrid,address,gemeinde,zone&limit=2" \
                  -H "apikey: $K" -H "Authorization: Bearer $K" \
                  -H "Prefer: count=exact" -D /tmp/kopf.txt || echo "000")
                bereich=$(grep -i '^content-range' /tmp/kopf.txt | tr -d '\r' || true)
                echo "$kt: HTTP $code  $bereich"
                head -c 300 /tmp/antwort.json; echo
              done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            # Eine schlichte Zaehlung; die Filter davor liefen in die
            # Zeitgrenze und rissen den ganzen Lauf mit.
            frage "Bestand je Kanton" "
              set local statement_timeout = '10min';
              select coalesce(kanton, '(leer)') as kanton, count(*) as objekte
              from properties group by 1 order by 2 desc;"
          fi

          if [ "$FRAGE" = "potenzial" ]; then
            # Fuer Thurgau sollte hier nichts stehen: die Ausnuetzung
            # der Thurgauer Zonen ist nicht hinterlegt. Steht doch
            # etwas da, hat die Zuercher Rechnung auf Thurgauer
            # Zonennamen angeschlagen -- und liefert Zahlen, auf die
            # sich niemand verlassen darf.
            frage "Gerechnetes Potenzial je Kanton" "
              set local statement_timeout = '10min';
              select kanton,
                     count(*)                        as objekte,
                     count(hnf_delta)                as mit_hnf,
                     count(*) filter (where hnf_delta > 0) as hnf_groesser_null,
                     count(ausnuetzung)              as mit_ausnuetzung,
                     round(max(marge_chf)/1e6, 1)    as groesste_marge_mio
              from properties group by 1 order by 1;"
            frage "Thurgauer Objekte mit gerechnetem Potenzial" "
              set local statement_timeout = '10min';
              select address, gemeinde, zone, geschosse, ausnuetzung,
                     round(hnf_delta) as hnf_delta,
                     round(marge_chf/1e6, 1) as marge_mio
              from properties
              where kanton = 'TG' and hnf_delta > 0
              order by marge_chf desc nulls last limit 10;"
          fi

          cat "$GITHUB_STEP_SUMMARY"
