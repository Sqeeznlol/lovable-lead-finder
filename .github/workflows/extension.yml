# =====================================================================
# Die Extension als fertiges Paket
# =====================================================================
# Sie liegt als Ordner im Repository, und Chrome will genau das haben.
# Ohne diesen Ablauf muss man das ganze Projekt als ZIP laden, nur um
# an fünf Dateien zu kommen -- und das bei jeder Änderung.
#
# Hier entsteht bei jedem Push ein Paket, das nur die Extension
# enthält. Es hängt am Lauf und ist über die Actions-Seite zu holen.
# =====================================================================

name: Extension packen

on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - '.github/workflows/extension.yml'
  workflow_dispatch:

jobs:
  packen:
    runs-on: ubuntu-latest
    # Der letzte Schritt legt das Paket in die Seite und pusht es --
    # ohne Schreibrecht scheitert das erst am Ende des Laufs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fassung ablesen
        id: fassung
        run: |
          set -euo pipefail
          v=$(grep -oP '"version"\s*:\s*"\K[^"]+' extension/manifest.json)
          echo "nummer=$v" >> "$GITHUB_OUTPUT"
          {
            echo "### Extension $v"
            echo ""
            echo "Unter **Artifacts** liegt \`extension-$v.zip\`."
            echo ""
            echo "Entpacken, dann in \`chrome://extensions\`:"
            echo "Entwicklermodus ein → *Entpackte Erweiterung laden* →"
            echo "den entpackten Ordner wählen."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dateien prüfen
        run: |
          set -euo pipefail
          # Ein Manifest, das eine Datei nennt, die es nicht gibt, laesst
          # Chrome die ganze Erweiterung verweigern -- und zwar erst beim
          # Laden, auf dem Rechner, an dem niemand mehr etwas aendern
          # kann.
          fehlt=0
          for f in $(grep -oP '"[a-z0-9_.-]+\.js"' extension/manifest.json \
                     | tr -d '"' | sort -u); do
            [ -f "extension/$f" ] || { echo "fehlt: $f"; fehlt=1; }
          done
          for f in extension/*.js; do node --check "$f"; done
          exit $fehlt

      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ steps.fassung.outputs.nummer }}
          path: extension/
          if-no-files-found: error

      # Das Paket gehoert auch in die Seite: ein Link auf diesen Ablauf
      # verlangt ein Konto und fuehrt durch drei Seiten. Unter
      # /bauraum-erweiterung.zip liegt es fuer jeden bereit -- und weil
      # es hier bei jeder Aenderung neu entsteht, kann es nicht
      # veralten. Genau das war es naemlich: auf der Seite lag 1.3.0,
      # waehrend der Ordner bei 2.0.0 stand.
      - name: Paket in die Seite legen
        run: |
          set -euo pipefail
          # Gleicher Inhalt soll dieselbe Datei ergeben, sonst entsteht
          # bei jedem Lauf ein Commit. Deshalb feste Zeitstempel und
          # keine Zusatzfelder.
          find extension -exec touch -t 202001010000 {} +
          (cd extension && zip -X -r -q ../public/bauraum-erweiterung.zip .)
          if git diff --quiet -- public/bauraum-erweiterung.zip; then
            echo "Das Paket auf der Seite ist schon aktuell."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/bauraum-erweiterung.zip
          git commit -m "Paket auf der Seite auf Fassung ${{ steps.fassung.outputs.nummer }} bringen" -m "Der Download im Admin holt diese Datei. Sie entsteht bei jeder Aenderung an der Erweiterung neu, damit dort nie eine alte Fassung liegt."
          git push
