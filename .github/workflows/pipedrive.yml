# =====================================================================
# Pipedrive ansehen
# =====================================================================
# Liest den Aufbau des Pipedrive-Kontos aus und fasst ihn zusammen:
# Pipelines, Phasen, Deals, Leads, eigene Felder und ihr Füllgrad,
# Personen und Organisationen, Aktivitäten.
#
# Ausschliesslich lesend. Es wird nichts angelegt, geändert oder
# gelöscht -- die Frage ist, ob die vorhandene Struktur zum Geschäft
# passt, nicht wie sie sich schnell umbauen lässt.
#
# Der Token liegt als Secret im Repository und erscheint weder im
# Protokoll noch in der Zusammenfassung. Weil die Schreibweise des
# Secret-Namens je nach Anlage abweicht, werden mehrere geprüft.
# =====================================================================

name: Pipedrive ansehen

on:
  workflow_dispatch:
    inputs:
      aufgabe:
        description: 'Was ausgeführt werden soll'
        required: true
        default: 'ansehen'
        type: choice
        options:
          - ansehen      # Aufbau des Kontos zusammenfassen
          - probelauf    # Zeigen, was übertragen würde
          - felder       # Datenfelder prüfen (Probelauf)
          - felder-aufraeumen  # Leere Felder entfernen, fehlende anlegen
          - nachfuellen  # Leere Felder bestehender Deals aus der Datenbank
          - nachfuellen-schreiben  # dasselbe, aber tatsächlich schreiben
          - ordnen       # Titel und Adressfeld prüfen (Probelauf)
          - ordnen-schreiben  # Titel setzen, Adressfeld entfernen
          - umziehen     # Neue Pipelines und Zuordnung zeigen
          - umziehen-schreiben  # Pipelines anlegen und Deals einordnen
          - kontakte     # Namen, Adresse und Kartenlink prüfen (Probelauf)
          - kontakte-schreiben  # dasselbe, aber tatsächlich schreiben
          - deal         # Einen einzelnen Deal ansehen (Nummer in 'grenze')
          - titel        # Titel aus der Datenbank bilden (Probelauf)
          - titel-schreiben    # dasselbe, aber tatsächlich schreiben
          - eigentuemer  # Miteigentümer in eigene Kontakte trennen
          - eigentuemer-schreiben  # dasselbe, aber tatsächlich schreiben
          - doppel       # Doppelte Organisationen finden (Probelauf)
          - doppel-schreiben   # dasselbe, aber tatsächlich zusammenführen
          - uebernehmen  # EGRID, Parzelle, Kanton vom Kontakt an den Deal
          - uebernehmen-schreiben  # dasselbe, aber tatsächlich schreiben
          - felder-weg   # Eigentümer 1/2 und EGID entfernen (Probelauf)
          - felder-weg-schreiben   # dasselbe, aber tatsächlich löschen
          - aus-text     # Namen aus Textfeldern zu Kontakten machen
          - aus-text-schreiben     # dasselbe, aber tatsächlich schreiben
          - fuellen      # Zone, Geschosse, Gemeinde, ÖREB aus der Datenbank
          - fuellen-schreiben      # dasselbe, aber tatsächlich schreiben
          - zuordnen     # Deals mit unklarem Titel sammeln (Probelauf)
          - zuordnen-schreiben     # dasselbe, aber tatsächlich verschieben
          - abgleich     # ZH-Objekte mit Pipedrive abgleichen (Probelauf)
          - abgleich-schreiben     # dasselbe, aber tatsächlich schreiben
          - pruefen      # Alle Felder und einen Deal mit Feldnamen zeigen
          - aufraeumen   # Feldnamen, ÖREB-Link, EGID, Zone (Probelauf)
          - aufraeumen-schreiben   # dasselbe, aber tatsächlich schreiben
          - kontaktfelder-weg      # Objektinfo/Grundstück/Grundbuch löschen
      grenze:
        description: 'Höchstzahl Objekte -- bei "deal" die Deal-Nummer'
        required: false
        default: '50'

jobs:
  ansehen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analyse
        env:
          A: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          B: ${{ secrets.PIPEDRIVEAPITOKEN }}
          C: ${{ secrets.PIPEDRIVE_TOKEN }}
          D: ${{ secrets.PIPEDRIVETOKEN }}
          E: ${{ secrets.PIPEDRIVE }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Die erste nicht leere Schreibweise gewinnt.
          for kandidat in "$A" "$B" "$C" "$D" "$E"; do
            if [ -n "$kandidat" ]; then
              export PIPEDRIVE_TOKEN="$kandidat"
              break
            fi
          done

          if [ -z "${PIPEDRIVE_TOKEN:-}" ]; then
            {
              echo "Kein Token gefunden."
              echo ""
              echo "Geprüft wurden die Namen PIPEDRIVE_API_TOKEN,"
              echo "PIPEDRIVEAPITOKEN, PIPEDRIVE_TOKEN, PIPEDRIVETOKEN"
              echo "und PIPEDRIVE."
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Zugang zur Datenbank aus der Datei im Repository; sie enthält
          # nur den öffentlichen Schlüssel.
          set -a
          . <(grep -E '^VITE_SUPABASE_(URL|PUBLISHABLE_KEY)=' .env \
              | sed 's/VITE_SUPABASE_URL=/URL=/; s/VITE_SUPABASE_PUBLISHABLE_KEY=/KEY=/' \
              | tr -d '"')
          set +a

          case "${{ inputs.aufgabe }}" in
            probelauf)
              python3 tools/pipedrive-sync.py --grenze "${{ inputs.grenze }}" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            nachfuellen)
              python3 tools/pipedrive-nachfuellen.py | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            nachfuellen-schreiben)
              python3 tools/pipedrive-nachfuellen.py --schreiben \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            umziehen)
              python3 tools/pipedrive-umziehen.py | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            umziehen-schreiben)
              python3 tools/pipedrive-umziehen.py --schreiben \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            fuellen|fuellen-schreiben)
              sudo apt-get install -y -qq postgresql-client
              psql "$SUPABASE_DB_URL" -X -q --csv -c "
                select egrid,
                       coalesce(gemeinde,'')    as gemeinde,
                       coalesce(kanton,'')      as kanton,
                       coalesce(zone,'')        as zone,
                       coalesce(geschosse::text,'')   as geschosse,
                       coalesce(baujahr::text,'')     as baujahr,
                       coalesce(round(hnf_delta)::text,'')   as hnf_delta,
                       coalesce(round(bebaubar_m2)::text,'') as bebaubar_m2,
                       coalesce(parzelle, plot_number, '')   as parzelle,
                       coalesce(bfs_nr::text,'') as bfs_nr
                from properties where egrid is not null" > /tmp/objekte.csv
              wc -l /tmp/objekte.csv
              zusatz=""
              [ "${{ inputs.aufgabe }}" = "fuellen-schreiben" ] \
                && zusatz="--schreiben"
              python3 tools/pipedrive-fuellen.py --objekte /tmp/objekte.csv \
                $zusatz | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            aufraeumen|aufraeumen-schreiben|kontaktfelder-weg)
              sudo apt-get install -y -qq postgresql-client
              psql "$SUPABASE_DB_URL" -X -q --csv -c "
                select egrid,
                       coalesce(parzelle, plot_number, '') as parzelle,
                       coalesce(bfs_nr::text,'')      as bfs_nr,
                       coalesce(gwr_egid::text,'')    as gwr_egid,
                       coalesce(housing_stat_url,'')  as housing_stat_url
                from properties where egrid is not null" > /tmp/objekte.csv
              wc -l /tmp/objekte.csv
              zusatz=""
              [ "${{ inputs.aufgabe }}" = "aufraeumen-schreiben" ] \
                && zusatz="--schreiben"
              # Loeschen erst nach Sicherung: die Datei wird unten als
              # Artefakt abgelegt und bleibt 90 Tage abrufbar.
              [ "${{ inputs.aufgabe }}" = "kontaktfelder-weg" ] \
                && zusatz="--schreiben --felder-loeschen"
              python3 tools/pipedrive-aufraeumen.py --objekte /tmp/objekte.csv \
                $zusatz | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            pruefen)
              python3 tools/pipedrive-pruefen.py "${{ inputs.grenze }}" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            abgleich|abgleich-schreiben)
              # Ergaenzt wird gegen alle Objekte, gleich welcher Kanton
              # und gleich ob gerechnet: was in einem Deal fehlt, soll
              # aus der Datenbank kommen, sobald es dort steht.
              # Angelegt wird nur die geprueste ZH-Auswahl -- die Wahl
              # trifft das Werkzeug, nicht die Abfrage.
              sudo apt-get install -y -qq postgresql-client
              psql "$SUPABASE_DB_URL" -X -q --csv -c "
                select egrid,
                       coalesce(parzelle, plot_number, '') as parzelle,
                       coalesce(address,'')     as address,
                       coalesce(plz,'')         as plz,
                       coalesce(gemeinde,'')    as gemeinde,
                       coalesce(kanton,'')      as kanton,
                       coalesce(zone,'')        as zone,
                       coalesce(geschosse::text,'')          as geschosse,
                       coalesce(baujahr::text,'')            as baujahr,
                       coalesce(round(hnf_delta)::text,'')   as hnf_delta,
                       coalesce(round(bebaubar_m2)::text,'') as bebaubar_m2,
                       coalesce(bfs_nr::text,'')             as bfs_nr,
                       coalesce(round(marge_chf)::text,'0')  as marge_chf,
                       coalesce(eigentuemer_name,'')    as eigentuemer_name,
                       coalesce(eigentuemer_adresse,'') as eigentuemer_adresse,
                       coalesce(owner_phone,'')         as owner_phone,
                       ausgeschlossen,
                       coalesce(preselection_status,'') as preselection_status
                from properties where egrid is not null" > /tmp/objekte.csv
              wc -l /tmp/objekte.csv
              zusatz=""
              [ "${{ inputs.aufgabe }}" = "abgleich-schreiben" ] \
                && zusatz="--schreiben --rueckschreiben /tmp/rueck.sql"
              python3 tools/pipedrive-abgleich.py --objekte /tmp/objekte.csv \
                --grenze "${{ inputs.grenze }}" $zusatz \
                | tee -a "$GITHUB_STEP_SUMMARY"
              # Die Deal-Nummern zurueck in die Datenbank, damit der
              # naechste Lauf dieselben Objekte wiederfindet.
              if [ -s /tmp/rueck.sql ]; then
                psql "$SUPABASE_DB_URL" -X -q -f /tmp/rueck.sql \
                  && echo "Deal-Nummern zurueckgeschrieben." \
                     >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            zuordnen|zuordnen-schreiben)
              zusatz=""
              [ "${{ inputs.aufgabe }}" = "zuordnen-schreiben" ] \
                && zusatz="--schreiben"
              python3 tools/pipedrive-zuordnen.py $zusatz \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            aus-text|aus-text-schreiben)
              zusatz=""
              [ "${{ inputs.aufgabe }}" = "aus-text-schreiben" ] \
                && zusatz="--schreiben"
              python3 tools/pipedrive-kontakte-aus-text.py $zusatz \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            felder-weg|felder-weg-schreiben)
              zusatz=""
              [ "${{ inputs.aufgabe }}" = "felder-weg-schreiben" ] \
                && zusatz="--schreiben --leeren"
              python3 tools/pipedrive-felder-weg.py $zusatz \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            uebernehmen|uebernehmen-schreiben)
              zusatz=""
              [ "${{ inputs.aufgabe }}" = "uebernehmen-schreiben" ] \
                && zusatz="--schreiben"
              python3 tools/pipedrive-uebernehmen.py $zusatz \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            doppel|doppel-schreiben)
              zusatz=""
              [ "${{ inputs.aufgabe }}" = "doppel-schreiben" ] \
                && zusatz="--schreiben"
              python3 tools/pipedrive-doppel.py $zusatz \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            eigentuemer|eigentuemer-schreiben)
              zusatz=""
              [ "${{ inputs.aufgabe }}" = "eigentuemer-schreiben" ] \
                && zusatz="--schreiben"
              python3 tools/pipedrive-eigentuemer.py $zusatz \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            titel|titel-schreiben)
              # Der Titel muss aus der Datenbank kommen, nicht aus dem
              # alten Titel: dort steht oft die Wohnadresse des
              # Eigentümers statt der Liegenschaft.
              sudo apt-get install -y -qq postgresql-client
              psql "$SUPABASE_DB_URL" -X -q --csv -c "
                select egrid,
                       coalesce(address,'')  as address,
                       coalesce(plz,'')      as plz,
                       coalesce(gemeinde,'') as gemeinde,
                       coalesce(parzelle, plot_number, '') as parzelle
                from properties where egrid is not null" > /tmp/objekte.csv
              wc -l /tmp/objekte.csv
              zusatz=""
              [ "${{ inputs.aufgabe }}" = "titel-schreiben" ] && zusatz="--schreiben"
              python3 tools/pipedrive-titel.py --objekte /tmp/objekte.csv \
                $zusatz | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            deal)
              python3 tools/pipedrive-deal.py "${{ inputs.grenze }}" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            kontakte)
              python3 tools/pipedrive-personen.py \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            kontakte-schreiben)
              python3 tools/pipedrive-personen.py --schreiben \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            ordnen)
              python3 tools/pipedrive-ordnen.py | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            ordnen-schreiben)
              python3 tools/pipedrive-ordnen.py --schreiben \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            felder)
              python3 tools/pipedrive-felder.py | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            felder-aufraeumen)
              # Entfernt ausschliesslich Felder, die bei keinem Deal einen
              # Wert tragen -- dabei geht nichts verloren.
              python3 tools/pipedrive-felder.py --schreiben \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              python3 tools/pipedrive-analyse.py | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      # Was aus Pipedrive verschwindet, muss anderswo bleiben: die
      # Grundbuchtexte der Thurgauer Kontakte sind die Quelle, aus der
      # Titel, Parzelle und EGRID stammen.
      - name: Sicherung aufbewahren
        if: always() && inputs.aufgabe == 'kontaktfelder-weg'
        uses: actions/upload-artifact@v4
        with:
          name: kontaktfelder
          path: /tmp/kontaktfelder.json
          retention-days: 90
