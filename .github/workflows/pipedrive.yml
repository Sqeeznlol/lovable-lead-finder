# =====================================================================
# Pipedrive ansehen
# =====================================================================
# Liest den Aufbau des Pipedrive-Kontos aus und fasst ihn zusammen:
# Pipelines, Phasen, Deals, Leads, eigene Felder und ihr Füllgrad,
# Personen und Organisationen, Aktivitäten.
#
# Ausschliesslich lesend. Es wird nichts angelegt, geändert oder
# gelöscht -- die Frage ist, ob die vorhandene Struktur zum Geschäft
# passt, nicht wie sie sich schnell umbauen lässt.
#
# Der Token liegt als Secret im Repository und erscheint weder im
# Protokoll noch in der Zusammenfassung. Weil die Schreibweise des
# Secret-Namens je nach Anlage abweicht, werden mehrere geprüft.
# =====================================================================

name: Pipedrive ansehen

on:
  workflow_dispatch:
    inputs:
      aufgabe:
        description: 'Was ausgeführt werden soll'
        required: true
        default: 'ansehen'
        type: choice
        options:
          - ansehen      # Aufbau des Kontos zusammenfassen
          - probelauf    # Zeigen, was übertragen würde
          - felder       # Datenfelder prüfen (Probelauf)
          - felder-aufraeumen  # Leere Felder entfernen, fehlende anlegen
          - nachfuellen  # Leere Felder bestehender Deals aus der Datenbank
          - nachfuellen-schreiben  # dasselbe, aber tatsächlich schreiben
          - ordnen       # Titel und Adressfeld prüfen (Probelauf)
          - ordnen-schreiben  # Titel setzen, Adressfeld entfernen
          - umziehen     # Neue Pipelines und Zuordnung zeigen
          - umziehen-schreiben  # Pipelines anlegen und Deals einordnen
          - kontakte     # Namen, Adresse und Kartenlink prüfen (Probelauf)
          - kontakte-schreiben  # dasselbe, aber tatsächlich schreiben
          - deal         # Einen einzelnen Deal ansehen (Nummer in 'grenze')
      grenze:
        description: 'Höchstzahl Objekte -- bei "deal" die Deal-Nummer'
        required: false
        default: '50'

jobs:
  ansehen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analyse
        env:
          A: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          B: ${{ secrets.PIPEDRIVEAPITOKEN }}
          C: ${{ secrets.PIPEDRIVE_TOKEN }}
          D: ${{ secrets.PIPEDRIVETOKEN }}
          E: ${{ secrets.PIPEDRIVE }}
        run: |
          set -euo pipefail
          # Die erste nicht leere Schreibweise gewinnt.
          for kandidat in "$A" "$B" "$C" "$D" "$E"; do
            if [ -n "$kandidat" ]; then
              export PIPEDRIVE_TOKEN="$kandidat"
              break
            fi
          done

          if [ -z "${PIPEDRIVE_TOKEN:-}" ]; then
            {
              echo "Kein Token gefunden."
              echo ""
              echo "Geprüft wurden die Namen PIPEDRIVE_API_TOKEN,"
              echo "PIPEDRIVEAPITOKEN, PIPEDRIVE_TOKEN, PIPEDRIVETOKEN"
              echo "und PIPEDRIVE."
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Zugang zur Datenbank aus der Datei im Repository; sie enthält
          # nur den öffentlichen Schlüssel.
          set -a
          . <(grep -E '^VITE_SUPABASE_(URL|PUBLISHABLE_KEY)=' .env \
              | sed 's/VITE_SUPABASE_URL=/URL=/; s/VITE_SUPABASE_PUBLISHABLE_KEY=/KEY=/' \
              | tr -d '"')
          set +a

          case "${{ inputs.aufgabe }}" in
            probelauf)
              python3 tools/pipedrive-sync.py --grenze "${{ inputs.grenze }}" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            nachfuellen)
              python3 tools/pipedrive-nachfuellen.py | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            nachfuellen-schreiben)
              python3 tools/pipedrive-nachfuellen.py --schreiben \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            umziehen)
              python3 tools/pipedrive-umziehen.py | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            umziehen-schreiben)
              python3 tools/pipedrive-umziehen.py --schreiben \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            deal)
              python3 tools/pipedrive-deal.py "${{ inputs.grenze }}" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            kontakte)
              python3 tools/pipedrive-personen.py \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            kontakte-schreiben)
              python3 tools/pipedrive-personen.py --schreiben \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            ordnen)
              python3 tools/pipedrive-ordnen.py | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            ordnen-schreiben)
              python3 tools/pipedrive-ordnen.py --schreiben \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            felder)
              python3 tools/pipedrive-felder.py | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            felder-aufraeumen)
              # Entfernt ausschliesslich Felder, die bei keinem Deal einen
              # Wert tragen -- dabei geht nichts verloren.
              python3 tools/pipedrive-felder.py --schreiben \
                | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              python3 tools/pipedrive-analyse.py | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
          esac
