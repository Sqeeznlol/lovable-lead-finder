name: Ausliefern

# Bis heute lag das Ausliefern allein bei der Git-Anbindung von Vercel.
# Die hat seit Mittag nichts mehr gebaut: fuenfzehn Aenderungen auf main,
# eine einzige davon auf der Seite. Wer den Grund nicht kennt, kann ihn
# auch nicht beheben -- also wird hier gebaut, wo man zusehen kann, und
# das fertige Verzeichnis abgeliefert.
#
# Gebraucht werden drei Geheimnisse aus dem Vercel-Konto:
#   VERCEL_TOKEN       Konto -> Settings -> Tokens
#   VERCEL_ORG_ID      Projekt -> Settings -> General ("Team ID")
#   VERCEL_PROJECT_ID  ebenda ("Project ID")
# Fehlt eines, bricht der Ablauf nicht ab, sondern sagt es und hoert auf:
# ein rotes Kreuz waere hier eine Falschmeldung.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ausliefern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Geheimnisse vorhanden?
        id: pruefen
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJEKT: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ORG" ] || [ -z "$PROJEKT" ]; then
            echo 'Es fehlen VERCEL_TOKEN, VERCEL_ORG_ID oder VERCEL_PROJECT_ID.' \
              >> "$GITHUB_STEP_SUMMARY"
            echo 'Ohne sie liefert weiterhin nur die Git-Anbindung aus.' \
              >> "$GITHUB_STEP_SUMMARY"
            echo 'weiter=nein' >> "$GITHUB_OUTPUT"
          else
            echo 'weiter=ja' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.pruefen.outputs.weiter == 'ja'
        with:
          node-version: '20'
          cache: npm

      - name: Bauen und ausliefern
        if: steps.pruefen.outputs.weiter == 'ja'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npm ci
          npx --yes vercel@latest pull --yes --environment=production --token "$TOKEN"
          npx --yes vercel@latest build --prod --token "$TOKEN"
          adresse=$(npx --yes vercel@latest deploy --prebuilt --prod --token "$TOKEN")
          echo "Ausgeliefert: $adresse" >> "$GITHUB_STEP_SUMMARY"

      - name: Nachsehen, was jetzt live ist
        if: steps.pruefen.outputs.weiter == 'ja'
        run: |
          set -uo pipefail
          js=$(curl -sS https://www.wohntraums.life \
               | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          curl -sS -o /tmp/buendel.js "https://www.wohntraums.life$js"
          if grep -q 'map.geo.tg.ch' /tmp/buendel.js; then
            echo "Der Thurgauer Kataster ist im Buendel $js." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Buendel $js enthaelt den Thurgauer Kataster nicht." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
