name: Leads retten

# 24. November: Am 21. November wurden mit dem Passwort sieben Leads
# gelöscht, drei davon echt (einer über Google auf hauschecker.ch).
# Julian: «alles Leads, was je eingetragen worden sind». Die tägliche
# Sicherung von Supabase hält sie noch sieben Tage; eingespielt in ein neues
# Projekt (die Kopie), liest dieser Ablauf daraus nur die Tabelle anfrage
# und schreibt zurück, was heute fehlt. Die Protokolle sind öffentlich: ausgegeben werden nur
# Zählungen, Tage und Webseiten, nie Namen, Nummern oder Adressen.

on:
  # Ein Push dieser Datei startet «zeigen» (ohne zu schreiben), auch wenn
  # niemand den Lauf von Hand auslösen kann.
  push:
    branches: [main]
    paths: ['.github/ausloesen/leads-retten']
  workflow_dispatch:
    inputs:
      modus:
        description: 'zeigen (nur zählen) oder schreiben (fehlende Leads zurück)'
        required: true
        default: zeigen
        type: choice
        options: [zeigen, schreiben]

permissions:
  contents: read

jobs:
  retten:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      HAUPT: wwoeaysppiusdjntogxi
      DB: ${{ secrets.SUPABASE_DB_URL }}
      MODUS: ${{ inputs.modus || 'zeigen' }}
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client jq > /dev/null
      - name: Leads aus der Kopie lesen
        run: |
          # Die Kopie ist ein eigenes Projekt im selben Konto; abgefragt wird
          # sie über den Schlüssel (Management-API), ohne Passwort. Gelesen
          # wird nur die Tabelle anfrage, in eine Datei, nie ins Protokoll.
          curl -sS -H "Authorization: Bearer $TOKEN" https://api.supabase.com/v1/projects -o projekte.json
          echo "### Projekte im Konto"
          jq -r '.[] | "\(.name)  \(.id)  \(.status)  \(.created_at)"' projekte.json
          kopie=$(jq -r --arg haupt "$HAUPT" '[.[] | select(.id != $haupt)] | sort_by(.created_at) | last | .id // empty' projekte.json)
          echo "Kopie: $kopie"
          [ -n "$kopie" ] || { echo "Keine Kopie gefunden."; exit 1; }
          code=$(curl -sS -o alt.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            --data '{"query": "select coalesce(json_agg(a), '"'"'[]'"'"'::json) as d from public.anfrage a"}' \
            "https://api.supabase.com/v1/projects/$kopie/database/query")
          echo "Abfrage der Kopie: HTTP $code"
          [ "$code" = 200 ] || [ "$code" = 201 ] || { head -c 300 alt.json; exit 1; }
          jq -c '.[0].d' alt.json > daten.json
          echo "Leads in der Kopie: $(jq length daten.json)"
      - name: Abgleichen und zurückschreiben
        run: |
          set -o pipefail
          {
            echo "set statement_timeout = '60s';"
            echo "begin;"
            echo "\\set daten \`cat daten.json\`"
            echo "create temp table alt as select * from json_populate_recordset(null::public.anfrage, :'daten'::json);"
            cat <<'SQL'
          \echo '### Kopie gegen heute (nur Tage, Webseiten, Quellen)'
          select erstellt_am::date as tag, coalesce(angaben->>'domain', '') as webseite,
                 coalesce(angaben->>'utm_source', angaben->>'quelle', '') as quelle,
                 (name ~* 'test' or coalesce(angaben->>'quelle', '') = 'test') as test,
                 exists (select 1 from public.anfrage a where a.id = alt.id) as heute_da
          from alt order by erstellt_am;
          SQL
            if [ "$MODUS" = "schreiben" ]; then
              cat <<'SQL'
          insert into public.anfrage select * from alt
           where not exists (select 1 from public.anfrage a where a.id = alt.id)
             and not (name ~* 'test' or coalesce(angaben->>'quelle', '') = 'test');
          \echo '### Nach dem Zurückschreiben'
          select count(*) as leads_heute from public.anfrage;
          commit;
          SQL
            else
              echo "rollback;"
            fi
          } > laden.sql
          # Knapp melden: eine Fehlermeldung von COPY zitierte sonst die Zeile, mit Namen.
          psql "$DB" -v ON_ERROR_STOP=1 -v VERBOSITY=terse -q -f laden.sql 2>&1 | { grep -vE '^COPY|CONTEXT|line [0-9]' || true; }
          rm -f alt.json daten.json laden.sql
