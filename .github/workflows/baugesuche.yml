# =====================================================================
# Baugesuche
# =====================================================================
# Täglich die neuen Zürcher Baugesuche laden, beim Bund EGRID und
# Nachbarn ergänzen, in die Tabelle baugesuch schreiben und daraus
# Gelegenheiten erzeugen, wo ein Kundenportfolio betroffen ist
# (Funktion baugesuche_abgleichen, Migration 20261101220000).
#
# Quelle nachgesehen am 1. November: "Baugesuche im Kanton Zürich",
# Statistisches Amt, täglich, CSV. Nur Zürich -- der Thurgau hat bis
# 2027 keinen offenen Datensatz (docs/plattform.md).
# =====================================================================

name: Baugesuche

on:
  schedule:
    # Täglich 05:23 UTC: die Quelle wird gegen 04:15 UTC erneuert
    # (metadata_modified am 31.10.: 04:13).
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      tage:
        description: 'Gesuche der letzten so vielen Tage'
        required: false
        default: '3'
      nur_abgleich:
        description: 'Nichts laden, nur die vorhandenen Gesuche neu zuordnen (z.B. nachdem Parzellen dazukamen)'
        required: false
        default: 'nein'
        type: choice
        options: ['nein', 'ja']

jobs:
  laden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge
        run: sudo apt-get install -y -qq postgresql-client

      - name: Laden, ergänzen, abgleichen
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          TAGE: ${{ inputs.tage || '3' }}
          NUR_ABGLEICH: ${{ inputs.nur_abgleich || 'nein' }}
        run: |
          set -euo pipefail
          [ -n "${DB:-}" ] || { echo "Kein Datenbankzugang."; exit 1; }
          case "$TAGE" in ''|*[!0-9]*) echo "tage muss eine Zahl sein"; exit 1;; esac

          # Rückwirkend: am 1. November kamen 206'238 Zürcher Parzellen
          # dazu. Gesuche, deren EGRID damals fehlte, finden ihre Parzelle
          # erst jetzt -- ohne dass etwas neu geladen werden muss.
          if [ "$NUR_ABGLEICH" = "ja" ]; then
            psql "$DB" -v ON_ERROR_STOP=1 -v TAGE="$TAGE" -X -q <<'SQL' | tee -a "$GITHUB_STEP_SUMMARY"
          set statement_timeout = '15min';
          \echo '### Vorher'
          select count(*) as gesuche, count(egrid) as mit_egrid, count(parzelle_id) as im_bestand,
                 (select count(*) from public.gelegenheit where anlass = 'baugesuch') as gelegenheiten
          from public.baugesuch;
          \echo '### Abgleich'
          select * from public.baugesuche_abgleichen(:'TAGE'::int);
          -- Gelegenheiten ohne Kunde (Migration 20261101290000). Schwelle
          -- gemessen am 1. November (Auswerten/nachbar-baut): 200 m²
          -- Reserve und nur Bauvorhaben ergaben übers Jahr 127 Parzellen,
          -- ohne Filter 315 -- dort ist zu viel Wärmepumpe dabei.
          \echo '### Nachbar baut (Gelegenheiten ohne Kunde)'
          select * from public.gelegenheiten_nachbar_baut(:'TAGE'::int, 200, true, true);
          -- Die vier Funktionen der Nacht vom 3. November brauchen ihre
          -- Migrationen; solange die fehlen, soll der Lauf nicht rot werden.
          \set ON_ERROR_STOP off
          \echo '### Entwicklungspotenzial in Kundenportfolios (docs/potenzial-regeln.md)'
          select * from public.gelegenheiten_potenzial(200, true);
          \echo '### Investorprofile abgleichen (Migration 20261103220000)'
          select * from public.investor_abgleich(true);
          \echo '### Eigentümer als Akteure verdichten (Migration 20261103250000)'
          select * from public.eigentuemer_verdichten(true);
          \echo '### Wieder ansprechen: Baugesuch nach einem Nein (Migration 20261103260000)'
          select * from public.gelegenheiten_reaktivierung(:'TAGE'::int, true);
          \set ON_ERROR_STOP on
          \echo '### Nachher'
          select count(*) as gesuche, count(egrid) as mit_egrid, count(parzelle_id) as im_bestand,
                 count(*) filter (where egrid is not null and parzelle_id is null) as egrid_ohne_parzelle,
                 (select count(*) from public.gelegenheit where anlass = 'baugesuch') as gelegenheiten
          from public.baugesuch;
          \echo '### Betroffene Parzellen'
          select count(distinct parzelle_id) as parzellen_mit_gesuch,
                 (select count(distinct p.id) from public.properties p
                   join public.baugesuch b on p.egrid = any (b.nachbar_egrids)) as parzellen_mit_gesuch_beim_nachbarn
          from public.baugesuch where parzelle_id is not null;
          \echo '### Gelegenheiten aus Baugesuchen je Kunde (Demo-Kunden gesondert, keine Namen)'
          select case when a.name like '%(Demo)' then 'Demo' else 'echt' end as kunde,
                 count(*) as gelegenheiten,
                 count(*) filter (where g.titel like 'Baugesuch im Portfolio%') as im_portfolio,
                 count(*) filter (where g.titel like 'Baugesuch beim Nachbarn%') as beim_nachbarn
          from public.gelegenheit g join public.mandant m on m.id = g.mandant_id join public.akteur a on a.id = m.akteur_id
          where g.anlass = 'baugesuch' group by 1
          union all
          select 'ohne Kunde (Nachbar baut)', count(*), 0, count(*) from public.gelegenheit
          where anlass = 'baugesuch' and mandant_id is null;
          SQL
            exit 0
          fi

          npx -y tsx@4.19.2 tools/baugesuche_laden.ts "$TAGE" /tmp/baugesuche.csv | tee -a "$GITHUB_STEP_SUMMARY"

          psql "$DB" -v ON_ERROR_STOP=1 -v TAGE="$TAGE" -X -q <<'SQL' | tee -a "$GITHUB_STEP_SUMMARY"
          set statement_timeout = '10min';
          create temp table neu (
            fremd_id text, nummer text, publiziert_am date, bfs_nr text, gemeinde text,
            adresse text, parzelle_nr text, egrid text, bauherrschaft text, beschreibung text,
            nachbar_egrids text[], publikation_nr text, publikation_id text,
            einsprache_bis date, publiziert_bis date, quelle_url text
          );
          \copy neu from '/tmp/baugesuche.csv' with (format csv)
          insert into public.baugesuch
            (quelle, fremd_id, publiziert_am, kanton, bfs_nr, gemeinde, adresse, parzelle_nr, egrid,
             bauherrschaft, beschreibung, zustand, nachbar_egrids,
             publikation_nr, publikation_id, einsprache_bis, publiziert_bis, quelle_url)
          -- Gemessen im ersten Lauf: dieselbe Publikation steht mehrfach in
          -- der Quelle, eine Zeile je betroffener Parzelle. Der Schlüssel
          -- ist darum Publikation und Parzelle, und Doppel fallen weg.
          select distinct on (fremd_id || coalesce(':' || parzelle_nr, ''))
                 'zh-statistik', fremd_id || coalesce(':' || parzelle_nr, ''), publiziert_am, 'ZH', bfs_nr, gemeinde,
                 adresse, parzelle_nr, nullif(egrid, ''), bauherrschaft, beschreibung, 'eingereicht', nachbar_egrids,
                 publikation_nr, publikation_id, einsprache_bis, publiziert_bis, quelle_url
          from neu
          order by fremd_id || coalesce(':' || parzelle_nr, ''), egrid nulls last
          on conflict (quelle, fremd_id) do update
            set egrid = coalesce(excluded.egrid, baugesuch.egrid),
                nachbar_egrids = coalesce(excluded.nachbar_egrids, baugesuch.nachbar_egrids),
                publikation_nr = excluded.publikation_nr, publikation_id = excluded.publikation_id,
                einsprache_bis = excluded.einsprache_bis, publiziert_bis = excluded.publiziert_bis,
                quelle_url = excluded.quelle_url;
          \echo '### Abgleich'
          select * from public.baugesuche_abgleichen(greatest(:'TAGE'::int, 30));
          \echo '### Nachbar baut (Gelegenheiten ohne Kunde)'
          select * from public.gelegenheiten_nachbar_baut(greatest(:'TAGE'::int, 30), 200, true, true);
          -- Täglich auch die Reserven der Kundenportfolios (Migration
          -- 20261103200000, Regeln in docs/potenzial-regeln.md). Hängt
          -- nicht an Baugesuchen, aber an derselben Uhrzeit.
          -- Die vier Funktionen der Nacht vom 3. November brauchen ihre
          -- Migrationen; solange die fehlen, soll der Lauf nicht rot werden.
          \set ON_ERROR_STOP off
          \echo '### Entwicklungspotenzial in Kundenportfolios'
          select * from public.gelegenheiten_potenzial(200, true);
          \echo '### Investorprofile abgleichen'
          select * from public.investor_abgleich(true);
          \echo '### Eigentümer als Akteure verdichten'
          select * from public.eigentuemer_verdichten(true);
          \echo '### Wieder ansprechen: Baugesuch nach einem Nein'
          select * from public.gelegenheiten_reaktivierung(greatest(:'TAGE'::int, 30), true);
          \set ON_ERROR_STOP on
          \echo '### Bestand der Tabelle'
          select count(*) as gesuche, count(egrid) as mit_egrid, count(parzelle_id) as im_bestand,
                 count(publikation_nr) as mit_publikation,
                 max(publiziert_am) as neuestes
          from public.baugesuch;
          SQL
