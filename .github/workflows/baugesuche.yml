# =====================================================================
# Baugesuche
# =====================================================================
# Täglich die neuen Zürcher Baugesuche laden, beim Bund EGRID und
# Nachbarn ergänzen, in die Tabelle baugesuch schreiben und daraus
# Gelegenheiten erzeugen, wo ein Kundenportfolio betroffen ist
# (Funktion baugesuche_abgleichen, Migration 20261101220000).
#
# Quelle nachgesehen am 1. November: "Baugesuche im Kanton Zürich",
# Statistisches Amt, täglich, CSV. Nur Zürich -- der Thurgau hat bis
# 2027 keinen offenen Datensatz (docs/plattform.md).
# =====================================================================

name: Baugesuche

on:
  schedule:
    # Täglich 05:23 UTC: die Quelle wird gegen 04:15 UTC erneuert
    # (metadata_modified am 31.10.: 04:13).
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      tage:
        description: 'Gesuche der letzten so vielen Tage'
        required: false
        default: '3'

jobs:
  laden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge
        run: sudo apt-get install -y -qq postgresql-client

      - name: Laden, ergänzen, abgleichen
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          TAGE: ${{ inputs.tage || '3' }}
        run: |
          set -euo pipefail
          [ -n "${DB:-}" ] || { echo "Kein Datenbankzugang."; exit 1; }
          case "$TAGE" in ''|*[!0-9]*) echo "tage muss eine Zahl sein"; exit 1;; esac

          npx -y tsx@4.19.2 tools/baugesuche_laden.ts "$TAGE" /tmp/baugesuche.csv | tee -a "$GITHUB_STEP_SUMMARY"

          psql "$DB" -v ON_ERROR_STOP=1 -v TAGE="$TAGE" -X -q <<'SQL' | tee -a "$GITHUB_STEP_SUMMARY"
          set statement_timeout = '10min';
          create temp table neu (
            fremd_id text, nummer text, publiziert_am date, bfs_nr text, gemeinde text,
            adresse text, parzelle_nr text, egrid text, bauherrschaft text, beschreibung text,
            nachbar_egrids text[]
          );
          \copy neu from '/tmp/baugesuche.csv' with (format csv)
          insert into public.baugesuch
            (quelle, fremd_id, publiziert_am, kanton, bfs_nr, gemeinde, adresse, parzelle_nr, egrid,
             bauherrschaft, beschreibung, zustand, nachbar_egrids)
          select 'zh-statistik', fremd_id, publiziert_am, 'ZH', bfs_nr, gemeinde, adresse, parzelle_nr,
                 nullif(egrid, ''), bauherrschaft, beschreibung, 'eingereicht', nachbar_egrids
          from neu
          on conflict (quelle, fremd_id) do update
            set egrid = coalesce(excluded.egrid, baugesuch.egrid),
                nachbar_egrids = coalesce(excluded.nachbar_egrids, baugesuch.nachbar_egrids);
          \echo '### Abgleich'
          select * from public.baugesuche_abgleichen(greatest(:'TAGE'::int, 30));
          \echo '### Bestand der Tabelle'
          select count(*) as gesuche, count(egrid) as mit_egrid, count(parzelle_id) as im_bestand,
                 max(publiziert_am) as neuestes
          from public.baugesuch;
          SQL
