# =====================================================================
# Was ist wirklich live
# =====================================================================
# Der Code kann richtig sein, auf main liegen und trotzdem nicht auf
# der Seite stehen -- am 6. September lagen fünfzehn Änderungen auf
# main, von denen eine einzige ausgeliefert wurde. Wer das wissen will,
# muss die Seite selbst fragen, nicht das Repository.
#
# Gefragt wird nach dem Commit: seit derselben Änderung schreibt der
# Bau seinen Commit ins Bündel (window.bauraumFassung). Damit braucht
# dieser Ablauf keine Liste von Merkmalen mehr, die veraltet, sobald
# jemand eine Zeile ändert -- er sucht schlicht den Stand, der oben auf
# main liegt. Er verändert nichts.
name: Was ist live

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Einmal am Morgen, damit ein stehengebliebener Ausrollstand
    # auffällt, bevor jemand danach telefoniert.
    - cron: '0 5 * * 1-5'

# Bei drei Pushes kurz nacheinander interessiert nur der letzte.
concurrency:
  group: live
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - name: Auf die Seite warten und den Stand ablesen
        env:
          # Bei einem Push der eben gepushte Stand, sonst der Kopf von main.
          GESUCHT: ${{ github.sha }}
          # Nach einem Push braucht Vercel ein paar Minuten; bei einem
          # Lauf von Hand oder am Morgen soll niemand darauf warten.
          VERSUCHE: ${{ github.event_name == 'push' && 20 || 1 }}
        run: |
          set -uo pipefail
          adresse=https://www.wohntraums.life
          kurz=${GESUCHT:0:8}

          echo "### Gesucht" >> "$GITHUB_STEP_SUMMARY"
          echo "Stand \`$kurz\` auf main." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          nachsehen() {
            curl -sS -o /tmp/seite.html "$adresse" || return 1
            js=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/seite.html | head -1)
            [ -n "$js" ] || return 1
            curl -sS -o /tmp/buendel.js "$adresse$js" || return 1
            # Der Verkleinerer benennt die Zuweisung um -- aus
            # "window.bauraumFassung" wird "bP". Der Commit selbst
            # bleibt aber woertlich stehen, und danach wird gesucht.
            if grep -q -- "$GESUCHT" /tmp/buendel.js; then
              gefunden=$GESUCHT
            else
              gefunden=$(grep -oE '="[0-9a-f]{40}"' /tmp/buendel.js \
                         | head -1 | grep -oE '[0-9a-f]{40}')
            fi
          }

          n=0
          while :; do
            n=$((n + 1))
            nachsehen
            if [ "${gefunden:-}" = "$GESUCHT" ]; then
              echo "### Live" >> "$GITHUB_STEP_SUMMARY"
              echo "Bündel \`$js\` trägt \`$kurz\` -- der Stand ist draussen." \
                >> "$GITHUB_STEP_SUMMARY"
              cat "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [ "$n" -lt "$VERSUCHE" ] || break
            sleep 30
          done

          echo "### Nicht live" >> "$GITHUB_STEP_SUMMARY"
          echo "Ausgeliefert ist \`${gefunden:-unbekannt}\`, erwartet \`$kurz\`." \
            >> "$GITHUB_STEP_SUMMARY"
          echo "Bündel: \`${js:-keines gefunden}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Vercel hat diesen Push nicht gebaut. Steht in Vercel ein" \
               "fertiger Preview, bringt ihn *Promote to Production* ohne" \
               "neuen Bau live; sind die drei Geheimnisse gesetzt, macht" \
               "es der Ablauf **Ausliefern** von selbst." >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          exit 1
