# =====================================================================
# Kanton laden
# =====================================================================
# Holt die amtlichen Geodaten eines Kantons und macht daraus Zeilen für
# die Master-Liste: je Parzelle die Zone, ihr Flächenanteil und die
# Angaben, die für die Potenzialrechnung nötig sind.
#
# Warum dieser Weg: Die Zonen stehen im Kartendienst des Kantons nur als
# Bild. Aus Farben lassen sich weder Zonentyp noch Flächenanteil
# zurückrechnen, und die EGRID -- ohne die sich nichts mit dem übrigen
# Bestand verknüpfen lässt -- steht dort gar nicht. Die Kantone stellen
# dieselben Daten über geodienste.ch als Datei bereit, frei und ohne
# Anmeldung. Belegt am 5. September: Nutzungsplanung TG 41.5 MB,
# Amtliche Vermessung TG 159.5 MB, beide HTTP 200 ohne Zugangsdaten.
#
# INTERLIS ist das amtliche Schweizer Format. Es von Hand zu lesen wäre
# fehleranfällig -- besonders die Kreisbögen in den Grundstücksgrenzen.
# Deshalb übernimmt GDAL die Umwandlung, das den Standard kennt.
# =====================================================================

name: Kanton laden

on:
  workflow_dispatch:
    inputs:
      kanton:
        description: 'Kantonskürzel, z.B. TG'
        required: true
        default: 'TG'
      quelllauf:
        description: 'Nur für "verschneiden": Nummer des Laufs mit den fertigen Dateien'
        required: false
        default: ''
      menge:
        description: 'Nur für "geometrie-schreiben": höchstens so viele Parzellen (0 = alle)'
        required: false
        default: '0'
      grenze_mb:
        description: 'Abbrechen, wenn die Datenbank so gross ist (MB)'
        required: false
        # 1080 stammte aus der Zeit vor Supabase Pro (bei 1107 MB
        # schaltete sie auf nur-lesen). Heute ist sie 1.5 GB gross, und
        # 1080 hätte jeden Lauf vor dem ersten Stück beendet. 4000 wie
        # «Umrisse laden».
        default: '4000'
      schritt:
        description: 'Was ausgeführt werden soll'
        required: true
        default: 'pruefen'
        type: choice
        options:
          - pruefen      # Nur nachsehen, was in den Dateien steckt
          - zonen        # Zonen umwandeln und als Datei bereitstellen
          - parzellen    # Amtliche Vermessung ansehen und umwandeln
          - alles        # Zonen und Parzellen laden, verschneiden, ausgeben
          - verschneiden # Fertige Dateien aus einem früheren Lauf verschneiden
          - geometrie    # Parzellenumrisse herauslösen (Probelauf)
          - geometrie-schreiben    # dasselbe, und in die Datenbank schreiben
          - modell       # Warum das Vermessungsmodell nicht greift
          - formate      # Welche Dateiformate geodienste anbietet
          - ili2gpkg     # Umwandlung mit dem amtlichen INTERLIS-Werkzeug
          - zonentypen   # Nur die Zonennamen aus der Datei lesen
          - einspielen   # Verschnitt in die Datenbank (Probelauf)
          - einspielen-schreiben   # dasselbe, aber tatsächlich schreiben
          - liste        # Liegenschaften aus der Liste der Vermessung, ohne Zone (Probelauf)
          - liste-schreiben        # dasselbe, aber tatsächlich schreiben
          - zh-zonen     # Zürcher Zonen aus dem Dienst des Kantons verschneiden (Probelauf)
          - zh-zonen-schreiben     # dasselbe, aber tatsächlich schreiben
          - gwr          # Gebäuderegister ansehen: Adressen, Baujahr, Geschosse
          - gwr-probe    # Register laden und zeigen, was sich verbinden liesse
          - gwr-schreiben          # Adressen und Gebäudedaten übernehmen
          - gwr-anlegen            # Parzellen aus dem Register neu anlegen (Luzern: ohne freie Vermessung)
          - zonen-punkte           # Zone am Haus aus der Nutzungsplanung (Probelauf, für Luzern)
          - zonen-punkte-schreiben # dasselbe, aber tatsächlich schreiben
          - zonennamen   # Schlüssel durch Zonennamen ersetzen (Probelauf)
          - zonennamen-schreiben   # dasselbe, aber tatsächlich schreiben

# Nie zwei Läufe zugleich, die in die Datenbank schreiben (wie
# «Umrisse laden» und «Nachbarschaft»).
concurrency:
  group: datenbank-laden
  cancel-in-progress: false

jobs:
  laden:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge einrichten
        run: |
          sudo apt-get update -qq
          # GDAL kennt INTERLIS und rechnet die Kreisbögen der Grenzen
          # korrekt in Linienzüge um.
          # SpatiaLite bringt die Flächenrechnung mit, die für das
          # Verschneiden nötig ist.
          sudo apt-get install -y -qq gdal-bin python3-gdal unzip \
            libsqlite3-mod-spatialite

      - name: Amtliche Vermessung umwandeln
        if: ${{ inputs.schritt == 'parzellen' || inputs.schritt == 'alles'
                || ((inputs.schritt == 'geometrie'
                     || inputs.schritt == 'geometrie-schreiben')
                    && inputs.quelllauf == '') }}
        env:
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail

          # Warum nicht GDAL: es liest die Datei zwar, kennt aber die
          # Attributnamen nicht (Field01..Field09) und lässt die Grenzen
          # als lose Linien liegen -- ohne Flächen ist die Rechnung
          # wertlos. ili2gpkg aus der amtlichen INTERLIS-Werkzeugkette
          # benennt die Spalten nach dem Modell und setzt die Grenzen zu
          # Flächen zusammen.
          curl -sSL -o /tmp/ili2gpkg.zip \
            "https://downloads.interlis.ch/ili2gpkg/ili2gpkg-5.1.1.zip"
          unzip -o -q /tmp/ili2gpkg.zip -d /tmp/ili2gpkg
          jar=$(find /tmp/ili2gpkg -name 'ili2gpkg*.jar' | head -1)

          # 159 MB für Thurgau; das Herunterladen dauert.
          basis=https://geodienste.ch/downloads/interlis
          curl -sSL -o /tmp/av.zip "$basis/av/$KANTON/av_${KANTON}_lv95.zip"
          ls -lh /tmp/av.zip
          mkdir -p /tmp/av && unzip -o -q /tmp/av.zip -d /tmp/av
          echo "Gemeindedateien: $(find /tmp/av -name '*.itf' | wc -l)"

          modelldir="/tmp/av;http://models.interlis.ch/;https://models.geo.admin.ch/"
          rm -f /tmp/parzellen.gpkg

          # Erst das Gerüst -- in einem Zug mit dem Einlesen scheitert es
          # an einer noch fehlenden Tabelle.  LV95 (2056) muss angegeben
          # werden, weil INTERLIS 1 das Bezugssystem nicht mitschreibt.
          java -jar "$jar" --dbfile /tmp/parzellen.gpkg \
            --modeldir "$modelldir" --defaultSrsCode 2056 \
            --models DM01AVCH24LV95D --schemaimport > /tmp/schema.log 2>&1 \
            || { tail -20 /tmp/schema.log; exit 1; }

          n=0; fehler=0
          for f in /tmp/av/*.itf; do
            n=$((n + 1))
            java -jar "$jar" --dbfile /tmp/parzellen.gpkg \
              --modeldir "$modelldir" --defaultSrsCode 2056 \
              --disableValidation --import "$f" > /tmp/import.log 2>&1 \
              || { fehler=$((fehler + 1)); echo "  fehlgeschlagen: $(basename "$f")"
                   grep -iE 'error' /tmp/import.log | head -3 || true; }
            [ $((n % 20)) -eq 0 ] && echo "  $n Gemeinden ..."
          done
          echo "$n Gemeinden verarbeitet, $fehler fehlgeschlagen."

          ls -lh /tmp/parzellen.gpkg
          echo "### Ebenen"
          ogrinfo -so -al /tmp/parzellen.gpkg 2>/dev/null \
            | grep -E 'Layer name|Feature Count|Geometry Column' | paste - - - \
            | grep -iE 'grundstueck|liegenschaft' || true

          # Ohne Parzellen ist alles Weitere sinnlos -- lieber hier
          # abbrechen als später mit halben Daten weiterrechnen.
          #
          # Gemessen wird gegen die Zahl, die geodienste.ch selbst für den
          # Kanton meldet, nicht gegen eine feste Zahl: die alte Schwelle
          # von 50'000 Grundstücken passte zum Thurgau und liess Zug
          # (25'462 Grundstücke, 24'646 Liegenschaften) am 18. November
          # scheitern, obwohl alle elf Gemeinden vollständig gelesen waren.
          anzahl=$(ogrinfo -so /tmp/parzellen.gpkg grundstueck 2>/dev/null \
                   | grep -oP 'Feature Count: \K[0-9]+' | head -1)
          liegenschaften=$(ogrinfo -so /tmp/parzellen.gpkg liegenschaft 2>/dev/null \
                   | grep -oP 'Feature Count: \K[0-9]+' | head -1)
          filter="<fes:Filter xmlns:fes=\"http://www.opengis.net/fes/2.0\"><fes:PropertyIsEqualTo><fes:ValueReference>Kanton</fes:ValueReference><fes:Literal>$KANTON</fes:Literal></fes:PropertyIsEqualTo></fes:Filter>"
          soll=$(curl -sS --retry 3 -G "https://geodienste.ch/db/av_0/deu" \
                   --data-urlencode "SERVICE=WFS" --data-urlencode "VERSION=2.0.0" \
                   --data-urlencode "REQUEST=GetFeature" --data-urlencode "TYPENAMES=ms:RESF" \
                   --data-urlencode "RESULTTYPE=hits" --data-urlencode "FILTER=$filter" \
                   | grep -oP 'numberMatched="\K[0-9]+' || true)
          echo "Grundstücke: ${anzahl:-0}, Liegenschaften: ${liegenschaften:-0}, laut Dienst: ${soll:-unbekannt}"
          if [ -n "${soll:-}" ] && [ "$soll" -gt 0 ]; then
            # Eine Liegenschaft aus mehreren Stücken zählt im Dienst mehrfach.
            if [ $(( ${liegenschaften:-0} * 100 )) -lt $(( soll * 99 )) ]; then
              echo "Zu wenige Liegenschaften: ${liegenschaften:-0} von $soll." >&2
              exit 1
            fi
          elif [ "${anzahl:-0}" -lt 10000 ]; then
            echo "Zu wenige Grundstücke, und der Dienst nennt keine Zahl." >&2
            exit 1
          fi

      - name: Nutzungsplanung holen
        # Nur, wo die Nutzungsplanung gebraucht wird. Bis zum 18. November
        # lief der Schritt bei allem mit ausser den Parzellen und brach für
        # Zürich ab, dessen Nutzungsplanung geodienste.ch nicht führt.
        if: ${{ inputs.schritt == 'pruefen' || inputs.schritt == 'zonen'
                || inputs.schritt == 'alles' || inputs.schritt == 'verschneiden'
                || inputs.schritt == 'zonentypen'
                || startsWith(inputs.schritt, 'zonennamen')
                || startsWith(inputs.schritt, 'zonen-punkte') }}
        env:
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail
          basis=https://geodienste.ch/downloads/interlis
          datei="npl_nutzungsplanung_v1_2_${KANTON}_lv95.zip"
          echo "Lade $datei"
          curl -sSL -o /tmp/npl.zip \
            "$basis/npl_nutzungsplanung/$KANTON/$datei"
          ls -lh /tmp/npl.zip
          mkdir -p /tmp/npl && unzip -o -q /tmp/npl.zip -d /tmp/npl
          echo "Inhalt:"
          find /tmp/npl -type f -printf '%p  %s Bytes\n' | head -20

      - name: Modell holen
        # Nur, wo die Nutzungsplanung gebraucht wird. Bis zum 18. November
        # lief der Schritt bei allem mit ausser den Parzellen und brach für
        # Zürich ab, dessen Nutzungsplanung geodienste.ch nicht führt.
        if: ${{ inputs.schritt == 'pruefen' || inputs.schritt == 'zonen'
                || inputs.schritt == 'alles' || inputs.schritt == 'verschneiden'
                || inputs.schritt == 'zonentypen'
                || startsWith(inputs.schritt, 'zonennamen')
                || startsWith(inputs.schritt, 'zonen-punkte') }}
        run: |
          set -euo pipefail
          # GDAL braucht das Datenmodell, um die Klassen zu benennen.
          # Es liegt im offenen Modellverzeichnis des Bundes.
          curl -sSL -o /tmp/Nutzungsplanung_V1_2.ili \
            "https://models.geo.admin.ch/ARE/Nutzungsplanung_V1_2.ili" \
            || curl -sSL -o /tmp/Nutzungsplanung_V1_2.ili \
               "http://models.geo.admin.ch/ARE/Nutzungsplanung_V1_2.ili"
          wc -c /tmp/Nutzungsplanung_V1_2.ili

      - name: Nachsehen, was drinsteckt
        # Nur, wo die Nutzungsplanung gebraucht wird. Bis zum 18. November
        # lief der Schritt bei allem mit ausser den Parzellen und brach für
        # Zürich ab, dessen Nutzungsplanung geodienste.ch nicht führt.
        if: ${{ inputs.schritt == 'pruefen' || inputs.schritt == 'zonen'
                || inputs.schritt == 'alles' || inputs.schritt == 'verschneiden'
                || inputs.schritt == 'zonentypen'
                || startsWith(inputs.schritt, 'zonennamen')
                || startsWith(inputs.schritt, 'zonen-punkte') }}
        run: |
          set -euo pipefail
          # Zug liefert je Gemeinde eine Datei (elf), Thurgau eine. Hier
          # wird nur die erste angesehen; umgewandelt werden alle.
          echo "Dateien: $(find /tmp/npl -name '*.xtf' | wc -l)"
          xtf=$(find /tmp/npl -name '*.xtf' | sort | head -1)
          echo "Angesehen: $xtf"
          echo
          echo "### Klassen und Objektzahlen"
          # ogrinfo listet die Ebenen mit Geometrietyp und Anzahl.
          ogrinfo -so -al "$xtf,/tmp/Nutzungsplanung_V1_2.ili" 2>&1 \
            | grep -E 'Layer name|Feature Count|Geometry:|^[A-Za-z_]+: ' \
            | head -80

      - name: Zonen umwandeln
        if: ${{ inputs.schritt == 'zonen' || inputs.schritt == 'alles'
                || inputs.schritt == 'verschneiden'
                || startsWith(inputs.schritt, 'zonen-punkte') }}
        run: |
          set -euo pipefail

          # Zwei Wege wurden gebraucht, weil jeder für sich zu wenig
          # liefert:
          #
          #   GDAL bringt die Zonenflächen mit Umriss, aber in der Fläche
          #   steht nur ein Schlüssel wie "x4401_221_gngde". Die
          #   Typentabelle mit "W2" faltet GDAL in dieselbe Ebene und
          #   verwirft dabei ihre Spalten.
          #
          #   ili2gpkg liest die Typentabelle richtig, brach aber ab: die
          #   Typen verweisen auf einen Katalog des Bundes, der nicht in
          #   derselben Datei steht. "--skipReferenceErrors" lässt diese
          #   Verweise offen -- gebraucht werden Bezeichnung und
          #   Abkürzung, nicht der Katalogeintrag.
          #
          # Also: Umrisse von GDAL, Namen von ili2gpkg.

          # Alle Dateien der Lieferung. Bis zum 18. November las dieser
          # Schritt nur die erste: für Thurgau (eine Datei) genügte das,
          # für Zug (eine je Gemeinde) wären es die Zonen von Baar allein
          # gewesen, ohne Fehlermeldung. Die Kennungen sind über alle
          # Dateien eindeutig (Zug: 5'534 Zonenflächen, 5'534 Kennungen).
          rm -f /tmp/zonen.gpkg
          dateien=0
          for xtf in $(find /tmp/npl -name '*.xtf' | sort); do
            ebene=$(ogrinfo -so "$xtf,/tmp/Nutzungsplanung_V1_2.ili" 2>/dev/null \
              | grep -o '[A-Za-z_0-9.]*Grundnutzung_Zonenflaeche' | head -1)
            if [ -z "$ebene" ]; then
              echo "Keine Zonen in $(basename "$xtf")." >&2
              exit 1
            fi
            if [ -f /tmp/zonen.gpkg ]; then anhaengen="-append"; else anhaengen=""; fi
            ogr2ogr -f GPKG /tmp/zonen.gpkg $anhaengen \
              "$xtf,/tmp/Nutzungsplanung_V1_2.ili" \
              -nln zonen "$ebene"
            dateien=$(( dateien + 1 ))
          done
          echo "Dateien: $dateien"

          ls -lh /tmp/zonen.gpkg
          n=$(ogrinfo -so -al /tmp/zonen.gpkg 2>/dev/null \
            | grep -oP 'Feature Count: \K[0-9]+' | head -1)
          echo "Zonenflächen: ${n:-0}"
          if [ "${n:-0}" -lt 1000 ]; then
            echo "Zu wenige Zonenflächen -- erwartet werden Zehntausende." >&2
            exit 1
          fi

          echo
          echo "### Zonennamen holen"
          # Nicht mit einem Werkzeug: GDAL verwirft die Spalten der
          # Typentabelle, ili2gpkg bricht am Katalog des Bundes ab. Eine
          # XTF-Datei ist XML -- die Tabelle wird direkt gelesen.
          # Ohne Namen ist die Liste schlechter, aber nicht wertlos --
          # der Lauf darf daran nicht scheitern.
          python3 tools/zonentypen.py $(find /tmp/npl -name '*.xtf' | sort) /tmp/zonentypen.csv || true
          head -4 /tmp/zonentypen.csv

      - name: Ergebnis bereitstellen
        if: ${{ inputs.schritt == 'zonen' || inputs.schritt == 'alles' }}
        uses: actions/upload-artifact@v4
        with:
          name: zonen-${{ inputs.kanton }}
          path: /tmp/zonen.gpkg
          if-no-files-found: warn

      - name: Parzellen bereitstellen
        if: ${{ inputs.schritt == 'parzellen' || inputs.schritt == 'alles' }}
        uses: actions/upload-artifact@v4
        with:
          name: parzellen-${{ inputs.kanton }}
          path: /tmp/parzellen.gpkg
          if-no-files-found: warn

      # Die Umwandlung dauert eine halbe Stunde und ändert sich nicht.
      # Für das Verschneiden allein lohnt es nicht, sie zu wiederholen --
      # die Dateien liegen als Artefakt des letzten Laufs bereit.
      - name: Dateien aus früherem Lauf holen
        if: ${{ inputs.schritt == 'verschneiden'
                || ((inputs.schritt == 'geometrie'
                     || inputs.schritt == 'geometrie-schreiben')
                    && inputs.quelllauf != '') }}
        uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ inputs.kanton }}'
          merge-multiple: true
          path: /tmp
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.quelllauf }}
          repository: ${{ github.repository }}

      - name: Verschneiden
        if: ${{ inputs.schritt == 'alles' || inputs.schritt == 'verschneiden' }}
        run: |
          set -euo pipefail

          # Die eigentliche Rechnung: welcher Anteil einer Parzelle liegt
          # in welcher Zone. Genau daran hängt alles Weitere -- eine
          # Parzelle kann zur Hälfte Wohnzone und zur Hälfte Wald sein,
          # und bebauen lässt sich nur der Zonenanteil. In Zürich wurde
          # das anfangs übersehen, mit dem Ergebnis von Margen in
          # Milliardenhöhe.
          #
          # Ausgegeben wird dieselbe Form, die die Zürcher Liste im
          # Klammerzusatz führt: Fläche und Prozentsatz je Zone.

          ls -lh /tmp/zonen.gpkg /tmp/parzellen.gpkg

          # Beide Quellen in eine Datei, damit sich darin rechnen lässt.
          # Grundstück und Fläche gehören zusammen -- die Nummer und die
          # EGRID stehen am Grundstück, der Umriss an der Fläche. Beides
          # wird gleich hier verbunden, solange der Schlüssel T_Id noch
          # eine gewöhnliche Spalte ist; beim Kopieren gilt er als interne
          # Satznummer und ginge verloren.
          #
          # Die amtlichen Grenzen enthalten Kreisbögen, mit denen
          # SpatiaLite nicht rechnen kann; GDAL begradigt sie dabei.
          cp /tmp/parzellen.gpkg /tmp/arbeit.gpkg
          ogr2ogr -f GPKG /tmp/arbeit.gpkg -append -nln parzellen \
            -nlt CONVERT_TO_LINEAR /tmp/arbeit.gpkg \
            -dialect sqlite -sql "
              SELECT g.egris_egrid, g.nummer, g.nbident, g.art,
                     l.flaechenmass, l.geometrie
              FROM liegenschaft l
              JOIN grundstueck g ON g.T_Id = l.liegenschaft_von"

          ogr2ogr -f GPKG /tmp/arbeit.gpkg -append -nln zonen \
            /tmp/zonen.gpkg zonen
          if [ -s /tmp/zonentypen.csv ]; then
            ogr2ogr -f GPKG /tmp/arbeit.gpkg -append -nln zonentyp \
              /tmp/zonentypen.csv
          fi

          # Ohne räumlichen Index vergleicht die Datenbank jede der
          # 140'000 Parzellen mit jeder der 57'000 Zonen -- acht
          # Milliarden Vergleiche, die nie fertig werden. Ein erster
          # Versuch lief eine halbe Stunde ohne eine einzige Zeile.
          # SpatiaLite bringt dafür die Tabelle "SpatialIndex" mit, die
          # zuerst grob nach Rechtecken vorsortiert; erst die wenigen
          # Übriggebliebenen werden genau gerechnet.
          echo "### In eine SpatiaLite-Datenbank umziehen"
          rm -f /tmp/arbeit.sqlite
          for e in parzellen zonen; do
            ogr2ogr -f SQLite /tmp/arbeit.sqlite -append \
              -dsco SPATIALITE=YES -lco SPATIAL_INDEX=YES \
              -nln "$e" /tmp/arbeit.gpkg "$e"
          done

          # Die Typentabelle hat keine Geometrie und kommt ohne Index
          # dazu -- sie liefert nur den Namen zum Schlüssel.
          namen_wahl=""
          namen_join=""
          if ogrinfo -so /tmp/arbeit.gpkg zonentyp > /dev/null 2>&1; then
            ogr2ogr -f SQLite /tmp/arbeit.sqlite -append \
              -dsco SPATIALITE=YES -nln zonentyp /tmp/arbeit.gpkg zonentyp
            namen_wahl="t.bezeichnung AS zone_name, t.abkuerzung AS zone_kurz,"
            namen_join="LEFT JOIN zonentyp t ON t.typ_id = z.typ"
          fi
          echo "Zonennamen: ${namen_wahl:-keine}"

          echo "### Was in der Arbeitsdatenbank steht"
          for e in parzellen zonen; do
            echo "-- $e"
            ogrinfo -so /tmp/arbeit.sqlite "$e" 2>/dev/null \
              | sed -n '/^Feature Count/p;/^[A-Za-z_0-9]*: /p'
          done

          # SpatiaLite führt selbst Buch darüber, wie die Geometriespalte
          # jeder Tabelle heisst. Diese Tabelle zu fragen ist verlässlich;
          # aus der Textausgabe von ogrinfo zu lesen war es nicht.
          spalte() {
            ogrinfo -q /tmp/arbeit.sqlite -sql \
              "SELECT f_geometry_column FROM geometry_columns
               WHERE f_table_name = '$1'" 2>/dev/null \
              | sed -n 's/.*= //p' | head -1
          }
          gsp=$(spalte parzellen)
          gsz=$(spalte zonen)
          echo "Geometrie: parzellen.${gsp:?} zonen.${gsz:?}"

          echo
          echo "### Verschneiden"
          ogr2ogr -f CSV /tmp/verschnitten.csv /tmp/arbeit.sqlite \
            -dialect sqlite -sql "
              SELECT
                g.egris_egrid                          AS egrid,
                g.nummer                               AS parzelle,
                g.nbident                              AS vermessungskreis,
                g.art                                  AS art,
                g.flaechenmass                         AS flaeche_m2,
                z.Typ                                  AS zone_typ,
                $namen_wahl
                ROUND(ST_Area(ST_Intersection(g.$gsp, z.$gsz)))
                                                       AS zone_m2,
                ROUND(100.0 * ST_Area(ST_Intersection(g.$gsp, z.$gsz))
                      / NULLIF(g.flaechenmass, 0))     AS anteil_prozent
              FROM parzellen g
              JOIN zonen z
              $namen_join
              WHERE z.ROWID IN (
                      SELECT ROWID FROM SpatialIndex
                      WHERE f_table_name = 'zonen'
                        AND search_frame = g.$gsp)
                AND ST_Intersects(g.$gsp, z.$gsz)
                AND ST_Area(ST_Intersection(g.$gsp, z.$gsz)) > 5
            " || { echo "Verschneiden fehlgeschlagen"; exit 1; }

          zeilen=$(( $(wc -l < /tmp/verschnitten.csv) - 1 ))
          echo "Zeilen: $zeilen"
          if [ "$zeilen" -lt 1000 ]; then
            echo "Zu wenige Zeilen -- erwartet werden Zehntausende." >&2
            head -5 /tmp/verschnitten.csv
            exit 1
          fi
          head -5 /tmp/verschnitten.csv

      - name: Verschnitt bereitstellen
        if: ${{ inputs.schritt == 'alles' || inputs.schritt == 'verschneiden' }}
        uses: actions/upload-artifact@v4
        with:
          name: verschnitten-${{ inputs.kanton }}
          path: /tmp/verschnitten.csv
          if-no-files-found: warn

      # ---------------------------------------------------------------
      # Die Umrisse
      # ---------------------------------------------------------------
      # Sie laufen längst durch diese Pipeline: zum Verschneiden wird
      # jede Parzellenfläche gegen jede Zonenfläche gerechnet. Danach
      # wurden sie weggeworfen. Dabei hängt genau an ihnen die Frage,
      # die das ganze Vorhaben trägt -- welche Parzellen grenzen an
      # diese? Arrondierung, Baugesuch-Meldung und
      # Nachbarschaftsanalyse brauchen sie alle.
      #
      # Gebraucht wird weder ein räumlicher Index noch SpatiaLite: nur
      # EGRID und Umriss als Text. ogr2ogr schreibt den Umriss selbst
      # als WKT, wenn man es ihm sagt -- so muss der Name der
      # Geometriespalte nicht geraten werden.
      - name: Umrisse herauslösen
        if: ${{ inputs.schritt == 'geometrie'
                || inputs.schritt == 'geometrie-schreiben' }}
        run: |
          set -euo pipefail

          # Kommt die fertige Liste aus einem früheren Lauf, ist hier
          # nichts mehr zu tun -- die Umwandlung der Vermessung dauert
          # eine halbe Stunde und ändert sich nicht.
          if [ -s /tmp/geometrie.csv ]; then
            echo "Umrisse stammen aus Lauf ${{ inputs.quelllauf }}."
            echo "Zeilen: $(( $(wc -l < /tmp/geometrie.csv) - 1 ))"
            exit 0
          fi

          if [ ! -f /tmp/parzellen.gpkg ]; then
            echo "Keine Parzellendatei und keine fertige Liste." >&2
            echo "Entweder ohne 'quelllauf' laufen lassen -- dann wird" >&2
            echo "die Vermessung hier umgewandelt -- oder die Nummer" >&2
            echo "eines Laufs angeben, der sie schon hat." >&2
            exit 1
          fi

          echo "### Umrisse als Text"
          # Die Fläche steht nicht bei "grundstueck", sondern bei
          # "liegenschaft" -- so trennt das INTERLIS-Modell Angaben und
          # Geometrie. Verknüpft wird über T_Id, genau wie beim
          # Verschneiden. Der erste Versuch las nur "grundstueck" und
          # bekam eine Datei mit einer einzigen Spalte.
          #
          # CONVERT_TO_LINEAR ist nicht optional: die amtlichen Grenzen
          # enthalten Kreisbögen, und ein CURVEPOLYGON nimmt eine
          # Spalte vom Typ MultiPolygon nicht an.
          ogr2ogr -f CSV /tmp/geometrie.csv /tmp/parzellen.gpkg \
            -nlt CONVERT_TO_LINEAR \
            -dialect sqlite -sql "
              SELECT g.egris_egrid AS egrid, l.geometrie
                FROM liegenschaft l
                JOIN grundstueck g ON g.T_Id = l.liegenschaft_von
               WHERE g.egris_egrid IS NOT NULL" \
            -lco GEOMETRY=AS_WKT -lco GEOMETRY_NAME=wkt

          zeilen=$(( $(wc -l < /tmp/geometrie.csv) - 1 ))
          echo "Zeilen: $zeilen"
          if [ "$zeilen" -lt 1000 ]; then
            echo "Zu wenige -- erwartet werden Zehntausende." >&2
            head -3 /tmp/geometrie.csv
            exit 1
          fi

          # Die Reihenfolge der Spalten entscheidet beim Einlesen --
          # \copy ordnet nach Stellung, nicht nach Namen. Stimmt sie
          # nicht, landet der Umriss im EGRID-Feld, und das fiele erst
          # auf, wenn die Karte leer bleibt.
          kopf=$(head -1 /tmp/geometrie.csv)
          if [ "$kopf" != "wkt,egrid" ]; then
            echo "Unerwartete Kopfzeile: $kopf -- erwartet wkt,egrid" >&2
            exit 1
          fi

          # Nie eine ganze Zeile ins Protokoll: ein Umriss ist Hunderte
          # Zeichen lang und sagt dort nichts.
          echo "Kopfzeile: $kopf"
          echo "Erste Zeile gekürzt: $(sed -n '2p' /tmp/geometrie.csv | cut -c1-80)"
          ls -lh /tmp/geometrie.csv

      - name: Umrisse bereitstellen
        if: ${{ always()
                && (inputs.schritt == 'geometrie'
                    || inputs.schritt == 'geometrie-schreiben') }}
        uses: actions/upload-artifact@v4
        with:
          name: geometrie-${{ inputs.kanton }}
          path: /tmp/geometrie.csv
          if-no-files-found: warn

      - name: Umrisse einspielen
        if: ${{ inputs.schritt == 'geometrie-schreiben' }}
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          KANTON: ${{ inputs.kanton }}
          MENGE: ${{ inputs.menge }}
          GRENZE_MB: ${{ inputs.grenze_mb }}
          # Nur der Suchpfad. Die Zeitgrenze steht hier bewusst nicht:
          # Supabase setzt statement_timeout auf der Rolle, und
          # Rolleneinstellungen schlagen Startoptionen.
          PGOPTIONS: "-c search_path=public,extensions"
        run: |
          set -euo pipefail
          [ -n "${DB:-}" ] || { echo "Kein Datenbankzugang."; exit 1; }

          groesse() {
            psql "$DB" -X -q -t -A -c "set statement_timeout = '30s';" \
              -c "select pg_size_pretty(pg_database_size(current_database()));"
          }

          # Die Grenze der Grösse prüft der Helfer vor jedem Stück.
          echo "### Vorher" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Datenbank: $(groesse)" | tee -a "$GITHUB_STEP_SUMMARY"

          # ----------------------------------------------- in Stuecke
          # Kein grosses Zwischenlager: der erste Versuch legte alle
          # 137'269 Umrisse als Text in eine Tabelle -- 82 MB, die nach
          # dem Absturz liegenblieben und die Datenbank auf nur-lesen
          # brachten. Jedes Stück wandert durch eine Sitzungstabelle, mit
          # Pause danach (tools/in_portionen.sh, wie «Umrisse laden»).
          # ST_MakeValid: ein sich selbst schneidender Umriss liesse
          # später ST_Touches scheitern.
          if [ "${MENGE:-0}" -gt 0 ]; then
            head -n $(( MENGE + 1 )) /tmp/geometrie.csv > /tmp/geometrie_teil.csv
            echo "Höchstens $MENGE Umrisse." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            cp /tmp/geometrie.csv /tmp/geometrie_teil.csv
          fi
          AUFRAEUMEN=public.properties tools/in_portionen.sh /tmp/geometrie_teil.csv \
            "create temp table eingang (wkt text, egrid text);" "
            with kand as (
              select e.egrid, ST_Multi(ST_CollectionExtract(ST_MakeValid(ST_GeomFromText(e.wkt, 2056)), 3)) as g
                from eingang e
                join public.properties p on p.egrid = e.egrid
               where p.geometrie is null
                 and (e.wkt like 'POLYGON%' or e.wkt like 'MULTIPOLYGON%')
            ), gesetzt as (
              update public.properties p
                 set geometrie        = k.g,
                     geometrie_quelle = 'geodienste.ch AV',
                     geometrie_stand  = now()
                from kand k
               where k.egrid = p.egrid and not ST_IsEmpty(k.g)
              returning 1
            )
            select count(*) from gesetzt;" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Datenbank nach den Umrissen: $(groesse)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

          # Gezählt wird nicht hier: über alle Parzellen zu zählen liest die
          # ganze Tabelle. Den Stand zeigt Auswerten «parzellen-vier».

          # ------------------------------------------- Nachbarschaft
          # Hier wird sie nicht mehr gerechnet. In der Datenbank
          # (nachbarschaft_rechnen) hat das die Seite in der Nacht auf den
          # 16. November eine halbe Stunde lang ausgebremst. Das macht der
          # Ablauf «Nachbarschaft», auf dem Runner statt in der Datenbank.
          echo "Die Nachbarschaft der neuen Umrisse rechnet der Ablauf «Nachbarschaft» (Schritt schreiben)." \
            | tee -a "$GITHUB_STEP_SUMMARY"

          echo "### Nachher" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Datenbank: $(groesse)" | tee -a "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      # Warum das Modell nicht greift
      # ---------------------------------------------------------------
      # Die Parzellen kommen als Field01..Field09 an und die Umrisse
      # fehlen ganz. Beides hat dieselbe Ursache: GDAL wendet das
      # INTERLIS-Modell nicht an. Ohne Modell kennt es weder die
      # Attributnamen noch weiss es, dass die Linien in der Ebene
      # "_Geometrie" zu Flächen der Ebene "Liegenschaft" gehören.
      #
      # Die Meldung dazu stand die ganze Zeit auf der Fehlerausgabe --
      # die ich beim Umwandeln nach /dev/null geschickt hatte. Hier
      # bleibt sie sichtbar.
      - name: Modell prüfen
        if: ${{ inputs.schritt == 'modell' }}
        env:
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail
          basis=https://geodienste.ch/downloads/interlis
          curl -sSL -o /tmp/av.zip "$basis/av/$KANTON/av_${KANTON}_lv95.zip"
          mkdir -p /tmp/av && unzip -o -q /tmp/av.zip -d /tmp/av

          # Die kleinste Gemeinde reicht für den Versuch.
          erste=$(find /tmp/av -name '*.itf' -printf '%s %p\n' \
                  | sort -n | head -1 | cut -d' ' -f2)
          echo "Probe: $erste"
          mitgeliefert=$(find /tmp/av -name '*.ili' | head -1)
          echo "Mitgeliefertes Modell: $mitgeliefert"
          echo

          curl -sSL -o /tmp/vom-bund.ili \
            "https://models.geo.admin.ch/V_D/DM01AVCH24LV95D.ili" || true
          echo "Vom Bund: $(wc -c < /tmp/vom-bund.ili 2>/dev/null || echo 0) Bytes"
          echo

          echo "### Kopf der Datei -- welches Modell sie verlangt"
          head -8 "$erste"
          echo

          for m in "$mitgeliefert" /tmp/vom-bund.ili; do
            [ -s "$m" ] || continue
            echo "=============== $m"
            for e in Liegenschaften__Grundstueck Liegenschaften__Liegenschaft \
                     Liegenschaften__Liegenschaft_Geometrie; do
              echo "--- $e"
              # Die Warnungen betreffen die Fixpunkt-Tabellen, die uns
              # nicht interessieren, und verdecken sonst die Antwort.
              ogrinfo -so "$erste,$m" "$e" 2>&1 \
                | grep -v '^Warning 1: No ' | head -20
              echo
            done
          done

      # ---------------------------------------------------------------
      # Gibt es die Vermessung auch fertig?
      # ---------------------------------------------------------------
      # INTERLIS 1 bringt die Attributnamen nur mit passendem Modell,
      # und beide amtlichen Modelle greifen hier nicht: die Felder
      # heissen Field01..Field09, die Umrisse liegen als lose Linien in
      # einer eigenen Ebene. Das liesse sich mit genug Aufwand von Hand
      # zusammensetzen -- aber nur, wenn es keinen fertigen Weg gibt.
      #
      # geodienste.ch liefert manche Themen zusätzlich als GeoPackage
      # oder Shapefile. Dort sind Namen und Flächen bereits gebildet.
      # Dieser Schritt sieht nach, was es gibt, statt es zu vermuten.
      - name: Formate prüfen
        if: ${{ inputs.schritt == 'formate' }}
        env:
          KANTON: ${{ inputs.kanton }}
        run: |
          set -uo pipefail
          basis=https://geodienste.ch/downloads
          for ordner in gpkg shp shape dxf interlis; do
            for datei in \
              "av/$KANTON/av_${KANTON}_lv95.zip" \
              "av/$KANTON/av_${KANTON}_lv95.gpkg" \
              "av/av_${KANTON}_lv95.zip"; do
              url="$basis/$ordner/$datei"
              code=$(curl -sS -o /dev/null -w '%{http_code} %{size_download}' \
                     -r 0-0 "$url" 2>/dev/null || echo "---")
              echo "$code  $url"
            done
          done

          echo
          echo "### Was der Dienst selbst über die Formate sagt"
          curl -sS "https://geodienste.ch/services/av" \
            -H 'Accept: application/json' 2>/dev/null | head -c 2000
          echo

      # ---------------------------------------------------------------
      # Der amtliche Weg
      # ---------------------------------------------------------------
      # geodienste liefert die Vermessung ausschliesslich als INTERLIS 1
      # (alle anderen Formate: 404). GDAL kommt damit nur halb zurecht --
      # es kennt die Attributnamen nicht und bildet aus den Grenzlinien
      # keine Flächen.
      #
      # Für genau diese Aufgabe gibt es ili2gpkg aus der offiziellen
      # INTERLIS-Werkzeugkette: es liest das Modell, benennt die Spalten
      # wie im Modell und setzt die Grenzlinien zu Flächen zusammen.
      # Erst damit ergibt "Fläche der Parzelle" überhaupt einen Wert.
      - name: Mit ili2gpkg umwandeln
        if: ${{ inputs.schritt == 'ili2gpkg' }}
        env:
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail
          java -version 2>&1 | head -2

          curl -sSL -o /tmp/ili2gpkg.zip \
            "https://downloads.interlis.ch/ili2gpkg/ili2gpkg-5.1.1.zip"
          ls -lh /tmp/ili2gpkg.zip
          unzip -o -q /tmp/ili2gpkg.zip -d /tmp/ili2gpkg
          jar=$(find /tmp/ili2gpkg -name 'ili2gpkg*.jar' | head -1)
          echo "Werkzeug: $jar"

          basis=https://geodienste.ch/downloads/interlis
          curl -sSL -o /tmp/av.zip "$basis/av/$KANTON/av_${KANTON}_lv95.zip"
          mkdir -p /tmp/av && unzip -o -q /tmp/av.zip -d /tmp/av

          # Erst an der kleinsten Gemeinde -- wenn das trägt, folgt der Rest.
          erste=$(find /tmp/av -name '*.itf' -printf '%s %p\n' \
                  | sort -n | head -1 | cut -d' ' -f2)
          echo "Probe: $erste"

          rm -f /tmp/probe.gpkg
          # INTERLIS 1 schreibt das Koordinatensystem nicht in die Datei;
          # ohne Angabe bricht das Werkzeug ab. 2056 ist LV95, das
          # Schweizer Bezugssystem seit 2016.
          # In einem Zug schlug der Import fehl, weil eine Tabelle noch
          # nicht bestand. Erst das Gerüst anlegen, dann füllen -- der
          # vom Werkzeug vorgesehene Weg.
          modelldir="/tmp/av;http://models.interlis.ch/;https://models.geo.admin.ch/"
          java -jar "$jar" --dbfile /tmp/probe.gpkg \
            --modeldir "$modelldir" --defaultSrsCode 2056 \
            --models DM01AVCH24LV95D \
            --schemaimport > /tmp/schema.log 2>&1 || true
          grep -iE 'error|failed' /tmp/schema.log | head -10 \
            || echo "(Gerüst ohne Fehler)"
          tail -2 /tmp/schema.log

          echo
          java -jar "$jar" --dbfile /tmp/probe.gpkg \
            --modeldir "$modelldir" --defaultSrsCode 2056 \
            --disableValidation \
            --import "$erste" > /tmp/ili2gpkg.log 2>&1 || true

          # Die Meldungen zwischen tausend Zeilen "Info: validate ..."
          # herauszufischen ist der halbe Erfolg.
          grep -iE 'error|fehler|failed|warning' /tmp/ili2gpkg.log \
            | head -20 || echo "(keine Fehlermeldungen)"
          tail -3 /tmp/ili2gpkg.log

          echo
          ls -lh /tmp/probe.gpkg || { echo "Keine Ausgabe entstanden."; exit 1; }
          echo "### Ebenen mit Flächen"
          ogrinfo -so -al /tmp/probe.gpkg 2>/dev/null \
            | grep -E 'Layer name|Feature Count|Geometry:' | paste - - - \
            | grep -i 'liegenschaft\|grundstueck' || true

          # Das Werkzeug benennt die Ebenen nach dem Modell, klein
          # geschrieben und ohne Themenpräfix: grundstueck, liegenschaft.
          for e in grundstueck liegenschaft; do
            echo
            echo "### Spalten von $e"
            ogrinfo -so /tmp/probe.gpkg "$e" 2>&1 | sed -n '/^[a-z_]*:/p'
            echo "--- Probe"
            ogr2ogr -f CSV /vsistdout/ /tmp/probe.gpkg "$e" \
              -limit 3 -lco GEOMETRY=NO 2>/dev/null || true
          done

      # ---------------------------------------------------------------
      # Nur die Zonennamen
      # ---------------------------------------------------------------
      # Im grossen Lauf geht die Meldung des Lesers zwischen tausend
      # anderen Zeilen unter. Hier steht sie allein.
      - name: Zonentypen lesen
        if: ${{ inputs.schritt == 'zonentypen' }}
        run: |
          set -euo pipefail
          echo "### Alle Dateien der Lieferung"
          # Bisher wurde blind die erste XTF-Datei genommen. In ihr steht
          # keine Typentabelle -- gut möglich, dass sie in einer zweiten
          # liegt, die dabei ist.
          find /tmp/npl -type f -printf '%p  %s Bytes\n' | sort
          echo
          # Auch die XML-Dateien: in der Lieferung liegt
          # "Nutzungsplanung_Catalogue_CH_V1_2_20210901.xml", und genau
          # das ist der Katalog, auf den die Typen verweisen. Bisher
          # wurden nur XTF-Dateien gelesen -- er blieb ungeöffnet.
          echo "### Leser über alle XTF- und XML-Dateien"
          for f in $(find /tmp/npl \( -name '*.xtf' -o -name '*.xml' \) \
                     | sort); do
            echo "-- $f"
            # Nicht kappen: beim letzten Lauf schnitt "head -8" die
            # Liste der Elemente ab, bevor die gesuchte Zeile kam.
            python3 tools/zonentypen.py "$f" "/tmp/typen_$(basename "$f").csv" \
              2>&1 | head -70 || true
          done
          # Die grösste nicht leere Ausgabe gewinnt.
          erg=$(ls -S /tmp/typen_*.csv 2>/dev/null | head -1 || true)
          [ -n "$erg" ] && cp "$erg" /tmp/zonentypen.csv || true
          echo
          echo "### Ergebnis"
          head -10 /tmp/zonentypen.csv

      # =============================================================
      # In die Datenbank
      # =============================================================
      # Bis hierher liegt das Ergebnis als Datei am Lauf. Nützlich wird
      # es erst in der Datenbank hinter wohntraums.life -- dort suchen
      # die Masterliste und der Pipedrive-Abgleich.
      #
      # Je Parzelle gibt es mehrere Zeilen, eine je Zone. Übernommen
      # wird die grösste: sie bestimmt, was auf dem Grundstück gebaut
      # werden darf. Die übrigen Anteile stehen im Text daneben, damit
      # niemand später rätselt, warum die Fläche nicht aufgeht.
      #
      # Adressen liefert die Vermessung nicht mit. "address" ist aber
      # ein Pflichtfeld, deshalb steht dort vorerst die Parzelle --
      # ehrlicher als eine erfundene Strasse, und beim Nachliefern der
      # Gebäudedaten leicht zu erkennen.
      - name: Verschnitt holen
        if: ${{ startsWith(inputs.schritt, 'einspielen') }}
        uses: actions/download-artifact@v4
        with:
          pattern: 'verschnitten-${{ inputs.kanton }}'
          merge-multiple: true
          path: /tmp
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.quelllauf }}
          repository: ${{ github.repository }}

      # =============================================================
      # Zürcher Zonen
      # =============================================================
      # geodienste.ch führt die Zürcher Nutzungsplanung nicht («Im
      # Aufbau»); der Kanton gibt sie selbst frei heraus (OGDZHWFS).
      # Verschnitten wird auf dem Runner (tools/zh_zonen.py, Shapely),
      # mit den Umrissen aus der Vermessung bei geodienste.ch. Das
      # Ergebnis hat die Form des Verschnitts und geht durch «Einspielen».
      - name: Zürcher Zonen verschneiden
        if: ${{ startsWith(inputs.schritt, 'zh-zonen') }}
        env:
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail
          [ "$KANTON" = "ZH" ] || { echo "zh-zonen gilt nur für ZH."; exit 1; }
          # Am 15. November antwortete maps.zh.ch einem Runner nicht
          # (Zeitüberschreitung beim Verbindungsaufbau). Lieber hier nach
          # einer halben Minute klar enden als nach einer Stunde Warten.
          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' \
                   "https://maps.zh.ch/wfs/OGDZHWFS?SERVICE=WFS&REQUEST=GetCapabilities" || echo "keine Antwort")
          echo "maps.zh.ch: $code"
          [ "$code" = "200" ] || { echo "Der Zürcher Dienst antwortet dem Runner nicht." >&2; exit 1; }
          pip install -q shapely
          python3 tools/umrisse_laden.py ZH /tmp/umrisse.csv
          python3 tools/zh_zonen.py /tmp/umrisse.csv /tmp/verschnitten.csv

      - name: Einspielen
        if: ${{ startsWith(inputs.schritt, 'einspielen') || startsWith(inputs.schritt, 'liste')
                || startsWith(inputs.schritt, 'zh-zonen') }}
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          KANTON: ${{ inputs.kanton }}
          GRENZE_MB: ${{ inputs.grenze_mb }}
        run: |
          set -euo pipefail
          [ -n "${DB:-}" ] || { echo "Kein Datenbankzugang."; exit 1; }
          sudo apt-get install -y -qq postgresql-client

          # «liste»: ohne Verschnitt, jede Liegenschaft der Vermessung mit
          # Nummer, BFS-Nummer und Fläche, noch ohne Zone.
          quelle=/tmp/verschnitten.csv
          case "${{ inputs.schritt }}" in liste*) quelle=- ;; esac
          [ "$quelle" = "-" ] || echo "Zeilen im Verschnitt: $(( $(wc -l < "$quelle") - 1 ))"

          # Die Rechnung läuft hier, auf dem Runner: je Parzelle die
          # grösste Zone, mit Fläche und Anteil. Bis zum 18. November lud
          # dieser Schritt den ganzen Verschnitt in eine Tabelle der
          # Datenbank (verschnitt_tg, ohne Zeilenschutz neu angelegt) und
          # rechnete dort mit einer Anweisung von bis zu 30 Minuten.
          # Die BFS-Nummer kommt aus der Vermessung (Sekunden, ohne Umriss).
          python3 tools/av_liste.py "$KANTON" /tmp/av.csv
          python3 tools/kanton_haupt.py "$quelle" /tmp/av.csv /tmp/haupt.csv

          echo "### Die zehn häufigsten Zonen"
          python3 - <<'PY'
          import csv, re
          from collections import Counter
          z = Counter(re.sub(r' \([^)]*\)$', '', r['zone']) for r in csv.DictReader(open('/tmp/haupt.csv', encoding='utf-8')))
          for name, n in z.most_common(10):
              print(f'{n:>8}  {name or "(ohne)"}')
          PY

          tabelle="create temp table eingang (egrid text, parzelle text, bfs_nr text, flaeche numeric, zone text, notiz text);"

          if [[ "${{ inputs.schritt }}" != *-schreiben ]]; then
            echo "### Was geschrieben würde"
            psql "$DB" -v ON_ERROR_STOP=1 -X -q \
              -c "set statement_timeout = '2min';" \
              -c "$tabelle" \
              -c "\\copy eingang from '/tmp/haupt.csv' with (format csv, header true)" \
              -c "
                select count(*)                                    as parzellen,
                       count(*) - count(p.id)                      as neu,
                       count(p.id)                                 as schon_da,
                       count(*) filter (where p.id is not null and p.kanton is distinct from '$KANTON') as anderer_kanton,
                       count(*) filter (where p.id is not null and nullif(p.zone, '') is null and e.zone is not null) as zone_dazu,
                       count(*) filter (where p.id is not null and p.area is null and e.flaeche is not null) as flaeche_dazu
                  from eingang e
                  left join public.properties p on p.egrid = e.egrid;"
            echo ""
            echo "**Probelauf** -- die Tabelle properties wurde nicht berührt."
            exit 0
          fi

          echo "### Schreiben" | tee -a "$GITHUB_STEP_SUMMARY"
          # Neue Parzellen kommen dazu; bei bestehenden wird nur ergänzt,
          # was fehlt und hier steht. Eine vollständige Zeile bleibt
          # unberührt: jede Änderung legt eine neue Fassung der Zeile an
          # und weckt den Auslöser, der das Potenzial rechnet.
          AUFRAEUMEN=public.properties tools/in_portionen.sh /tmp/haupt.csv "$tabelle" "
            with g as (
              insert into public.properties
                (address, egrid, plot_number, parzelle, bfs_nr, kanton, area, zone, notes)
              select 'Parzelle ' || coalesce(e.parzelle, '?'), e.egrid, e.parzelle, e.parzelle,
                     e.bfs_nr, '$KANTON', e.flaeche, e.zone, e.notiz
                from eingang e
              on conflict (egrid) where egrid is not null do update set
                parzelle    = coalesce(public.properties.parzelle, excluded.parzelle),
                plot_number = coalesce(public.properties.plot_number, excluded.plot_number),
                bfs_nr      = coalesce(public.properties.bfs_nr, excluded.bfs_nr),
                kanton      = coalesce(public.properties.kanton, excluded.kanton),
                area        = coalesce(public.properties.area, excluded.area),
                zone        = coalesce(nullif(public.properties.zone, ''), excluded.zone),
                notes       = case when public.properties.notes = 'Aus der Liste der Vermessung, noch ohne Zone'
                                    and nullif(public.properties.zone, '') is null and excluded.zone is not null
                                   then excluded.notes else public.properties.notes end
              where (public.properties.parzelle is null and excluded.parzelle is not null)
                 or (public.properties.plot_number is null and excluded.plot_number is not null)
                 or (public.properties.bfs_nr is null and excluded.bfs_nr is not null)
                 or (public.properties.kanton is null)
                 or (public.properties.area is null and excluded.area is not null)
                 or (nullif(public.properties.zone, '') is null and excluded.zone is not null)
              returning 1)
            select count(*) from g;" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Umrisse danach mit «Umrisse laden» ($KANTON), Adressen und Gebäude mit Schritt gwr-schreiben." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # =============================================================
      # Gebäude- und Wohnungsregister
      # =============================================================
      # Die amtliche Vermessung kennt Parzellen, aber keine Häuser: kein
      # Baujahr, keine Geschosse, keine Adresse. Genau die drei
      # entscheiden am Telefon, ob sich ein Anruf lohnt.
      #
      # Das Register führt der Bund, kantonsweise und frei abrufbar. Es
      # trägt die EGID je Gebäude und die EGRID der Parzelle darunter --
      # damit lässt es sich an den Verschnitt hängen.
      #
      # Der erste Lauf sieht nur nach: welche Dateien, welche Spalten.
      # Auf Spaltennamen zu raten hat in diesem Vorhaben schon genug
      # Läufe gekostet.
      - name: Register ansehen
        if: ${{ startsWith(inputs.schritt, 'gwr') }}
        env:
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail
          klein=$(echo "$KANTON" | tr 'A-Z' 'a-z')
          curl -sSL -o /tmp/gwr.zip \
            "https://public.madd.bfs.admin.ch/${klein}.zip"
          ls -lh /tmp/gwr.zip
          file /tmp/gwr.zip
          mkdir -p /tmp/gwr && unzip -o -q /tmp/gwr.zip -d /tmp/gwr
          echo "### Dateien"
          find /tmp/gwr -type f -printf '%p  %s Bytes\n' | sort
          echo
          for f in /tmp/gwr/*.csv; do
            echo "### $(basename "$f")  --  $(( $(wc -l < "$f") - 1 )) Zeilen"
            head -1 "$f" | tr '\t;' '\n\n' | nl | head -40
            echo "-- erste Zeile:"
            sed -n '2p' "$f" | cut -c1-400
            echo
          done

      # =============================================================
      # Register in die Datenbank
      # =============================================================
      # Je Parzelle stehen mehrere Gebäude im Register. Zusammengefasst
      # wird auf dem Runner (tools/gwr_parzellen.py): Adresse und Baujahr
      # des grössten Hauses, die höchste Geschosszahl, Wohnungen und
      # Grundfläche aufsummiert. In die Datenbank geht nur das Ergebnis,
      # stückweise (tools/in_portionen.sh).
      #
      #   gwr-probe      zählen, was sich verbinden liesse
      #   gwr-schreiben  bestehende Parzellen ergänzen (nur, was fehlt)
      #   gwr-anlegen    Parzellen, die es noch nicht gibt, aus dem
      #                  Register anlegen. Für Luzern: dort gibt der
      #                  Kanton die Vermessung nur gegen Gebühr ab, das
      #                  Register ist frei. Es kennt die bebauten
      #                  Parzellen mit EGRID, Nummer, Adresse und Lage
      #                  des Hauses, aber weder Fläche noch Umriss.
      - name: Register einspielen
        if: ${{ startsWith(inputs.schritt, 'gwr-') }}
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          KANTON: ${{ inputs.kanton }}
          GRENZE_MB: ${{ inputs.grenze_mb }}
        run: |
          set -euo pipefail
          [ -n "${DB:-}" ] || { echo "Kein Datenbankzugang."; exit 1; }
          sudo apt-get install -y -qq postgresql-client

          klein=$(echo "$KANTON" | tr 'A-Z' 'a-z')
          curl -sSL --retry 4 -o /tmp/gwr.zip \
            "https://public.madd.bfs.admin.ch/${klein}.zip"
          mkdir -p /tmp/gwr && unzip -o -q /tmp/gwr.zip -d /tmp/gwr
          python3 tools/gwr_parzellen.py /tmp/gwr /tmp/gwr_parzellen.csv | tee -a "$GITHUB_STEP_SUMMARY"

          tabelle="create temp table eingang (egrid text, parzelle text, egid text, adresse text, plz text, ort text,
                     gemeinde text, bfs_nr text, baujahr int, geschosse numeric, wohnungen numeric, flaeche numeric,
                     anzahl int, geb_status text, gebaeudeart text, e numeric, n numeric);"

          echo "### Wie viele Parzellen sich verbinden lassen" | tee -a "$GITHUB_STEP_SUMMARY"
          psql "$DB" -v ON_ERROR_STOP=1 -X -q \
            -c "set statement_timeout = '2min';" \
            -c "$tabelle" \
            -c "\\copy eingang from '/tmp/gwr_parzellen.csv' with (format csv, header true)" \
            -c "
              select count(*)                                              as im_register,
                     count(p.id)                                           as im_bestand,
                     count(*) filter (where p.id is not null and p.kanton = '$KANTON') as im_bestand_dieses_kantons,
                     count(*) - count(p.id)                                as nicht_im_bestand,
                     count(*) filter (where p.address like 'Parzelle %' and e.adresse is not null) as adresse_dazu,
                     count(*) filter (where p.id is not null and p.baujahr is null and e.baujahr is not null) as baujahr_dazu
                from eingang e
                left join public.properties p on p.egrid = e.egrid;" | tee -a "$GITHUB_STEP_SUMMARY"

          case "${{ inputs.schritt }}" in
            gwr-schreiben)
              echo "### Ergänzen" | tee -a "$GITHUB_STEP_SUMMARY"
              AUFRAEUMEN=public.properties tools/in_portionen.sh /tmp/gwr_parzellen.csv "$tabelle" "
                with g as (
                  update public.properties p set
                    address         = case when p.address like 'Parzelle %' and e.adresse is not null
                                           then e.adresse else p.address end,
                    plz             = coalesce(p.plz, e.plz),
                    gemeinde        = coalesce(p.gemeinde, e.gemeinde),
                    bfs_nr          = coalesce(p.bfs_nr, e.bfs_nr),
                    gwr_egid        = coalesce(p.gwr_egid, e.egid),
                    baujahr         = coalesce(p.baujahr, e.baujahr),
                    geschosse       = coalesce(p.geschosse, e.geschosse),
                    wohnungen       = coalesce(p.wohnungen, e.wohnungen),
                    gebaeudeflaeche = coalesce(p.gebaeudeflaeche, e.flaeche),
                    geb_status      = coalesce(p.geb_status, e.geb_status),
                    gebaeudeart     = coalesce(p.gebaeudeart, e.gebaeudeart)
                  from eingang e
                  where p.egrid = e.egrid and p.kanton = '$KANTON'
                    and ((p.address like 'Parzelle %' and e.adresse is not null)
                         or (p.plz is null and e.plz is not null)
                         or (p.gemeinde is null and e.gemeinde is not null)
                         or (p.bfs_nr is null and e.bfs_nr is not null)
                         or (p.gwr_egid is null and e.egid is not null)
                         or (p.baujahr is null and e.baujahr is not null)
                         or (p.geschosse is null and e.geschosse is not null)
                         or (p.wohnungen is null and e.wohnungen is not null)
                         or (p.gebaeudeflaeche is null and e.flaeche is not null)
                         or (p.geb_status is null and e.geb_status is not null)
                         or (p.gebaeudeart is null and e.gebaeudeart is not null))
                  returning 1)
                select count(*) from g;" | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            gwr-anlegen)
              # Nur, wo die Vermessung nicht frei ist. Das Register hängt
              # Häuser auf Baurecht an das Baurecht, nicht an die Parzelle
              # darunter: in Zug sind 747 der 757 EGRID, die in der
              # Vermessung als Liegenschaft fehlen, Baurechte (18. November,
              # in der Lieferung nachgesehen). Wo die Vermessung frei ist,
              # legt «einspielen» die Parzellen an, und Baurechte entstünden
              # hier als falsche zweite Parzellen.
              filter="<fes:Filter xmlns:fes=\"http://www.opengis.net/fes/2.0\"><fes:PropertyIsEqualTo><fes:ValueReference>Kanton</fes:ValueReference><fes:Literal>$KANTON</fes:Literal></fes:PropertyIsEqualTo></fes:Filter>"
              frei=$(curl -sS --retry 3 -G "https://geodienste.ch/db/av_0/deu" \
                       --data-urlencode "SERVICE=WFS" --data-urlencode "VERSION=2.0.0" \
                       --data-urlencode "REQUEST=GetFeature" --data-urlencode "TYPENAMES=ms:RESF" \
                       --data-urlencode "RESULTTYPE=hits" --data-urlencode "FILTER=$filter" \
                       | grep -oP 'numberMatched="\K[0-9]+' || echo "unbekannt")
              if [ "$frei" != "0" ]; then
                echo "Für $KANTON führt geodienste.ch die Vermessung frei ($frei Liegenschaften) oder antwortet nicht." | tee -a "$GITHUB_STEP_SUMMARY"
                echo "Dort legt «einspielen» die Parzellen an; hier entstünden Baurechte als Parzellen." | tee -a "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              echo "### Neu anlegen" | tee -a "$GITHUB_STEP_SUMMARY"
              # Die Lage des Hauses wird zum Punkt der Parzelle, damit sie
              # auf der Karte steht, solange kein Umriss da ist.
              tools/in_portionen.sh /tmp/gwr_parzellen.csv "$tabelle" "
                with neu as (
                  insert into public.properties
                    (address, egrid, plot_number, parzelle, bfs_nr, kanton, plz, gemeinde, gwr_egid,
                     baujahr, geschosse, wohnungen, gebaeudeflaeche, gebaeude_anzahl, geb_status, gebaeudeart, notes)
                  select coalesce(e.adresse, 'Parzelle ' || coalesce(e.parzelle, '?')), e.egrid, e.parzelle, e.parzelle,
                         e.bfs_nr, '$KANTON', e.plz, e.gemeinde, e.egid, e.baujahr, e.geschosse, e.wohnungen,
                         e.flaeche, coalesce(e.anzahl, 1), e.geb_status, e.gebaeudeart,
                         'Aus dem Gebäuderegister angelegt: Fläche und Umriss fehlen, kann ein Baurecht sein'
                    from eingang e
                   where e.egrid like 'CH%'
                  on conflict (egrid) where egrid is not null do nothing
                  returning id, egrid),
                punkt as (
                  insert into public.parzelle_punkt (parzelle_id, e, n, quelle)
                  select neu.id, e.e, e.n, 'gebäuderegister'
                    from neu join eingang e on e.egrid = neu.egrid
                   where e.e is not null and e.n is not null
                  on conflict (parzelle_id) do nothing
                  returning 1)
                select count(*) from neu;" | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo ""
              echo "**Probelauf** -- properties wurde nicht berührt."
              ;;
          esac

      # =============================================================
      # Zonennamen nachziehen
      # =============================================================
      # In der Zonenfläche steht nur ein Schlüssel wie
      # "x4401_221_gngde". Die Verschneidung hat ihn so übernommen, und
      # so steht er heute in der Datenbank -- unbrauchbar für jemanden,
      # der wissen will, ob dort Wohnen erlaubt ist.
      #
      # Neu verschneiden wäre der teure Weg. Der Schlüssel steht ja
      # schon in der Spalte; es fehlt nur die Übersetzung. Die liest
      # dieser Schritt aus derselben Datei und schreibt sie an die
      # Objekte, die den Schlüssel tragen.
      - name: Zonennamen nachziehen
        if: ${{ startsWith(inputs.schritt, 'zonennamen') }}
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail
          [ -n "${DB:-}" ] || { echo "Kein Datenbankzugang."; exit 1; }
          sudo apt-get install -y -qq postgresql-client

          # Alle Dateien zugleich: Zug liefert eine je Gemeinde. Bis zum
          # 18. November gewann die grösste Ausgabe -- in Zug wären das
          # die Typen der Stadt allein gewesen.
          python3 tools/zonentypen.py $(find /tmp/npl -name '*.xtf' | sort) /tmp/zonentypen.csv
          [ "$(wc -l < /tmp/zonentypen.csv)" -gt 1 ] || { echo "Keine Typen gefunden."; exit 1; }

          tabelle="create temp table eingang (typ_id text, code text, bezeichnung text, abkuerzung text);"
          echo "### Wie viele Objekte tragen noch einen Schlüssel"
          psql "$DB" -v ON_ERROR_STOP=1 -X -q \
            -c "set statement_timeout = '2min';" \
            -c "$tabelle" \
            -c "\\copy eingang from '/tmp/zonentypen.csv' with (format csv, header true)" \
            -c "
              select count(*) as mit_schluessel, count(t.typ_id) as davon_uebersetzbar
                from public.properties p
                left join eingang t on t.typ_id = p.zone
               where p.kanton = '$KANTON' and p.zone like 'x%_gngde';"

          if [ "${{ inputs.schritt }}" != "zonennamen-schreiben" ]; then
            echo ""
            echo "**Probelauf** -- properties wurde nicht berührt."
            exit 0
          fi

          echo "### Schreiben"
          # Das Kürzel voran, wie es in den Zürcher Zonen steht: beim
          # Telefonieren nennt man "W2", nicht den ganzen Satz. Stückweise
          # über die Typen: je Stück nur die Objekte dieser Typen.
          tools/in_portionen.sh /tmp/zonentypen.csv "$tabelle" "
            with g as (
              update public.properties p
                 set zone = trim(coalesce(nullif(t.abkuerzung,'') || ' ', '')
                                 || coalesce(nullif(t.bezeichnung,''), t.abkuerzung))
                from eingang t
               where t.typ_id = p.zone and p.kanton = '$KANTON'
                 and coalesce(nullif(t.bezeichnung,''), t.abkuerzung) is not null
              returning 1)
            select count(*) from g;"

      # =============================================================
      # Zone am Haus
      # =============================================================
      # Für Luzern. Dort gibt der Kanton die Vermessung nur gegen Gebühr
      # ab (Geodatenshop, 18. November: «AV Liegenschaften», 120'601
      # Flächen, gebührenpflichtig), die Nutzungsplanung aber frei. Ohne
      # Umriss lässt sich keine Parzelle mit den Zonen verschneiden; das
      # Haus aus dem Register hat aber seine Lage. Die Zone unter dem
      # grössten Haus wird zur Zone der Parzelle -- als Annahme: liegt die
      # Parzelle über zwei Zonen, steht hier nur die eine, und ohne Fläche
      # rechnet kein Potenzial.
      #
      # Gerechnet wird auf dem Runner, in SpatiaLite wie beim
      # Verschneiden; in die Datenbank kommt nur das Ergebnis, stückweise,
      # und nur dort, wo noch keine Zone steht.
      - name: Zone am Haus
        if: ${{ startsWith(inputs.schritt, 'zonen-punkte') }}
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          KANTON: ${{ inputs.kanton }}
          GRENZE_MB: ${{ inputs.grenze_mb }}
        run: |
          set -euo pipefail
          [ -n "${DB:-}" ] || { echo "Kein Datenbankzugang."; exit 1; }
          sudo apt-get install -y -qq postgresql-client

          klein=$(echo "$KANTON" | tr 'A-Z' 'a-z')
          curl -sSL --retry 4 -o /tmp/gwr.zip "https://public.madd.bfs.admin.ch/${klein}.zip"
          mkdir -p /tmp/gwr && unzip -o -q /tmp/gwr.zip -d /tmp/gwr
          python3 tools/gwr_parzellen.py /tmp/gwr /tmp/gwr_parzellen.csv

          rm -f /tmp/haeuser.sqlite
          ogr2ogr -f SQLite /tmp/haeuser.sqlite -dsco SPATIALITE=YES -lco SPATIAL_INDEX=YES \
            -nln punkte -a_srs EPSG:2056 \
            -oo X_POSSIBLE_NAMES=e -oo Y_POSSIBLE_NAMES=n -oo KEEP_GEOM_COLUMNS=NO \
            /tmp/gwr_parzellen.csv
          ogr2ogr -f SQLite /tmp/haeuser.sqlite -append -lco SPATIAL_INDEX=YES \
            -nln zonen /tmp/zonen.gpkg zonen
          namen_wahl="NULL AS zone_name, NULL AS zone_kurz,"
          namen_join=""
          if [ -s /tmp/zonentypen.csv ]; then
            ogr2ogr -f SQLite /tmp/haeuser.sqlite -append -nln zonentyp /tmp/zonentypen.csv
            namen_wahl="t.bezeichnung AS zone_name, t.abkuerzung AS zone_kurz,"
            namen_join="LEFT JOIN zonentyp t ON t.typ_id = z.typ"
          fi
          spalte() {
            ogrinfo -q /tmp/haeuser.sqlite -sql \
              "SELECT f_geometry_column FROM geometry_columns WHERE f_table_name = '$1'" 2>/dev/null \
              | sed -n 's/.*= //p' | head -1
          }
          gsp=$(spalte punkte); gsz=$(spalte zonen)
          echo "Geometrie: punkte.${gsp:?} zonen.${gsz:?}"

          ogr2ogr -f CSV /tmp/haus_zonen.csv /tmp/haeuser.sqlite -dialect sqlite -sql "
            SELECT p.egrid AS egrid, z.Typ AS zone_typ, $namen_wahl
                   ROUND(ST_Area(z.$gsz)) AS zone_m2
              FROM punkte p
              JOIN zonen z
              $namen_join
             WHERE z.ROWID IN (SELECT ROWID FROM SpatialIndex
                                WHERE f_table_name = 'zonen' AND search_frame = p.$gsp)
               AND ST_Contains(z.$gsz, p.$gsp)"

          # Eine Zone je Parzelle; liegt das Haus auf zwei (überlappende
          # Lieferung), gewinnt die kleinere Fläche, die genauere.
          python3 - <<'PY'
          import csv
          from collections import Counter
          beste = {}
          for r in csv.DictReader(open('/tmp/haus_zonen.csv', encoding='utf-8')):
              kurz, name = (r.get('zone_kurz') or '').strip(), (r.get('zone_name') or '').strip()
              text = ' '.join(t for t in (kurz, name if name != kurz else '') if t) or (r.get('zone_typ') or '').strip()
              m2 = float(r.get('zone_m2') or 0)
              if text and (r['egrid'] not in beste or m2 < beste[r['egrid']][0]):
                  beste[r['egrid']] = (m2, text)
          with open('/tmp/zone_am_haus.csv', 'w', newline='', encoding='utf-8') as f:
              w = csv.writer(f); w.writerow(['egrid', 'zone'])
              for e, (_, z) in sorted(beste.items()):
                  w.writerow([e, z])
          print(f'{len(beste)} Parzellen mit Zone am Haus')
          for z, n in Counter(v for _, v in beste.values()).most_common(10):
              print(f'{n:>8}  {z}')
          PY

          tabelle="create temp table eingang (egrid text, zone text);"
          psql "$DB" -v ON_ERROR_STOP=1 -X -q \
            -c "set statement_timeout = '2min';" \
            -c "$tabelle" \
            -c "\\copy eingang from '/tmp/zone_am_haus.csv' with (format csv, header true)" \
            -c "
              select count(*) as mit_zone_am_haus,
                     count(p.id) as im_bestand,
                     count(*) filter (where p.id is not null and nullif(p.zone, '') is null) as zone_dazu
                from eingang e
                left join public.properties p on p.egrid = e.egrid and p.kanton = '$KANTON';" \
            | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "${{ inputs.schritt }}" != "zonen-punkte-schreiben" ]; then
            echo ""
            echo "**Probelauf** -- properties wurde nicht berührt."
            exit 0
          fi

          echo "### Schreiben" | tee -a "$GITHUB_STEP_SUMMARY"
          tools/in_portionen.sh /tmp/zone_am_haus.csv "$tabelle" "
            with g as (
              update public.properties p
                 set zone = e.zone,
                     notes = trim(coalesce(p.notes || '; ', '') || 'Zone am grössten Haus (Annahme, ohne Umriss)')
                from eingang e
               where p.egrid = e.egrid and p.kanton = '$KANTON' and nullif(p.zone, '') is null
              returning 1)
            select count(*) from g;" | tee -a "$GITHUB_STEP_SUMMARY"
