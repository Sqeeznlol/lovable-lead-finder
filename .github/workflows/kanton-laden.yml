# =====================================================================
# Kanton laden
# =====================================================================
# Holt die amtlichen Geodaten eines Kantons und macht daraus Zeilen für
# die Master-Liste: je Parzelle die Zone, ihr Flächenanteil und die
# Angaben, die für die Potenzialrechnung nötig sind.
#
# Warum dieser Weg: Die Zonen stehen im Kartendienst des Kantons nur als
# Bild. Aus Farben lassen sich weder Zonentyp noch Flächenanteil
# zurückrechnen, und die EGRID -- ohne die sich nichts mit dem übrigen
# Bestand verknüpfen lässt -- steht dort gar nicht. Die Kantone stellen
# dieselben Daten über geodienste.ch als Datei bereit, frei und ohne
# Anmeldung. Belegt am 5. September: Nutzungsplanung TG 41.5 MB,
# Amtliche Vermessung TG 159.5 MB, beide HTTP 200 ohne Zugangsdaten.
#
# INTERLIS ist das amtliche Schweizer Format. Es von Hand zu lesen wäre
# fehleranfällig -- besonders die Kreisbögen in den Grundstücksgrenzen.
# Deshalb übernimmt GDAL die Umwandlung, das den Standard kennt.
# =====================================================================

name: Kanton laden

on:
  workflow_dispatch:
    inputs:
      kanton:
        description: 'Kantonskürzel, z.B. TG'
        required: true
        default: 'TG'
      quelllauf:
        description: 'Nur für "verschneiden": Nummer des Laufs mit den fertigen Dateien'
        required: false
        default: ''
      schritt:
        description: 'Was ausgeführt werden soll'
        required: true
        default: 'pruefen'
        type: choice
        options:
          - pruefen      # Nur nachsehen, was in den Dateien steckt
          - zonen        # Zonen umwandeln und als Datei bereitstellen
          - parzellen    # Amtliche Vermessung ansehen und umwandeln
          - alles        # Zonen und Parzellen laden, verschneiden, ausgeben
          - verschneiden # Fertige Dateien aus einem früheren Lauf verschneiden
          - modell       # Warum das Vermessungsmodell nicht greift
          - formate      # Welche Dateiformate geodienste anbietet
          - ili2gpkg     # Umwandlung mit dem amtlichen INTERLIS-Werkzeug

jobs:
  laden:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge einrichten
        run: |
          sudo apt-get update -qq
          # GDAL kennt INTERLIS und rechnet die Kreisbögen der Grenzen
          # korrekt in Linienzüge um.
          # SpatiaLite bringt die Flächenrechnung mit, die für das
          # Verschneiden nötig ist.
          sudo apt-get install -y -qq gdal-bin python3-gdal unzip \
            libsqlite3-mod-spatialite

      - name: Amtliche Vermessung umwandeln
        if: ${{ inputs.schritt == 'parzellen' || inputs.schritt == 'alles' }}
        env:
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail

          # Warum nicht GDAL: es liest die Datei zwar, kennt aber die
          # Attributnamen nicht (Field01..Field09) und lässt die Grenzen
          # als lose Linien liegen -- ohne Flächen ist die Rechnung
          # wertlos. ili2gpkg aus der amtlichen INTERLIS-Werkzeugkette
          # benennt die Spalten nach dem Modell und setzt die Grenzen zu
          # Flächen zusammen.
          curl -sSL -o /tmp/ili2gpkg.zip \
            "https://downloads.interlis.ch/ili2gpkg/ili2gpkg-5.1.1.zip"
          unzip -o -q /tmp/ili2gpkg.zip -d /tmp/ili2gpkg
          jar=$(find /tmp/ili2gpkg -name 'ili2gpkg*.jar' | head -1)

          # 159 MB für Thurgau; das Herunterladen dauert.
          basis=https://geodienste.ch/downloads/interlis
          curl -sSL -o /tmp/av.zip "$basis/av/$KANTON/av_${KANTON}_lv95.zip"
          ls -lh /tmp/av.zip
          mkdir -p /tmp/av && unzip -o -q /tmp/av.zip -d /tmp/av
          echo "Gemeindedateien: $(find /tmp/av -name '*.itf' | wc -l)"

          modelldir="/tmp/av;http://models.interlis.ch/;https://models.geo.admin.ch/"
          rm -f /tmp/parzellen.gpkg

          # Erst das Gerüst -- in einem Zug mit dem Einlesen scheitert es
          # an einer noch fehlenden Tabelle.  LV95 (2056) muss angegeben
          # werden, weil INTERLIS 1 das Bezugssystem nicht mitschreibt.
          java -jar "$jar" --dbfile /tmp/parzellen.gpkg \
            --modeldir "$modelldir" --defaultSrsCode 2056 \
            --models DM01AVCH24LV95D --schemaimport > /tmp/schema.log 2>&1 \
            || { tail -20 /tmp/schema.log; exit 1; }

          n=0; fehler=0
          for f in /tmp/av/*.itf; do
            n=$((n + 1))
            java -jar "$jar" --dbfile /tmp/parzellen.gpkg \
              --modeldir "$modelldir" --defaultSrsCode 2056 \
              --disableValidation --import "$f" > /tmp/import.log 2>&1 \
              || { fehler=$((fehler + 1)); echo "  fehlgeschlagen: $(basename "$f")"
                   grep -iE 'error' /tmp/import.log | head -3 || true; }
            [ $((n % 20)) -eq 0 ] && echo "  $n Gemeinden ..."
          done
          echo "$n Gemeinden verarbeitet, $fehler fehlgeschlagen."

          ls -lh /tmp/parzellen.gpkg
          echo "### Ebenen"
          ogrinfo -so -al /tmp/parzellen.gpkg 2>/dev/null \
            | grep -E 'Layer name|Feature Count|Geometry Column' | paste - - - \
            | grep -iE 'grundstueck|liegenschaft' || true

          # Ohne Parzellen ist alles Weitere sinnlos -- lieber hier
          # abbrechen als später mit halben Daten weiterrechnen.
          anzahl=$(ogrinfo -so /tmp/parzellen.gpkg grundstueck 2>/dev/null \
                   | grep -oP 'Feature Count: \K[0-9]+' | head -1)
          echo "Grundstücke: ${anzahl:-0}"
          if [ "${anzahl:-0}" -lt 50000 ]; then
            echo "Zu wenige Grundstücke -- erwartet werden über 100'000." >&2
            exit 1
          fi

      - name: Nutzungsplanung holen
        if: ${{ inputs.schritt != 'parzellen' }}
        env:
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail
          basis=https://geodienste.ch/downloads/interlis
          datei="npl_nutzungsplanung_v1_2_${KANTON}_lv95.zip"
          echo "Lade $datei"
          curl -sSL -o /tmp/npl.zip \
            "$basis/npl_nutzungsplanung/$KANTON/$datei"
          ls -lh /tmp/npl.zip
          mkdir -p /tmp/npl && unzip -o -q /tmp/npl.zip -d /tmp/npl
          echo "Inhalt:"
          find /tmp/npl -type f -printf '%p  %s Bytes\n' | head -20

      - name: Modell holen
        if: ${{ inputs.schritt != 'parzellen' }}
        run: |
          set -euo pipefail
          # GDAL braucht das Datenmodell, um die Klassen zu benennen.
          # Es liegt im offenen Modellverzeichnis des Bundes.
          curl -sSL -o /tmp/Nutzungsplanung_V1_2.ili \
            "https://models.geo.admin.ch/ARE/Nutzungsplanung_V1_2.ili" \
            || curl -sSL -o /tmp/Nutzungsplanung_V1_2.ili \
               "http://models.geo.admin.ch/ARE/Nutzungsplanung_V1_2.ili"
          wc -c /tmp/Nutzungsplanung_V1_2.ili

      - name: Nachsehen, was drinsteckt
        if: ${{ inputs.schritt != 'parzellen' }}
        run: |
          set -euo pipefail
          xtf=$(find /tmp/npl -name '*.xtf' | head -1)
          echo "Datei: $xtf"
          echo
          echo "### Klassen und Objektzahlen"
          # ogrinfo listet die Ebenen mit Geometrietyp und Anzahl.
          ogrinfo -so -al "$xtf,/tmp/Nutzungsplanung_V1_2.ili" 2>&1 \
            | grep -E 'Layer name|Feature Count|Geometry:|^[A-Za-z_]+: ' \
            | head -80

      - name: Zonen umwandeln
        if: ${{ inputs.schritt == 'zonen' || inputs.schritt == 'alles' }}
        run: |
          set -euo pipefail
          xtf=$(find /tmp/npl -name '*.xtf' | head -1)

          # Der Ebenenname trägt den vollen Pfad im Modell. Ein blosses
          # "Grundnutzung_Zonenflaeche" trifft nichts -- der erste Versuch
          # lieferte deshalb eine leere Datei von zwei Kilobyte, und das
          # angehängte "|| true" verschluckte den Fehler. Der Name wird
          # jetzt aus dem Dienst selbst geholt.
          ebene=$(ogrinfo -so "$xtf,/tmp/Nutzungsplanung_V1_2.ili" 2>/dev/null \
            | grep -o '[A-Za-z_0-9.]*Grundnutzung_Zonenflaeche' | head -1)
          echo "Ebene: ${ebene:-nicht gefunden}"
          if [ -z "$ebene" ]; then
            echo "Die Ebene mit den Zonen liess sich nicht finden." >&2
            exit 1
          fi

          # Nur die Grundnutzung: das sind die Zonen, in denen gebaut wird.
          # Überlagernde Festlegungen (Lärm, Gefahren) sind eine eigene
          # Frage und kämen später dazu.
          ogr2ogr -f GPKG /tmp/zonen.gpkg \
            "$xtf,/tmp/Nutzungsplanung_V1_2.ili" \
            -nln zonen "$ebene"

          ls -lh /tmp/zonen.gpkg
          # Ohne Zeilen ist die Umwandlung gescheitert, gleich was der
          # Rückgabewert sagt.
          n=$(ogrinfo -so -al /tmp/zonen.gpkg 2>/dev/null \
            | grep -oP 'Feature Count: \K[0-9]+' | head -1)
          echo "Zonenflächen: ${n:-0}"
          if [ "${n:-0}" -lt 1000 ]; then
            echo "Zu wenige Zonenflächen -- erwartet werden Zehntausende." >&2
            exit 1
          fi

      - name: Ergebnis bereitstellen
        if: ${{ inputs.schritt == 'zonen' || inputs.schritt == 'alles' }}
        uses: actions/upload-artifact@v4
        with:
          name: zonen-${{ inputs.kanton }}
          path: /tmp/zonen.gpkg
          if-no-files-found: warn

      - name: Parzellen bereitstellen
        if: ${{ inputs.schritt == 'parzellen' || inputs.schritt == 'alles' }}
        uses: actions/upload-artifact@v4
        with:
          name: parzellen-${{ inputs.kanton }}
          path: /tmp/parzellen.gpkg
          if-no-files-found: warn

      # Die Umwandlung dauert eine halbe Stunde und ändert sich nicht.
      # Für das Verschneiden allein lohnt es nicht, sie zu wiederholen --
      # die Dateien liegen als Artefakt des letzten Laufs bereit.
      - name: Dateien aus früherem Lauf holen
        if: ${{ inputs.schritt == 'verschneiden' }}
        uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ inputs.kanton }}'
          merge-multiple: true
          path: /tmp
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.quelllauf }}
          repository: ${{ github.repository }}

      - name: Verschneiden
        if: ${{ inputs.schritt == 'alles' || inputs.schritt == 'verschneiden' }}
        run: |
          set -euo pipefail

          # Die eigentliche Rechnung: welcher Anteil einer Parzelle liegt
          # in welcher Zone. Genau daran hängt alles Weitere -- eine
          # Parzelle kann zur Hälfte Wohnzone und zur Hälfte Wald sein,
          # und bebauen lässt sich nur der Zonenanteil. In Zürich wurde
          # das anfangs übersehen, mit dem Ergebnis von Margen in
          # Milliardenhöhe.
          #
          # Ausgegeben wird dieselbe Form, die die Zürcher Liste im
          # Klammerzusatz führt: Fläche und Prozentsatz je Zone.

          ls -lh /tmp/zonen.gpkg /tmp/parzellen.gpkg

          # Beide Quellen in eine Datei, damit sich darin rechnen lässt.
          # Die amtlichen Grenzen enthalten Kreisbögen; SpatiaLite kann
          # damit nicht rechnen. GDAL begradigt sie beim Kopieren zu
          # Linienzügen -- der Abweichung von wenigen Zentimetern steht
          # gegenüber, dass die Rechnung sonst gar nicht läuft.
          # Die Vermessungsdatei bleibt, wie sie ist -- ihre Schlüssel
          # (T_Id) gehen beim Kopieren sonst verloren. Dazu kommen die
          # Zonen und eine begradigte Fassung der Parzellenumrisse.
          cp /tmp/parzellen.gpkg /tmp/arbeit.gpkg
          ogr2ogr -f GPKG /tmp/arbeit.gpkg -append -nln zonen \
            /tmp/zonen.gpkg zonen
          ogr2ogr -f GPKG /tmp/arbeit.gpkg -append -nln flaechen \
            -nlt CONVERT_TO_LINEAR /tmp/arbeit.gpkg \
            -sql "SELECT liegenschaft_von, flaechenmass, geometrie
                  FROM liegenschaft"
          echo "### Ebenen in der Arbeitsdatei"
          ogrinfo -so -al /tmp/arbeit.gpkg 2>/dev/null \
            | grep -E 'Layer name|Feature Count' | paste - - \
            | grep -iE 'grundstueck|liegenschaft|zonen' || true

          # Die Spaltennamen stammen aus dem amtlichen Modell:
          #   grundstueck   nbident, nummer, egris_egrid, art,
          #                 gesamteflaechenmass
          #   liegenschaft  flaechenmass, liegenschaft_von -> grundstueck
          # Wie die Geometriespalte heisst, sagt die Datei selbst; darauf
          # zu raten hat diesen Ablauf schon zweimal Stunden gekostet.
          gsp=$(ogrinfo -so -al /tmp/arbeit.gpkg flaechen 2>/dev/null \
                | sed -n 's/^Geometry Column = //p' | head -1)
          gsz=$(ogrinfo -so -al /tmp/arbeit.gpkg zonen 2>/dev/null \
                | sed -n 's/^Geometry Column = //p' | head -1)
          gsp=${gsp:-geometrie}; gsz=${gsz:-geom}
          echo "Geometrie: flaechen.$gsp, zonen.$gsz"

          echo
          echo "### Verschneiden"
          ogr2ogr -f CSV /tmp/verschnitten.csv /tmp/arbeit.gpkg \
            -dialect sqlite -sql "
              SELECT
                g.egris_egrid                             AS egrid,
                g.nummer                                  AS parzelle,
                g.nbident                                 AS vermessungskreis,
                g.art                                     AS art,
                l.flaechenmass                            AS flaeche_m2,
                z.Typ                                     AS zone_typ,
                ROUND(ST_Area(ST_Intersection(
                  l.$gsp, z.$gsz)))       AS zone_m2,
                ROUND(100.0 * ST_Area(ST_Intersection(
                        l.$gsp, z.$gsz))
                      / NULLIF(l.flaechenmass, 0))        AS anteil_prozent
              FROM flaechen l
              JOIN grundstueck g ON g.T_Id = l.liegenschaft_von
              JOIN zonen z ON ST_Intersects(l.$gsp, z.$gsz)
              WHERE ST_Area(ST_Intersection(
                      l.$gsp, z.$gsz)) > 5
            " || { echo "Verschneiden fehlgeschlagen"; exit 1; }

          zeilen=$(( $(wc -l < /tmp/verschnitten.csv) - 1 ))
          echo "Zeilen: $zeilen"
          if [ "$zeilen" -lt 1000 ]; then
            echo "Zu wenige Zeilen -- erwartet werden Zehntausende." >&2
            head -5 /tmp/verschnitten.csv
            exit 1
          fi
          head -5 /tmp/verschnitten.csv

      - name: Verschnitt bereitstellen
        if: ${{ inputs.schritt == 'alles' || inputs.schritt == 'verschneiden' }}
        uses: actions/upload-artifact@v4
        with:
          name: verschnitten-${{ inputs.kanton }}
          path: /tmp/verschnitten.csv
          if-no-files-found: warn

      # ---------------------------------------------------------------
      # Warum das Modell nicht greift
      # ---------------------------------------------------------------
      # Die Parzellen kommen als Field01..Field09 an und die Umrisse
      # fehlen ganz. Beides hat dieselbe Ursache: GDAL wendet das
      # INTERLIS-Modell nicht an. Ohne Modell kennt es weder die
      # Attributnamen noch weiss es, dass die Linien in der Ebene
      # "_Geometrie" zu Flächen der Ebene "Liegenschaft" gehören.
      #
      # Die Meldung dazu stand die ganze Zeit auf der Fehlerausgabe --
      # die ich beim Umwandeln nach /dev/null geschickt hatte. Hier
      # bleibt sie sichtbar.
      - name: Modell prüfen
        if: ${{ inputs.schritt == 'modell' }}
        env:
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail
          basis=https://geodienste.ch/downloads/interlis
          curl -sSL -o /tmp/av.zip "$basis/av/$KANTON/av_${KANTON}_lv95.zip"
          mkdir -p /tmp/av && unzip -o -q /tmp/av.zip -d /tmp/av

          # Die kleinste Gemeinde reicht für den Versuch.
          erste=$(find /tmp/av -name '*.itf' -printf '%s %p\n' \
                  | sort -n | head -1 | cut -d' ' -f2)
          echo "Probe: $erste"
          mitgeliefert=$(find /tmp/av -name '*.ili' | head -1)
          echo "Mitgeliefertes Modell: $mitgeliefert"
          echo

          curl -sSL -o /tmp/vom-bund.ili \
            "https://models.geo.admin.ch/V_D/DM01AVCH24LV95D.ili" || true
          echo "Vom Bund: $(wc -c < /tmp/vom-bund.ili 2>/dev/null || echo 0) Bytes"
          echo

          echo "### Kopf der Datei -- welches Modell sie verlangt"
          head -8 "$erste"
          echo

          for m in "$mitgeliefert" /tmp/vom-bund.ili; do
            [ -s "$m" ] || continue
            echo "=============== $m"
            for e in Liegenschaften__Grundstueck Liegenschaften__Liegenschaft \
                     Liegenschaften__Liegenschaft_Geometrie; do
              echo "--- $e"
              # Die Warnungen betreffen die Fixpunkt-Tabellen, die uns
              # nicht interessieren, und verdecken sonst die Antwort.
              ogrinfo -so "$erste,$m" "$e" 2>&1 \
                | grep -v '^Warning 1: No ' | head -20
              echo
            done
          done

      # ---------------------------------------------------------------
      # Gibt es die Vermessung auch fertig?
      # ---------------------------------------------------------------
      # INTERLIS 1 bringt die Attributnamen nur mit passendem Modell,
      # und beide amtlichen Modelle greifen hier nicht: die Felder
      # heissen Field01..Field09, die Umrisse liegen als lose Linien in
      # einer eigenen Ebene. Das liesse sich mit genug Aufwand von Hand
      # zusammensetzen -- aber nur, wenn es keinen fertigen Weg gibt.
      #
      # geodienste.ch liefert manche Themen zusätzlich als GeoPackage
      # oder Shapefile. Dort sind Namen und Flächen bereits gebildet.
      # Dieser Schritt sieht nach, was es gibt, statt es zu vermuten.
      - name: Formate prüfen
        if: ${{ inputs.schritt == 'formate' }}
        env:
          KANTON: ${{ inputs.kanton }}
        run: |
          set -uo pipefail
          basis=https://geodienste.ch/downloads
          for ordner in gpkg shp shape dxf interlis; do
            for datei in \
              "av/$KANTON/av_${KANTON}_lv95.zip" \
              "av/$KANTON/av_${KANTON}_lv95.gpkg" \
              "av/av_${KANTON}_lv95.zip"; do
              url="$basis/$ordner/$datei"
              code=$(curl -sS -o /dev/null -w '%{http_code} %{size_download}' \
                     -r 0-0 "$url" 2>/dev/null || echo "---")
              echo "$code  $url"
            done
          done

          echo
          echo "### Was der Dienst selbst über die Formate sagt"
          curl -sS "https://geodienste.ch/services/av" \
            -H 'Accept: application/json' 2>/dev/null | head -c 2000
          echo

      # ---------------------------------------------------------------
      # Der amtliche Weg
      # ---------------------------------------------------------------
      # geodienste liefert die Vermessung ausschliesslich als INTERLIS 1
      # (alle anderen Formate: 404). GDAL kommt damit nur halb zurecht --
      # es kennt die Attributnamen nicht und bildet aus den Grenzlinien
      # keine Flächen.
      #
      # Für genau diese Aufgabe gibt es ili2gpkg aus der offiziellen
      # INTERLIS-Werkzeugkette: es liest das Modell, benennt die Spalten
      # wie im Modell und setzt die Grenzlinien zu Flächen zusammen.
      # Erst damit ergibt "Fläche der Parzelle" überhaupt einen Wert.
      - name: Mit ili2gpkg umwandeln
        if: ${{ inputs.schritt == 'ili2gpkg' }}
        env:
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail
          java -version 2>&1 | head -2

          curl -sSL -o /tmp/ili2gpkg.zip \
            "https://downloads.interlis.ch/ili2gpkg/ili2gpkg-5.1.1.zip"
          ls -lh /tmp/ili2gpkg.zip
          unzip -o -q /tmp/ili2gpkg.zip -d /tmp/ili2gpkg
          jar=$(find /tmp/ili2gpkg -name 'ili2gpkg*.jar' | head -1)
          echo "Werkzeug: $jar"

          basis=https://geodienste.ch/downloads/interlis
          curl -sSL -o /tmp/av.zip "$basis/av/$KANTON/av_${KANTON}_lv95.zip"
          mkdir -p /tmp/av && unzip -o -q /tmp/av.zip -d /tmp/av

          # Erst an der kleinsten Gemeinde -- wenn das trägt, folgt der Rest.
          erste=$(find /tmp/av -name '*.itf' -printf '%s %p\n' \
                  | sort -n | head -1 | cut -d' ' -f2)
          echo "Probe: $erste"

          rm -f /tmp/probe.gpkg
          # INTERLIS 1 schreibt das Koordinatensystem nicht in die Datei;
          # ohne Angabe bricht das Werkzeug ab. 2056 ist LV95, das
          # Schweizer Bezugssystem seit 2016.
          # In einem Zug schlug der Import fehl, weil eine Tabelle noch
          # nicht bestand. Erst das Gerüst anlegen, dann füllen -- der
          # vom Werkzeug vorgesehene Weg.
          modelldir="/tmp/av;http://models.interlis.ch/;https://models.geo.admin.ch/"
          java -jar "$jar" --dbfile /tmp/probe.gpkg \
            --modeldir "$modelldir" --defaultSrsCode 2056 \
            --models DM01AVCH24LV95D \
            --schemaimport > /tmp/schema.log 2>&1 || true
          grep -iE 'error|failed' /tmp/schema.log | head -10 \
            || echo "(Gerüst ohne Fehler)"
          tail -2 /tmp/schema.log

          echo
          java -jar "$jar" --dbfile /tmp/probe.gpkg \
            --modeldir "$modelldir" --defaultSrsCode 2056 \
            --disableValidation \
            --import "$erste" > /tmp/ili2gpkg.log 2>&1 || true

          # Die Meldungen zwischen tausend Zeilen "Info: validate ..."
          # herauszufischen ist der halbe Erfolg.
          grep -iE 'error|fehler|failed|warning' /tmp/ili2gpkg.log \
            | head -20 || echo "(keine Fehlermeldungen)"
          tail -3 /tmp/ili2gpkg.log

          echo
          ls -lh /tmp/probe.gpkg || { echo "Keine Ausgabe entstanden."; exit 1; }
          echo "### Ebenen mit Flächen"
          ogrinfo -so -al /tmp/probe.gpkg 2>/dev/null \
            | grep -E 'Layer name|Feature Count|Geometry:' | paste - - - \
            | grep -i 'liegenschaft\|grundstueck' || true

          # Das Werkzeug benennt die Ebenen nach dem Modell, klein
          # geschrieben und ohne Themenpräfix: grundstueck, liegenschaft.
          for e in grundstueck liegenschaft; do
            echo
            echo "### Spalten von $e"
            ogrinfo -so /tmp/probe.gpkg "$e" 2>&1 | sed -n '/^[a-z_]*:/p'
            echo "--- Probe"
            ogr2ogr -f CSV /vsistdout/ /tmp/probe.gpkg "$e" \
              -limit 3 -lco GEOMETRY=NO 2>/dev/null || true
          done
