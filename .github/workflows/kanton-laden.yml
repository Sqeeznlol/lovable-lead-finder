# =====================================================================
# Kanton laden
# =====================================================================
# Holt die amtlichen Geodaten eines Kantons und macht daraus Zeilen für
# die Master-Liste: je Parzelle die Zone, ihr Flächenanteil und die
# Angaben, die für die Potenzialrechnung nötig sind.
#
# Warum dieser Weg: Die Zonen stehen im Kartendienst des Kantons nur als
# Bild. Aus Farben lassen sich weder Zonentyp noch Flächenanteil
# zurückrechnen, und die EGRID -- ohne die sich nichts mit dem übrigen
# Bestand verknüpfen lässt -- steht dort gar nicht. Die Kantone stellen
# dieselben Daten über geodienste.ch als Datei bereit, frei und ohne
# Anmeldung. Belegt am 5. September: Nutzungsplanung TG 41.5 MB,
# Amtliche Vermessung TG 159.5 MB, beide HTTP 200 ohne Zugangsdaten.
#
# INTERLIS ist das amtliche Schweizer Format. Es von Hand zu lesen wäre
# fehleranfällig -- besonders die Kreisbögen in den Grundstücksgrenzen.
# Deshalb übernimmt GDAL die Umwandlung, das den Standard kennt.
# =====================================================================

name: Kanton laden

on:
  workflow_dispatch:
    inputs:
      kanton:
        description: 'Kantonskürzel, z.B. TG'
        required: true
        default: 'TG'
      quelllauf:
        description: 'Nur für "verschneiden": Nummer des Laufs mit den fertigen Dateien'
        required: false
        default: ''
      schritt:
        description: 'Was ausgeführt werden soll'
        required: true
        default: 'pruefen'
        type: choice
        options:
          - pruefen      # Nur nachsehen, was in den Dateien steckt
          - zonen        # Zonen umwandeln und als Datei bereitstellen
          - parzellen    # Amtliche Vermessung ansehen und umwandeln
          - alles        # Zonen und Parzellen laden, verschneiden, ausgeben
          - verschneiden # Fertige Dateien aus einem früheren Lauf verschneiden
          - modell       # Warum das Vermessungsmodell nicht greift
          - formate      # Welche Dateiformate geodienste anbietet
          - ili2gpkg     # Umwandlung mit dem amtlichen INTERLIS-Werkzeug
          - zonentypen   # Nur die Zonennamen aus der Datei lesen
          - einspielen   # Verschnitt in die Datenbank (Probelauf)
          - einspielen-schreiben   # dasselbe, aber tatsächlich schreiben
          - gwr          # Gebäuderegister ansehen: Adressen, Baujahr, Geschosse
          - gwr-probe    # Register laden und zeigen, was sich verbinden liesse
          - gwr-schreiben          # Adressen und Gebäudedaten übernehmen
          - zonennamen   # Schlüssel durch Zonennamen ersetzen (Probelauf)
          - zonennamen-schreiben   # dasselbe, aber tatsächlich schreiben

jobs:
  laden:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge einrichten
        run: |
          sudo apt-get update -qq
          # GDAL kennt INTERLIS und rechnet die Kreisbögen der Grenzen
          # korrekt in Linienzüge um.
          # SpatiaLite bringt die Flächenrechnung mit, die für das
          # Verschneiden nötig ist.
          sudo apt-get install -y -qq gdal-bin python3-gdal unzip \
            libsqlite3-mod-spatialite

      - name: Amtliche Vermessung umwandeln
        if: ${{ inputs.schritt == 'parzellen' || inputs.schritt == 'alles' }}
        env:
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail

          # Warum nicht GDAL: es liest die Datei zwar, kennt aber die
          # Attributnamen nicht (Field01..Field09) und lässt die Grenzen
          # als lose Linien liegen -- ohne Flächen ist die Rechnung
          # wertlos. ili2gpkg aus der amtlichen INTERLIS-Werkzeugkette
          # benennt die Spalten nach dem Modell und setzt die Grenzen zu
          # Flächen zusammen.
          curl -sSL -o /tmp/ili2gpkg.zip \
            "https://downloads.interlis.ch/ili2gpkg/ili2gpkg-5.1.1.zip"
          unzip -o -q /tmp/ili2gpkg.zip -d /tmp/ili2gpkg
          jar=$(find /tmp/ili2gpkg -name 'ili2gpkg*.jar' | head -1)

          # 159 MB für Thurgau; das Herunterladen dauert.
          basis=https://geodienste.ch/downloads/interlis
          curl -sSL -o /tmp/av.zip "$basis/av/$KANTON/av_${KANTON}_lv95.zip"
          ls -lh /tmp/av.zip
          mkdir -p /tmp/av && unzip -o -q /tmp/av.zip -d /tmp/av
          echo "Gemeindedateien: $(find /tmp/av -name '*.itf' | wc -l)"

          modelldir="/tmp/av;http://models.interlis.ch/;https://models.geo.admin.ch/"
          rm -f /tmp/parzellen.gpkg

          # Erst das Gerüst -- in einem Zug mit dem Einlesen scheitert es
          # an einer noch fehlenden Tabelle.  LV95 (2056) muss angegeben
          # werden, weil INTERLIS 1 das Bezugssystem nicht mitschreibt.
          java -jar "$jar" --dbfile /tmp/parzellen.gpkg \
            --modeldir "$modelldir" --defaultSrsCode 2056 \
            --models DM01AVCH24LV95D --schemaimport > /tmp/schema.log 2>&1 \
            || { tail -20 /tmp/schema.log; exit 1; }

          n=0; fehler=0
          for f in /tmp/av/*.itf; do
            n=$((n + 1))
            java -jar "$jar" --dbfile /tmp/parzellen.gpkg \
              --modeldir "$modelldir" --defaultSrsCode 2056 \
              --disableValidation --import "$f" > /tmp/import.log 2>&1 \
              || { fehler=$((fehler + 1)); echo "  fehlgeschlagen: $(basename "$f")"
                   grep -iE 'error' /tmp/import.log | head -3 || true; }
            [ $((n % 20)) -eq 0 ] && echo "  $n Gemeinden ..."
          done
          echo "$n Gemeinden verarbeitet, $fehler fehlgeschlagen."

          ls -lh /tmp/parzellen.gpkg
          echo "### Ebenen"
          ogrinfo -so -al /tmp/parzellen.gpkg 2>/dev/null \
            | grep -E 'Layer name|Feature Count|Geometry Column' | paste - - - \
            | grep -iE 'grundstueck|liegenschaft' || true

          # Ohne Parzellen ist alles Weitere sinnlos -- lieber hier
          # abbrechen als später mit halben Daten weiterrechnen.
          anzahl=$(ogrinfo -so /tmp/parzellen.gpkg grundstueck 2>/dev/null \
                   | grep -oP 'Feature Count: \K[0-9]+' | head -1)
          echo "Grundstücke: ${anzahl:-0}"
          if [ "${anzahl:-0}" -lt 50000 ]; then
            echo "Zu wenige Grundstücke -- erwartet werden über 100'000." >&2
            exit 1
          fi

      - name: Nutzungsplanung holen
        if: ${{ inputs.schritt != 'parzellen' }}
        env:
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail
          basis=https://geodienste.ch/downloads/interlis
          datei="npl_nutzungsplanung_v1_2_${KANTON}_lv95.zip"
          echo "Lade $datei"
          curl -sSL -o /tmp/npl.zip \
            "$basis/npl_nutzungsplanung/$KANTON/$datei"
          ls -lh /tmp/npl.zip
          mkdir -p /tmp/npl && unzip -o -q /tmp/npl.zip -d /tmp/npl
          echo "Inhalt:"
          find /tmp/npl -type f -printf '%p  %s Bytes\n' | head -20

      - name: Modell holen
        if: ${{ inputs.schritt != 'parzellen' }}
        run: |
          set -euo pipefail
          # GDAL braucht das Datenmodell, um die Klassen zu benennen.
          # Es liegt im offenen Modellverzeichnis des Bundes.
          curl -sSL -o /tmp/Nutzungsplanung_V1_2.ili \
            "https://models.geo.admin.ch/ARE/Nutzungsplanung_V1_2.ili" \
            || curl -sSL -o /tmp/Nutzungsplanung_V1_2.ili \
               "http://models.geo.admin.ch/ARE/Nutzungsplanung_V1_2.ili"
          wc -c /tmp/Nutzungsplanung_V1_2.ili

      - name: Nachsehen, was drinsteckt
        if: ${{ inputs.schritt != 'parzellen' }}
        run: |
          set -euo pipefail
          xtf=$(find /tmp/npl -name '*.xtf' | head -1)
          echo "Datei: $xtf"
          echo
          echo "### Klassen und Objektzahlen"
          # ogrinfo listet die Ebenen mit Geometrietyp und Anzahl.
          ogrinfo -so -al "$xtf,/tmp/Nutzungsplanung_V1_2.ili" 2>&1 \
            | grep -E 'Layer name|Feature Count|Geometry:|^[A-Za-z_]+: ' \
            | head -80

      - name: Zonen umwandeln
        if: ${{ inputs.schritt == 'zonen' || inputs.schritt == 'alles'
                || inputs.schritt == 'verschneiden' }}
        run: |
          set -euo pipefail

          # Zwei Wege wurden gebraucht, weil jeder für sich zu wenig
          # liefert:
          #
          #   GDAL bringt die Zonenflächen mit Umriss, aber in der Fläche
          #   steht nur ein Schlüssel wie "x4401_221_gngde". Die
          #   Typentabelle mit "W2" faltet GDAL in dieselbe Ebene und
          #   verwirft dabei ihre Spalten.
          #
          #   ili2gpkg liest die Typentabelle richtig, brach aber ab: die
          #   Typen verweisen auf einen Katalog des Bundes, der nicht in
          #   derselben Datei steht. "--skipReferenceErrors" lässt diese
          #   Verweise offen -- gebraucht werden Bezeichnung und
          #   Abkürzung, nicht der Katalogeintrag.
          #
          # Also: Umrisse von GDAL, Namen von ili2gpkg.

          xtf=$(find /tmp/npl -name '*.xtf' | head -1)
          ebene=$(ogrinfo -so "$xtf,/tmp/Nutzungsplanung_V1_2.ili" 2>/dev/null \
            | grep -o '[A-Za-z_0-9.]*Grundnutzung_Zonenflaeche' | head -1)
          echo "Ebene: ${ebene:-nicht gefunden}"
          if [ -z "$ebene" ]; then
            echo "Die Ebene mit den Zonen liess sich nicht finden." >&2
            exit 1
          fi

          ogr2ogr -f GPKG /tmp/zonen.gpkg \
            "$xtf,/tmp/Nutzungsplanung_V1_2.ili" \
            -nln zonen "$ebene"

          ls -lh /tmp/zonen.gpkg
          n=$(ogrinfo -so -al /tmp/zonen.gpkg 2>/dev/null \
            | grep -oP 'Feature Count: \K[0-9]+' | head -1)
          echo "Zonenflächen: ${n:-0}"
          if [ "${n:-0}" -lt 1000 ]; then
            echo "Zu wenige Zonenflächen -- erwartet werden Zehntausende." >&2
            exit 1
          fi

          echo
          echo "### Zonennamen holen"
          # Nicht mit einem Werkzeug: GDAL verwirft die Spalten der
          # Typentabelle, ili2gpkg bricht am Katalog des Bundes ab. Eine
          # XTF-Datei ist XML -- die Tabelle wird direkt gelesen.
          # Ohne Namen ist die Liste schlechter, aber nicht wertlos --
          # der Lauf darf daran nicht scheitern.
          python3 tools/zonentypen.py "$xtf" /tmp/zonentypen.csv || true
          head -4 /tmp/zonentypen.csv

      - name: Ergebnis bereitstellen
        if: ${{ inputs.schritt == 'zonen' || inputs.schritt == 'alles' }}
        uses: actions/upload-artifact@v4
        with:
          name: zonen-${{ inputs.kanton }}
          path: /tmp/zonen.gpkg
          if-no-files-found: warn

      - name: Parzellen bereitstellen
        if: ${{ inputs.schritt == 'parzellen' || inputs.schritt == 'alles' }}
        uses: actions/upload-artifact@v4
        with:
          name: parzellen-${{ inputs.kanton }}
          path: /tmp/parzellen.gpkg
          if-no-files-found: warn

      # Die Umwandlung dauert eine halbe Stunde und ändert sich nicht.
      # Für das Verschneiden allein lohnt es nicht, sie zu wiederholen --
      # die Dateien liegen als Artefakt des letzten Laufs bereit.
      - name: Dateien aus früherem Lauf holen
        if: ${{ inputs.schritt == 'verschneiden' }}
        uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ inputs.kanton }}'
          merge-multiple: true
          path: /tmp
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.quelllauf }}
          repository: ${{ github.repository }}

      - name: Verschneiden
        if: ${{ inputs.schritt == 'alles' || inputs.schritt == 'verschneiden' }}
        run: |
          set -euo pipefail

          # Die eigentliche Rechnung: welcher Anteil einer Parzelle liegt
          # in welcher Zone. Genau daran hängt alles Weitere -- eine
          # Parzelle kann zur Hälfte Wohnzone und zur Hälfte Wald sein,
          # und bebauen lässt sich nur der Zonenanteil. In Zürich wurde
          # das anfangs übersehen, mit dem Ergebnis von Margen in
          # Milliardenhöhe.
          #
          # Ausgegeben wird dieselbe Form, die die Zürcher Liste im
          # Klammerzusatz führt: Fläche und Prozentsatz je Zone.

          ls -lh /tmp/zonen.gpkg /tmp/parzellen.gpkg

          # Beide Quellen in eine Datei, damit sich darin rechnen lässt.
          # Grundstück und Fläche gehören zusammen -- die Nummer und die
          # EGRID stehen am Grundstück, der Umriss an der Fläche. Beides
          # wird gleich hier verbunden, solange der Schlüssel T_Id noch
          # eine gewöhnliche Spalte ist; beim Kopieren gilt er als interne
          # Satznummer und ginge verloren.
          #
          # Die amtlichen Grenzen enthalten Kreisbögen, mit denen
          # SpatiaLite nicht rechnen kann; GDAL begradigt sie dabei.
          cp /tmp/parzellen.gpkg /tmp/arbeit.gpkg
          ogr2ogr -f GPKG /tmp/arbeit.gpkg -append -nln parzellen \
            -nlt CONVERT_TO_LINEAR /tmp/arbeit.gpkg \
            -dialect sqlite -sql "
              SELECT g.egris_egrid, g.nummer, g.nbident, g.art,
                     l.flaechenmass, l.geometrie
              FROM liegenschaft l
              JOIN grundstueck g ON g.T_Id = l.liegenschaft_von"

          ogr2ogr -f GPKG /tmp/arbeit.gpkg -append -nln zonen \
            /tmp/zonen.gpkg zonen
          if [ -s /tmp/zonentypen.csv ]; then
            ogr2ogr -f GPKG /tmp/arbeit.gpkg -append -nln zonentyp \
              /tmp/zonentypen.csv
          fi

          # Ohne räumlichen Index vergleicht die Datenbank jede der
          # 140'000 Parzellen mit jeder der 57'000 Zonen -- acht
          # Milliarden Vergleiche, die nie fertig werden. Ein erster
          # Versuch lief eine halbe Stunde ohne eine einzige Zeile.
          # SpatiaLite bringt dafür die Tabelle "SpatialIndex" mit, die
          # zuerst grob nach Rechtecken vorsortiert; erst die wenigen
          # Übriggebliebenen werden genau gerechnet.
          echo "### In eine SpatiaLite-Datenbank umziehen"
          rm -f /tmp/arbeit.sqlite
          for e in parzellen zonen; do
            ogr2ogr -f SQLite /tmp/arbeit.sqlite -append \
              -dsco SPATIALITE=YES -lco SPATIAL_INDEX=YES \
              -nln "$e" /tmp/arbeit.gpkg "$e"
          done

          # Die Typentabelle hat keine Geometrie und kommt ohne Index
          # dazu -- sie liefert nur den Namen zum Schlüssel.
          namen_wahl=""
          namen_join=""
          if ogrinfo -so /tmp/arbeit.gpkg zonentyp > /dev/null 2>&1; then
            ogr2ogr -f SQLite /tmp/arbeit.sqlite -append \
              -dsco SPATIALITE=YES -nln zonentyp /tmp/arbeit.gpkg zonentyp
            namen_wahl="t.bezeichnung AS zone_name, t.abkuerzung AS zone_kurz,"
            namen_join="LEFT JOIN zonentyp t ON t.typ_id = z.typ"
          fi
          echo "Zonennamen: ${namen_wahl:-keine}"

          echo "### Was in der Arbeitsdatenbank steht"
          for e in parzellen zonen; do
            echo "-- $e"
            ogrinfo -so /tmp/arbeit.sqlite "$e" 2>/dev/null \
              | sed -n '/^Feature Count/p;/^[A-Za-z_0-9]*: /p'
          done

          # SpatiaLite führt selbst Buch darüber, wie die Geometriespalte
          # jeder Tabelle heisst. Diese Tabelle zu fragen ist verlässlich;
          # aus der Textausgabe von ogrinfo zu lesen war es nicht.
          spalte() {
            ogrinfo -q /tmp/arbeit.sqlite -sql \
              "SELECT f_geometry_column FROM geometry_columns
               WHERE f_table_name = '$1'" 2>/dev/null \
              | sed -n 's/.*= //p' | head -1
          }
          gsp=$(spalte parzellen)
          gsz=$(spalte zonen)
          echo "Geometrie: parzellen.${gsp:?} zonen.${gsz:?}"

          echo
          echo "### Verschneiden"
          ogr2ogr -f CSV /tmp/verschnitten.csv /tmp/arbeit.sqlite \
            -dialect sqlite -sql "
              SELECT
                g.egris_egrid                          AS egrid,
                g.nummer                               AS parzelle,
                g.nbident                              AS vermessungskreis,
                g.art                                  AS art,
                g.flaechenmass                         AS flaeche_m2,
                z.Typ                                  AS zone_typ,
                $namen_wahl
                ROUND(ST_Area(ST_Intersection(g.$gsp, z.$gsz)))
                                                       AS zone_m2,
                ROUND(100.0 * ST_Area(ST_Intersection(g.$gsp, z.$gsz))
                      / NULLIF(g.flaechenmass, 0))     AS anteil_prozent
              FROM parzellen g
              JOIN zonen z
              $namen_join
              WHERE z.ROWID IN (
                      SELECT ROWID FROM SpatialIndex
                      WHERE f_table_name = 'zonen'
                        AND search_frame = g.$gsp)
                AND ST_Intersects(g.$gsp, z.$gsz)
                AND ST_Area(ST_Intersection(g.$gsp, z.$gsz)) > 5
            " || { echo "Verschneiden fehlgeschlagen"; exit 1; }

          zeilen=$(( $(wc -l < /tmp/verschnitten.csv) - 1 ))
          echo "Zeilen: $zeilen"
          if [ "$zeilen" -lt 1000 ]; then
            echo "Zu wenige Zeilen -- erwartet werden Zehntausende." >&2
            head -5 /tmp/verschnitten.csv
            exit 1
          fi
          head -5 /tmp/verschnitten.csv

      - name: Verschnitt bereitstellen
        if: ${{ inputs.schritt == 'alles' || inputs.schritt == 'verschneiden' }}
        uses: actions/upload-artifact@v4
        with:
          name: verschnitten-${{ inputs.kanton }}
          path: /tmp/verschnitten.csv
          if-no-files-found: warn

      # ---------------------------------------------------------------
      # Warum das Modell nicht greift
      # ---------------------------------------------------------------
      # Die Parzellen kommen als Field01..Field09 an und die Umrisse
      # fehlen ganz. Beides hat dieselbe Ursache: GDAL wendet das
      # INTERLIS-Modell nicht an. Ohne Modell kennt es weder die
      # Attributnamen noch weiss es, dass die Linien in der Ebene
      # "_Geometrie" zu Flächen der Ebene "Liegenschaft" gehören.
      #
      # Die Meldung dazu stand die ganze Zeit auf der Fehlerausgabe --
      # die ich beim Umwandeln nach /dev/null geschickt hatte. Hier
      # bleibt sie sichtbar.
      - name: Modell prüfen
        if: ${{ inputs.schritt == 'modell' }}
        env:
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail
          basis=https://geodienste.ch/downloads/interlis
          curl -sSL -o /tmp/av.zip "$basis/av/$KANTON/av_${KANTON}_lv95.zip"
          mkdir -p /tmp/av && unzip -o -q /tmp/av.zip -d /tmp/av

          # Die kleinste Gemeinde reicht für den Versuch.
          erste=$(find /tmp/av -name '*.itf' -printf '%s %p\n' \
                  | sort -n | head -1 | cut -d' ' -f2)
          echo "Probe: $erste"
          mitgeliefert=$(find /tmp/av -name '*.ili' | head -1)
          echo "Mitgeliefertes Modell: $mitgeliefert"
          echo

          curl -sSL -o /tmp/vom-bund.ili \
            "https://models.geo.admin.ch/V_D/DM01AVCH24LV95D.ili" || true
          echo "Vom Bund: $(wc -c < /tmp/vom-bund.ili 2>/dev/null || echo 0) Bytes"
          echo

          echo "### Kopf der Datei -- welches Modell sie verlangt"
          head -8 "$erste"
          echo

          for m in "$mitgeliefert" /tmp/vom-bund.ili; do
            [ -s "$m" ] || continue
            echo "=============== $m"
            for e in Liegenschaften__Grundstueck Liegenschaften__Liegenschaft \
                     Liegenschaften__Liegenschaft_Geometrie; do
              echo "--- $e"
              # Die Warnungen betreffen die Fixpunkt-Tabellen, die uns
              # nicht interessieren, und verdecken sonst die Antwort.
              ogrinfo -so "$erste,$m" "$e" 2>&1 \
                | grep -v '^Warning 1: No ' | head -20
              echo
            done
          done

      # ---------------------------------------------------------------
      # Gibt es die Vermessung auch fertig?
      # ---------------------------------------------------------------
      # INTERLIS 1 bringt die Attributnamen nur mit passendem Modell,
      # und beide amtlichen Modelle greifen hier nicht: die Felder
      # heissen Field01..Field09, die Umrisse liegen als lose Linien in
      # einer eigenen Ebene. Das liesse sich mit genug Aufwand von Hand
      # zusammensetzen -- aber nur, wenn es keinen fertigen Weg gibt.
      #
      # geodienste.ch liefert manche Themen zusätzlich als GeoPackage
      # oder Shapefile. Dort sind Namen und Flächen bereits gebildet.
      # Dieser Schritt sieht nach, was es gibt, statt es zu vermuten.
      - name: Formate prüfen
        if: ${{ inputs.schritt == 'formate' }}
        env:
          KANTON: ${{ inputs.kanton }}
        run: |
          set -uo pipefail
          basis=https://geodienste.ch/downloads
          for ordner in gpkg shp shape dxf interlis; do
            for datei in \
              "av/$KANTON/av_${KANTON}_lv95.zip" \
              "av/$KANTON/av_${KANTON}_lv95.gpkg" \
              "av/av_${KANTON}_lv95.zip"; do
              url="$basis/$ordner/$datei"
              code=$(curl -sS -o /dev/null -w '%{http_code} %{size_download}' \
                     -r 0-0 "$url" 2>/dev/null || echo "---")
              echo "$code  $url"
            done
          done

          echo
          echo "### Was der Dienst selbst über die Formate sagt"
          curl -sS "https://geodienste.ch/services/av" \
            -H 'Accept: application/json' 2>/dev/null | head -c 2000
          echo

      # ---------------------------------------------------------------
      # Der amtliche Weg
      # ---------------------------------------------------------------
      # geodienste liefert die Vermessung ausschliesslich als INTERLIS 1
      # (alle anderen Formate: 404). GDAL kommt damit nur halb zurecht --
      # es kennt die Attributnamen nicht und bildet aus den Grenzlinien
      # keine Flächen.
      #
      # Für genau diese Aufgabe gibt es ili2gpkg aus der offiziellen
      # INTERLIS-Werkzeugkette: es liest das Modell, benennt die Spalten
      # wie im Modell und setzt die Grenzlinien zu Flächen zusammen.
      # Erst damit ergibt "Fläche der Parzelle" überhaupt einen Wert.
      - name: Mit ili2gpkg umwandeln
        if: ${{ inputs.schritt == 'ili2gpkg' }}
        env:
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail
          java -version 2>&1 | head -2

          curl -sSL -o /tmp/ili2gpkg.zip \
            "https://downloads.interlis.ch/ili2gpkg/ili2gpkg-5.1.1.zip"
          ls -lh /tmp/ili2gpkg.zip
          unzip -o -q /tmp/ili2gpkg.zip -d /tmp/ili2gpkg
          jar=$(find /tmp/ili2gpkg -name 'ili2gpkg*.jar' | head -1)
          echo "Werkzeug: $jar"

          basis=https://geodienste.ch/downloads/interlis
          curl -sSL -o /tmp/av.zip "$basis/av/$KANTON/av_${KANTON}_lv95.zip"
          mkdir -p /tmp/av && unzip -o -q /tmp/av.zip -d /tmp/av

          # Erst an der kleinsten Gemeinde -- wenn das trägt, folgt der Rest.
          erste=$(find /tmp/av -name '*.itf' -printf '%s %p\n' \
                  | sort -n | head -1 | cut -d' ' -f2)
          echo "Probe: $erste"

          rm -f /tmp/probe.gpkg
          # INTERLIS 1 schreibt das Koordinatensystem nicht in die Datei;
          # ohne Angabe bricht das Werkzeug ab. 2056 ist LV95, das
          # Schweizer Bezugssystem seit 2016.
          # In einem Zug schlug der Import fehl, weil eine Tabelle noch
          # nicht bestand. Erst das Gerüst anlegen, dann füllen -- der
          # vom Werkzeug vorgesehene Weg.
          modelldir="/tmp/av;http://models.interlis.ch/;https://models.geo.admin.ch/"
          java -jar "$jar" --dbfile /tmp/probe.gpkg \
            --modeldir "$modelldir" --defaultSrsCode 2056 \
            --models DM01AVCH24LV95D \
            --schemaimport > /tmp/schema.log 2>&1 || true
          grep -iE 'error|failed' /tmp/schema.log | head -10 \
            || echo "(Gerüst ohne Fehler)"
          tail -2 /tmp/schema.log

          echo
          java -jar "$jar" --dbfile /tmp/probe.gpkg \
            --modeldir "$modelldir" --defaultSrsCode 2056 \
            --disableValidation \
            --import "$erste" > /tmp/ili2gpkg.log 2>&1 || true

          # Die Meldungen zwischen tausend Zeilen "Info: validate ..."
          # herauszufischen ist der halbe Erfolg.
          grep -iE 'error|fehler|failed|warning' /tmp/ili2gpkg.log \
            | head -20 || echo "(keine Fehlermeldungen)"
          tail -3 /tmp/ili2gpkg.log

          echo
          ls -lh /tmp/probe.gpkg || { echo "Keine Ausgabe entstanden."; exit 1; }
          echo "### Ebenen mit Flächen"
          ogrinfo -so -al /tmp/probe.gpkg 2>/dev/null \
            | grep -E 'Layer name|Feature Count|Geometry:' | paste - - - \
            | grep -i 'liegenschaft\|grundstueck' || true

          # Das Werkzeug benennt die Ebenen nach dem Modell, klein
          # geschrieben und ohne Themenpräfix: grundstueck, liegenschaft.
          for e in grundstueck liegenschaft; do
            echo
            echo "### Spalten von $e"
            ogrinfo -so /tmp/probe.gpkg "$e" 2>&1 | sed -n '/^[a-z_]*:/p'
            echo "--- Probe"
            ogr2ogr -f CSV /vsistdout/ /tmp/probe.gpkg "$e" \
              -limit 3 -lco GEOMETRY=NO 2>/dev/null || true
          done

      # ---------------------------------------------------------------
      # Nur die Zonennamen
      # ---------------------------------------------------------------
      # Im grossen Lauf geht die Meldung des Lesers zwischen tausend
      # anderen Zeilen unter. Hier steht sie allein.
      - name: Zonentypen lesen
        if: ${{ inputs.schritt == 'zonentypen' }}
        run: |
          set -euo pipefail
          echo "### Alle Dateien der Lieferung"
          # Bisher wurde blind die erste XTF-Datei genommen. In ihr steht
          # keine Typentabelle -- gut möglich, dass sie in einer zweiten
          # liegt, die dabei ist.
          find /tmp/npl -type f -printf '%p  %s Bytes\n' | sort
          echo
          # Auch die XML-Dateien: in der Lieferung liegt
          # "Nutzungsplanung_Catalogue_CH_V1_2_20210901.xml", und genau
          # das ist der Katalog, auf den die Typen verweisen. Bisher
          # wurden nur XTF-Dateien gelesen -- er blieb ungeöffnet.
          echo "### Leser über alle XTF- und XML-Dateien"
          for f in $(find /tmp/npl \( -name '*.xtf' -o -name '*.xml' \) \
                     | sort); do
            echo "-- $f"
            # Nicht kappen: beim letzten Lauf schnitt "head -8" die
            # Liste der Elemente ab, bevor die gesuchte Zeile kam.
            python3 tools/zonentypen.py "$f" "/tmp/typen_$(basename "$f").csv" \
              2>&1 | head -70 || true
          done
          # Die grösste nicht leere Ausgabe gewinnt.
          erg=$(ls -S /tmp/typen_*.csv 2>/dev/null | head -1 || true)
          [ -n "$erg" ] && cp "$erg" /tmp/zonentypen.csv || true
          echo
          echo "### Ergebnis"
          head -10 /tmp/zonentypen.csv

      # =============================================================
      # In die Datenbank
      # =============================================================
      # Bis hierher liegt das Ergebnis als Datei am Lauf. Nützlich wird
      # es erst in der Datenbank hinter wohntraums.life -- dort suchen
      # die Masterliste und der Pipedrive-Abgleich.
      #
      # Je Parzelle gibt es mehrere Zeilen, eine je Zone. Übernommen
      # wird die grösste: sie bestimmt, was auf dem Grundstück gebaut
      # werden darf. Die übrigen Anteile stehen im Text daneben, damit
      # niemand später rätselt, warum die Fläche nicht aufgeht.
      #
      # Adressen liefert die Vermessung nicht mit. "address" ist aber
      # ein Pflichtfeld, deshalb steht dort vorerst die Parzelle --
      # ehrlicher als eine erfundene Strasse, und beim Nachliefern der
      # Gebäudedaten leicht zu erkennen.
      - name: Verschnitt holen
        if: ${{ startsWith(inputs.schritt, 'einspielen') }}
        uses: actions/download-artifact@v4
        with:
          pattern: 'verschnitten-${{ inputs.kanton }}'
          merge-multiple: true
          path: /tmp
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.quelllauf }}
          repository: ${{ github.repository }}

      - name: Einspielen
        if: ${{ startsWith(inputs.schritt, 'einspielen') }}
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail
          [ -n "${DB:-}" ] || { echo "Kein Datenbankzugang."; exit 1; }
          sudo apt-get install -y -qq postgresql-client

          ls -lh /tmp/verschnitten.csv
          echo "Zeilen: $(( $(wc -l < /tmp/verschnitten.csv) - 1 ))"
          head -3 /tmp/verschnitten.csv

          # Erst in eine eigene Tabelle laden. Was dort steht, lässt
          # sich zählen und ansehen, bevor es die 259'000 bestehenden
          # Zeilen berührt.
          psql "$DB" -v ON_ERROR_STOP=1 -X -q -c "
            drop table if exists public.verschnitt_tg;
            create table public.verschnitt_tg (
              egrid text, parzelle text, vermessungskreis text, art text,
              flaeche_m2 numeric, zone_typ text,
              zone_name text, zone_kurz text,
              zone_m2 numeric, anteil_prozent numeric);"

          # Die Kopfzeile entscheidet, welche Spalten es gibt: ohne
          # Zonennamen fehlen zwei davon.
          kopf=$(head -1 /tmp/verschnitten.csv)
          echo "Spalten: $kopf"
          psql "$DB" -v ON_ERROR_STOP=1 -X -q \
            -c "\\copy public.verschnitt_tg ($kopf) from '/tmp/verschnitten.csv' with (format csv, header true)"

          # Ohne Index vergleicht die Datenbank 193'642 Zeilen mit
          # 259'057 -- derselbe Fehler wie beim Verschneiden, nur eine
          # Ebene höher. Der erste Versuch brach nach zwei Minuten ab.
          # Und die Voreinstellung bricht jede längere Abfrage ab;
          # 137'000 Zeilen einzufügen dauert länger als das.
          psql "$DB" -v ON_ERROR_STOP=1 -X -q -c "
            create index on public.verschnitt_tg (egrid);
            analyze public.verschnitt_tg;"

          echo "### Was geladen wurde"
          psql "$DB" -X -q -c "
            select count(*) as zeilen,
                   count(distinct egrid) as parzellen,
                   count(*) filter (where zone_name is not null) as mit_zonenname
            from public.verschnitt_tg;"

          echo "### Die zehn häufigsten Zonen"
          psql "$DB" -X -q -c "
            select coalesce(zone_name, zone_typ) as zone, count(*)
            from public.verschnitt_tg group by 1 order by 2 desc limit 10;"

          if [ "${{ inputs.schritt }}" != "einspielen-schreiben" ]; then
            echo "### Was geschrieben würde"
            # Ein Join, kein Unterausdruck je Zeile: sonst schlägt die
            # Datenbank 137'000 Mal in 259'057 Zeilen nach.
            psql "$DB" -X -q -c "
              set local statement_timeout = '15min';
              with haupt as (
                select distinct on (egrid) egrid
                from public.verschnitt_tg
                where egrid is not null and egrid <> ''
                order by egrid, zone_m2 desc nulls last)
              select count(*) as neue_objekte,
                     count(p.egrid) as davon_schon_vorhanden
              from haupt h
              left join public.properties p on p.egrid = h.egrid;"
            echo ""
            echo "**Probelauf** -- die Tabelle properties wurde nicht berührt."
            exit 0
          fi

          echo "### Schreiben"
          # 137'000 Zeilen, und an jeder hängt der Auslöser, der
          # Ausnützung und Marge rechnet. Das dauert länger als die
          # voreingestellte Frist einer Abfrage.
          psql "$DB" -v ON_ERROR_STOP=1 -X -q -c "
            set local statement_timeout = '30min';
            with haupt as (
              select distinct on (egrid) *
              from public.verschnitt_tg
              where egrid is not null and egrid <> ''
              order by egrid, zone_m2 desc nulls last)
            insert into public.properties
              (address, egrid, plot_number, parzelle, bfs_nr, kanton,
               area, zone, notes)
            select
              'Parzelle ' || coalesce(h.parzelle, '?'),
              h.egrid, h.parzelle, h.parzelle,
              nullif(regexp_replace(coalesce(h.vermessungskreis,''),
                                    '\\D', '', 'g'), ''),
              '$KANTON',
              h.flaeche_m2,
              coalesce(nullif(h.zone_name, ''), h.zone_typ),
              'Zonenanteil ' || coalesce(h.zone_m2::text,'?') || ' m2 ('
                || coalesce(h.anteil_prozent::text,'?') || '%)'
            from haupt h
            on conflict (egrid) where egrid is not null do update set
              parzelle    = coalesce(public.properties.parzelle, excluded.parzelle),
              plot_number = coalesce(public.properties.plot_number, excluded.plot_number),
              bfs_nr      = coalesce(public.properties.bfs_nr, excluded.bfs_nr),
              kanton      = coalesce(public.properties.kanton, excluded.kanton),
              area        = coalesce(public.properties.area, excluded.area),
              zone        = coalesce(public.properties.zone, excluded.zone);"

          echo "### Ergebnis"
          psql "$DB" -X -q -c "
            select kanton, count(*) from public.properties
            group by 1 order by 2 desc;"

      # =============================================================
      # Gebäude- und Wohnungsregister
      # =============================================================
      # Die amtliche Vermessung kennt Parzellen, aber keine Häuser: kein
      # Baujahr, keine Geschosse, keine Adresse. Genau die drei
      # entscheiden am Telefon, ob sich ein Anruf lohnt.
      #
      # Das Register führt der Bund, kantonsweise und frei abrufbar. Es
      # trägt die EGID je Gebäude und die EGRID der Parzelle darunter --
      # damit lässt es sich an den Verschnitt hängen.
      #
      # Der erste Lauf sieht nur nach: welche Dateien, welche Spalten.
      # Auf Spaltennamen zu raten hat in diesem Vorhaben schon genug
      # Läufe gekostet.
      - name: Register ansehen
        if: ${{ startsWith(inputs.schritt, 'gwr') }}
        env:
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail
          klein=$(echo "$KANTON" | tr 'A-Z' 'a-z')
          curl -sSL -o /tmp/gwr.zip \
            "https://public.madd.bfs.admin.ch/${klein}.zip"
          ls -lh /tmp/gwr.zip
          file /tmp/gwr.zip
          mkdir -p /tmp/gwr && unzip -o -q /tmp/gwr.zip -d /tmp/gwr
          echo "### Dateien"
          find /tmp/gwr -type f -printf '%p  %s Bytes\n' | sort
          echo
          for f in /tmp/gwr/*.csv; do
            echo "### $(basename "$f")  --  $(( $(wc -l < "$f") - 1 )) Zeilen"
            head -1 "$f" | tr '\t;' '\n\n' | nl | head -40
            echo "-- erste Zeile:"
            sed -n '2p' "$f" | cut -c1-400
            echo
          done

      # =============================================================
      # Register in die Datenbank
      # =============================================================
      # Je Parzelle stehen mehrere Gebäude im Register. Zusammengefasst
      # wird so, wie beim Anruf gefragt wird: die Adresse und das
      # Baujahr des grössten Hauses -- danach sucht man die Liegenschaft
      # --, die höchste Geschosszahl, und Wohnungen wie Grundfläche
      # aufsummiert, weil beides zusammen die Parzelle beschreibt.
      #
      # Die Kennzahlen sind Schlüssel, keine Wörter: 1004 heisst
      # "Bestehend". Die Übersetzung liegt derselben Lieferung bei.
      - name: Register einspielen
        if: ${{ startsWith(inputs.schritt, 'gwr-') }}
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail
          [ -n "${DB:-}" ] || { echo "Kein Datenbankzugang."; exit 1; }
          sudo apt-get install -y -qq postgresql-client

          klein=$(echo "$KANTON" | tr 'A-Z' 'a-z')
          curl -sSL -o /tmp/gwr.zip \
            "https://public.madd.bfs.admin.ch/${klein}.zip"
          mkdir -p /tmp/gwr && unzip -o -q /tmp/gwr.zip -d /tmp/gwr

          psql "$DB" -v ON_ERROR_STOP=1 -X -q -c "
            drop table if exists public.gwr_gebaeude;
            drop table if exists public.gwr_eingang;
            drop table if exists public.gwr_kodes;
            create table public.gwr_gebaeude (
              egid text, gdekt text, ggdenr text, ggdename text, egrid text,
              lgbkr text, lparz text, lparzsx text, ltyp text, gebnr text,
              gbez text, gkode text, gkodn text, gksce text, gstat text,
              gkat text, gklas text, gbauj text, gbaum text, gbaup text,
              gabbj text, garea text, gvol text, gvolnorm text, gvolsce text,
              gastw text, ganzwhg text, gazzi text, gschutzr text, gebf text,
              gwaerzh1 text, genh1 text, gwaersceh1 text, gwaerdath1 text,
              gwaerzh2 text, genh2 text, gwaersceh2 text, gwaerdath2 text,
              gwaerzw1 text, genw1 text, gwaerscew1 text, gwaerdatw1 text,
              gwaerzw2 text, genw2 text, gwaerscew2 text, gwaerdatw2 text,
              gexpdat text);
            create table public.gwr_eingang (
              egid text, edid text, egaid text, deinr text, esid text,
              strname text, strnamk text, strindx text, strsp text,
              stroffiziel text, dplz4 text, dplzz text, dplzname text,
              dkode text, dkodn text, doffadr text, dexpdat text);
            create table public.gwr_kodes (
              cecodid text, cmerkm text, codtxtld text, codtxtkd text,
              codtxtlf text, codtxtkf text, codtxtli text, codtxtki text,
              cexpdat text);"

          for t in gebaeude:gebaeude_batiment_edificio \
                   eingang:eingang_entree_entrata \
                   kodes:kodes_codes_codici; do
            ziel="public.gwr_${t%%:*}"; datei="/tmp/gwr/${t##*:}.csv"
            echo "-- $ziel aus $(basename "$datei")"
            psql "$DB" -v ON_ERROR_STOP=1 -X -q \
              -c "\\copy $ziel from '$datei' with (format csv, header true, delimiter E'\\t')"
          done

          psql "$DB" -v ON_ERROR_STOP=1 -X -q -c "
            create index on public.gwr_gebaeude (egrid);
            create index on public.gwr_eingang (egid);
            analyze public.gwr_gebaeude; analyze public.gwr_eingang;"

          echo "### Was geladen wurde"
          psql "$DB" -X -q -c "
            select (select count(*) from public.gwr_gebaeude) as gebaeude,
                   (select count(distinct egrid) from public.gwr_gebaeude
                    where egrid <> '') as parzellen,
                   (select count(*) from public.gwr_eingang) as eingaenge;"

          echo "### Wie viele Objekte lassen sich verbinden"
          psql "$DB" -X -q -c "
            set local statement_timeout = '15min';
            select count(*) as treffer
            from public.properties p
            join public.gwr_gebaeude g on g.egrid = p.egrid
            where p.kanton = '$KANTON';"

          if [ "${{ inputs.schritt }}" != "gwr-schreiben" ]; then
            echo ""
            echo "**Probelauf** -- properties wurde nicht berührt."
            exit 0
          fi

          echo "### Schreiben"
          psql "$DB" -v ON_ERROR_STOP=1 -X -q -c "
            set local statement_timeout = '30min';
            with haupt as (
              -- Das grösste Gebäude gibt Adresse und Baujahr; danach
              -- sucht man die Liegenschaft.
              select distinct on (g.egrid)
                     g.egrid, g.egid, g.ggdename, g.ggdenr,
                     nullif(g.gbauj,'')::int  as baujahr,
                     nullif(g.gstat,'')       as gstat,
                     nullif(g.gkat,'')        as gkat,
                     e.strname, e.deinr, e.dplz4, e.dplzname
              from public.gwr_gebaeude g
              left join public.gwr_eingang e
                     on e.egid = g.egid and e.edid = '0'
              where g.egrid <> ''
              order by g.egrid, nullif(g.garea,'')::numeric desc nulls last),
            summe as (
              select egrid,
                     count(*)                                as anzahl,
                     max(nullif(gastw,'')::int)              as geschosse,
                     sum(nullif(ganzwhg,'')::int)            as wohnungen,
                     sum(nullif(garea,'')::numeric)          as flaeche
              from public.gwr_gebaeude where egrid <> '' group by egrid)
            update public.properties p set
              address     = case when p.address like 'Parzelle %'
                                  and h.strname is not null
                                 then trim(h.strname || ' ' ||
                                           coalesce(h.deinr,''))
                                 else p.address end,
              plz         = coalesce(p.plz, h.dplz4),
              gemeinde    = coalesce(p.gemeinde, h.ggdename),
              bfs_nr      = coalesce(p.bfs_nr, h.ggdenr),
              gwr_egid    = coalesce(p.gwr_egid, h.egid),
              baujahr     = coalesce(p.baujahr, h.baujahr),
              geschosse   = coalesce(p.geschosse, s.geschosse),
              wohnungen   = coalesce(p.wohnungen, s.wohnungen),
              gebaeudeflaeche = coalesce(p.gebaeudeflaeche, s.flaeche),
              gebaeude_anzahl = coalesce(p.gebaeude_anzahl, s.anzahl),
              geb_status  = coalesce(p.geb_status, (
                              select k.codtxtld from public.gwr_kodes k
                              where k.cmerkm = 'GSTAT'
                                and k.cecodid = h.gstat)),
              gebaeudeart = coalesce(p.gebaeudeart, (
                              select k.codtxtld from public.gwr_kodes k
                              where k.cmerkm = 'GKAT'
                                and k.cecodid = h.gkat))
            from haupt h join summe s on s.egrid = h.egrid
            where p.egrid = h.egrid and p.kanton = '$KANTON';"

          echo "### Ergebnis"
          psql "$DB" -X -q -c "
            select count(*) as objekte,
                   count(*) filter (where address not like 'Parzelle %')
                     as mit_adresse,
                   count(baujahr) as mit_baujahr,
                   count(geschosse) as mit_geschossen,
                   count(wohnungen) as mit_wohnungen
            from public.properties where kanton = '$KANTON';"

      # =============================================================
      # Zonennamen nachziehen
      # =============================================================
      # In der Zonenfläche steht nur ein Schlüssel wie
      # "x4401_221_gngde". Die Verschneidung hat ihn so übernommen, und
      # so steht er heute in der Datenbank -- unbrauchbar für jemanden,
      # der wissen will, ob dort Wohnen erlaubt ist.
      #
      # Neu verschneiden wäre der teure Weg. Der Schlüssel steht ja
      # schon in der Spalte; es fehlt nur die Übersetzung. Die liest
      # dieser Schritt aus derselben Datei und schreibt sie an die
      # Objekte, die den Schlüssel tragen.
      - name: Zonennamen nachziehen
        if: ${{ startsWith(inputs.schritt, 'zonennamen') }}
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          KANTON: ${{ inputs.kanton }}
        run: |
          set -euo pipefail
          [ -n "${DB:-}" ] || { echo "Kein Datenbankzugang."; exit 1; }
          sudo apt-get install -y -qq postgresql-client

          for f in $(find /tmp/npl \( -name '*.xtf' -o -name '*.xml' \) | sort); do
            python3 tools/zonentypen.py "$f" "/tmp/typen_$(basename "$f").csv" \
              2>&1 | head -3 || true
          done
          # Die grösste Ausgabe gewinnt: die Zonenflächen-Datei trägt
          # die 2'202 Typen, der Katalog nur die 34 des Bundes.
          erg=$(ls -S /tmp/typen_*.csv 2>/dev/null | head -1)
          [ -n "$erg" ] || { echo "Keine Typen gefunden."; exit 1; }
          echo "Verwende $erg mit $(( $(wc -l < "$erg") - 1 )) Typen"
          head -5 "$erg"

          psql "$DB" -v ON_ERROR_STOP=1 -X -q -c "
            drop table if exists public.zonentypen;
            create table public.zonentypen (
              typ_id text, code text, bezeichnung text, abkuerzung text);"
          psql "$DB" -v ON_ERROR_STOP=1 -X -q \
            -c "\\copy public.zonentypen from '$erg' with (format csv, header true)"
          psql "$DB" -v ON_ERROR_STOP=1 -X -q -c "
            create index on public.zonentypen (typ_id);
            analyze public.zonentypen;"

          echo "### Wie viele Objekte tragen noch einen Schlüssel"
          psql "$DB" -X -q -c "
            set local statement_timeout = '15min';
            select count(*) as mit_schluessel,
                   count(t.typ_id) as davon_uebersetzbar
            from public.properties p
            left join public.zonentypen t on t.typ_id = p.zone
            where p.kanton = '$KANTON' and p.zone like 'x%_gngde';"

          echo "### Beispiele"
          psql "$DB" -X -q -c "
            select p.zone as schluessel, t.abkuerzung, t.bezeichnung,
                   count(*)
            from public.properties p
            join public.zonentypen t on t.typ_id = p.zone
            where p.kanton = '$KANTON'
            group by 1,2,3 order by 4 desc limit 12;"

          if [ "${{ inputs.schritt }}" != "zonennamen-schreiben" ]; then
            echo ""
            echo "**Probelauf** -- properties wurde nicht berührt."
            exit 0
          fi

          echo "### Schreiben"
          # Das Kürzel voran, wie es in den Zürcher Zonen steht: beim
          # Telefonieren nennt man "W2", nicht den ganzen Satz.
          psql "$DB" -v ON_ERROR_STOP=1 -X -q -c "
            set local statement_timeout = '30min';
            update public.properties p
               set zone = trim(coalesce(nullif(t.abkuerzung,'') || ' ', '')
                               || coalesce(nullif(t.bezeichnung,''),
                                           t.abkuerzung))
            from public.zonentypen t
            where t.typ_id = p.zone and p.kanton = '$KANTON'
              and coalesce(nullif(t.bezeichnung,''), t.abkuerzung) is not null;"

          echo "### Die zehn häufigsten Zonen danach"
          psql "$DB" -X -q -c "
            select zone, count(*) from public.properties
            where kanton = '$KANTON' group by 1 order by 2 desc limit 10;"
